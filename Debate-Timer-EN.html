<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Debate Timer</title>
<style>
:root{--bg:#0d0d0d;--card:#141414;--border:#222;--input-bg:#1a1a1a;--gold:#ffc000;--text:#eee;--gray:#999;--dark-gray:#555;--blue:#4fa8ee;--green:#6ecd71;--red:#ee5555;--radius:8px;--radius-sm:6px}
body.light{--bg:#f5f5f5;--card:#fff;--border:#e0e0e0;--input-bg:#f0f0f0;--gold:#4f6bed;--text:#222;--gray:#666;--dark-gray:#999;--blue:#4f6bed;--green:#4caf50;--red:#e53935}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:var(--card);padding:14px 24px 14px 80px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative}
header h1{font-size:30px;line-height:1.15;color:var(--gold);position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
header h1{max-width:52%;overflow:hidden;text-overflow:ellipsis}
header h1{max-width:52%;overflow:hidden;text-overflow:ellipsis}
header h1{max-width:52%;overflow:hidden;text-overflow:ellipsis}
header h1{max-width:52%;overflow:hidden;text-overflow:ellipsis}
.home-btn{position:absolute;left:20px}
main{flex:1;overflow-y:auto;padding:8px 8px;max-width:100%;margin:0 auto;width:100%}
main .round-name-center{margin-bottom:8px}
.step-bar{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0 8px 0;flex-wrap:wrap;font-size:13px}
.step-bar .dot{width:10px;height:10px;border-radius:50%;background:var(--border);flex-shrink:0}
.step-bar .dot.done{background:var(--green)}.step-bar .dot.current{background:var(--gold)}
.step-bar .sep{color:var(--dark-gray);font-size:11px}.step-bar .label{color:var(--gray);font-size:12px}
.step-bar .label.current{color:var(--gold);font-weight:bold}.step-bar .label.done{color:var(--green)}
.round-name-center{text-align:center;font-size:18px;color:var(--gold);font-weight:bold;margin-bottom:20px}
.btn{background:var(--card);color:var(--gray);border:1px solid var(--border);padding:10px 20px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--on-accent);border:none;font-weight:bold}.btn.gold:hover{opacity:.85}
body.light .btn.gold{color:var(--on-accent)}
.btn.accent{background:var(--gold);color:var(--on-accent);border:none;font-weight:bold}.btn.accent:hover{opacity:.85}
body.light .btn.accent{color:var(--on-accent)}
.btn-sm{background:var(--card);border:1px solid var(--border);color:var(--gray);padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:inherit}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm.danger{color:var(--red);border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h3{color:var(--gold);font-size:15px;margin:0 0 8px 0;border-bottom:1px solid var(--border);padding-bottom:6px}
.row-inp{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.row-inp label{color:var(--gray);font-size:12px;width:96px;min-width:96px;padding-top:9px;flex-shrink:0}
.row-inp input,.row-inp select{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none}
.row-inp input:focus,.row-inp select:focus{border-color:var(--gold)}
select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none}
.timer-main{text-align:center;padding:8px 4px;background:var(--bg);border-radius:var(--radius);margin-bottom:4px;display:flex;flex-direction:column;justify-content:center;height:22vw}
.timer-main .big-time{font-size:18vw;font-weight:bold;color:var(--gold);font-family:'Consolas',monospace;line-height:1}
.timer-main .big-time.warn{color:var(--red)}.timer-main .big-time.paused{opacity:.5}
.timer-main .sub-label{font-size:max(16px,1.5vw);color:var(--gray);margin-top:4px}
.timer-dual{display:flex;gap:0;justify-content:center;align-items:stretch;padding:0;height:100%}
.timer-dual>div{flex:1;text-align:center;padding:0;border-radius:var(--radius);cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;justify-content:center;align-items:center}
.timer-dual>div.active{background:var(--input-bg);border-color:var(--gold)}
.timer-dual .time{font-size:11vw;font-weight:bold;color:var(--gold);font-family:'Consolas',monospace;line-height:1;white-space:nowrap}
.timer-dual .vs-sep{font-size:max(24px,1.6vw);font-weight:bold;color:var(--gold);align-self:center;flex-shrink:0;padding:0 0}
.timer-dual .time.warn{color:var(--red)}
.timer-ctrl{display:flex;gap:8px;justify-content:center;margin-top:2px;flex-wrap:wrap;padding:0 4%}
.pool-info{display:flex;gap:20px;justify-content:center;font-size:max(14px,1.2vw);color:var(--gray);margin-top:2px;padding:0 4%}
#footer-bar{padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0;display:flex;justify-content:center;background:var(--card);align-items:center;position:relative;gap:8px;flex-wrap:wrap}
#theme-toggle{background:transparent;border:1px solid var(--border);color:var(--gray);padding:10px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit}
#theme-toggle:hover{border-color:var(--gold);color:var(--gold)}
.passive-timer-area{display:none!important}
.timer-split{display:flex;gap:0;justify-content:center;align-items:stretch;padding:0;height:100%}
.timer-split .active-side{flex:3;text-align:center;padding:8px 4px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.timer-split .passive-side{flex:1;text-align:center;padding:4px;border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--input-bg);min-width:70px}
.timer-split .active-side .time{font-size:13vw;font-weight:bold;color:var(--gold);font-family:'Consolas',monospace;line-height:1;white-space:nowrap}
.timer-split .active-side .time.warn{color:var(--red)}
.timer-split .active-side .sub-label{font-size:max(14px,1.4vw);color:var(--gray);margin-bottom:0}
.timer-split .passive-side .p-label{font-size:max(14px,1.4vw);color:var(--gray);margin-bottom:0;white-space:nowrap}
.timer-split .passive-side .p-time{font-size:max(28px,4vw);font-weight:bold;color:var(--blue);font-family:'Consolas',monospace;line-height:1;white-space:nowrap}
.passive-log{display:none!important}
.round-card{transition:opacity .15s,transform .15s}.round-card.dragging{opacity:.4;transform:scale(.98)}
.round-card.drag-over{border-top:3px solid var(--gold)!important;margin-top:-3px}
.drag-handle{cursor:grab;color:var(--dark-gray);font-size:18px;user-select:none;padding:0 4px;line-height:1}
.drag-handle:active{cursor:grabbing}
.hidden{display:none!important}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.text-sm{font-size:12px}.text-gray{color:var(--gray)}
@media(max-width:600px){
  header{padding:10px 14px;flex-wrap:wrap;gap:6px}.home-btn{position:static;margin-right:auto}header .btn-sm{font-size:11px;padding:6px 8px}#theme-toggle{font-size:11px;padding:6px 8px}header h1{font-size:24px;position:static;transform:none;width:100%;max-width:none;text-align:center;order:5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header span{margin-left:auto}
  main{padding:12px}.card{padding:14px}
  .timer-main{height:auto;min-height:140px}.timer-main .big-time{font-size:56px}.timer-dual{height:auto;min-height:120px}.timer-dual .time{font-size:52px}.timer-dual .vs-sep{font-size:18px}.timer-split{height:auto;min-height:120px}.timer-split .active-side .time{font-size:52px}.timer-split .active-side .sub-label{font-size:16px}.timer-split .passive-side .p-time{font-size:32px}.timer-split .passive-side .p-label{font-size:16px}
  .row-inp{flex-direction:column;gap:4px}.row-inp label{padding-top:0}
  .row-inp input[type=number]{width:auto!important;min-width:50px}
  .round-config{flex-direction:column;align-items:stretch;gap:6px}
  .round-config input{width:auto!important;min-width:40px}
}

function playBeep(type){if(muted)return;
  if(type==='end'){
    try{if(!_dingAudio)_dingAudio=new Audio('data:audio/mpeg;base64,'+DING_B64);_dingAudio.currentTime=0;_dingAudio.play();}catch(e){}
  }else{
    try{var C=window.AudioContext||window.webkitAudioContext;var ctx=new C();
      function pip(freq,delay){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.frequency.value=freq;g.gain.value=.25;o.type='square';
        o.start();setTimeout(function(){o.stop();},80);
      }
      if(type==='warn'){pip(800,0);}
      else{pip(800,0);setTimeout(function(){pip(800,150);},150);setTimeout(function(){pip(800,300);},300);setTimeout(function(){pip(1200,450);},450);}
    }catch(e){}
  }
  if(typeof Capacitor!=='undefined'&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications){
    try{Capacitor.Plugins.LocalNotifications.schedule({notifications:[{id:Date.now(),title:'Debate Timer',body:type==='warn'?'30-second warning!':'Time\'s up!',schedule:{at:new Date(Date.now()+100)}}]});}catch(e2){}
  }
}
function toggleTheme(){document.body.classList.toggle('light');}

// Views
function onModeChange(idx,val){
  FORMAT.rounds[idx].mode=val;
  if(val==='2')FORMAT.rounds[idx].speaker='Both';
  else if(FORMAT.rounds[idx].speaker==='Both')FORMAT.rounds[idx].speaker='Pro';
  goFormatEdit();
}
function onSpeakerChange(idx,val){FORMAT.rounds[idx].speaker=val;goFormatEdit();}
function togglePool(val){
  FORMAT.timePool.enabled=val==='1';
  FORMAT.rounds.forEach(function(r){r.fromPool=FORMAT.timePool.enabled;});
  goFormatEdit();
}
function addRound(){
  FORMAT.rounds.push({name:'Round',mode:'1',speaker:'Pro',duration:180,durSec:0,proDuration:120,proSec:0,conDuration:120,conSec:0,passiveLimit:false,passiveDuration:20,fromPool:FORMAT.timePool.enabled});
  goFormatEdit();
}
function deleteRound(i){FORMAT.rounds.splice(i,1);goFormatEdit();}

function goStart(){stopTimer();document.getElementById('header-title').textContent='Debate Timer';VIEW=0;render()}
function goFormatEdit(){stopTimer();VIEW=1;render()}
function goMatch(){stopTimer();clearPassiveHistory();if(!MATCH){if(!FORMAT)return;saveCurrentFormat();MATCH={proPool:FORMAT.timePool.enabled?FORMAT.timePool.pro:0,conPool:FORMAT.timePool.enabled?FORMAT.timePool.con:0,currentRound:0};}VIEW=2;roundIdx=MATCH.currentRound;render()}
function render(){var m=document.getElementById('main'),f=document.getElementById('footer-btns');if(VIEW===0)renderStart(m,f);else if(VIEW===1)renderFormatEdit(m,f);else if(VIEW===2)renderMatch(m,f);}

// Start
function renderStart(m,f){
  f.innerHTML='';
  var h='<div class="start-wrap" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:24px">';
  h+='<div style="font-size:36px">⏱️</div><h2 style="color:var(--gold);font-size:22px">Debate Timer</h2>';
  h+='<p class="text-gray">For single speeches, alternating sides, cross-examination, and time-pool formats</p>';
  h+='<div class="start-actions" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">';
  h+='<button class="btn gold" onclick="newFormat()">New Format</button>';
  if(FORMAT)h+='<button class="btn" onclick="goMatch()">Start with Current Format</button>';
  h+='<button class="btn-sm" onclick="document.getElementById(\'load-fmt\').click()">Load Format File</button>';
  h+='</div><input type="file" id="load-fmt" accept=".json" class="hidden" onchange="loadFormatFile(this)">';
  if(FORMAT)h+='<p class="text-sm text-gray mt-8">Current: '+FORMAT.name+' ('+FORMAT.rounds.length+' rounds'+(FORMAT.timePool.enabled?', time pool':'')+')</p>';
  h+='<div style="margin-top:24px"><button class="btn-sm danger" onclick="clearAll()">Clear All Data</button></div>';
  h+=renderFormatList()+'</div>';m.innerHTML=h;
}
async function exportFormat(){
  if(!FORMAT||!FORMAT.name){alert('Please enter a format name first.');return;}
  var out=JSON.parse(JSON.stringify(FORMAT));delete out._updated;
  var content=JSON.stringify(out,null,2);
  var fname=(FORMAT.name||'Format')+'.json';
  var blob=new Blob(['﻿'+content],{type:'application/json;charset=utf-8'});
  if(typeof Capacitor!=='undefined'&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem){
    try{var C=Capacitor,FS=C.Plugins.Filesystem;
      var result=await FS.writeFile({path:'Debate-Coach/'+fname,data:content,directory:'CACHE',recursive:true,encoding:'utf8'});
      try{var Share=C.Plugins.Share;if(Share&&Share.share)Share.share({title:'Export Format',url:result.uri});}catch(e2){}
      alert('Exported: '+fname);return;
    }catch(e){alert('Export failed: '+e.message);return;}
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();URL.revokeObjectURL(a.href);
}
function clearAll(){if(!confirm('Clear all saved data? This cannot be undone.'))return;if(!confirm('Confirm: Delete all formats and match data?'))return;localStorage.removeItem('debate_fmt_current');try{var list=JSON.parse(localStorage.getItem(FORMATS_KEY)||'[]');list.forEach(function(item){localStorage.removeItem('debate_fmt_'+item.key)});localStorage.removeItem(FORMATS_KEY)}catch(e){}FORMAT=null;MATCH=null;goStart();}
function newFormat(){FORMAT={name:'',proTeam:'',conTeam:'',timePool:{enabled:false,pro:0,con:0},rounds:[]};MATCH=null;goFormatEdit();}
function loadFormatFile(input){if(!input.files||!input.files[0])return;var r=new FileReader();r.onload=function(e){try{var d=JSON.parse(e.target.result);if(d.rounds){FORMAT=d;MATCH=null;saveCurrentFormat();goStart();}}catch(ex){alert('Invalid file.');}};r.readAsText(input.files[0]);input.value='';}

function renderFormatList(){
  try{var list=JSON.parse(localStorage.getItem(FORMATS_KEY)||'[]');if(!list.length)return'';
    var h='<div class="card" style="max-width:500px;text-align:left;margin-top:20px"><h3>Saved Formats</h3>';
    list.forEach(function(item){h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)"><span style="cursor:pointer" onclick="loadSavedFormat(\''+item.key+'\')">'+item.name+' ('+item.count+' rounds'+(item.pool?', time pool':'')+')</span><button class="btn-sm danger" onclick="deleteSavedFormat(\''+item.key+'\')">Delete</button></div>';});
    h+='</div>';return h;
  }catch(e){return'';}
}
function loadSavedFormat(key){try{var s=localStorage.getItem('debate_fmt_'+key);if(s){FORMAT=JSON.parse(s);MATCH=null;saveCurrentFormat();goStart();}}catch(e){}}
function deleteSavedFormat(key){if(!confirm('Delete this format?'))return;localStorage.removeItem('debate_fmt_'+key);try{var list=JSON.parse(localStorage.getItem(FORMATS_KEY)||'[]');list=list.filter(function(x){return x.key!==key});localStorage.setItem(FORMATS_KEY,JSON.stringify(list));}catch(e){}render();}
var dragIdx=-1;
function onDragStart(idx,e){dragIdx=idx;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function onDragEnd(e){e.currentTarget.classList.remove('dragging');dragIdx=-1;document.querySelectorAll('.round-card').forEach(function(c){c.classList.remove('drag-over');});}
function onDragOver(idx,e){e.preventDefault();if(idx!==dragIdx){document.querySelectorAll('.round-card').forEach(function(c){c.classList.remove('drag-over');});e.currentTarget.classList.add('drag-over');}}
function onDragLeave(e){if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('drag-over');}
function onDrop(idx,e){e.preventDefault();e.currentTarget.classList.remove('drag-over');if(dragIdx<0||dragIdx===idx)return;var item=FORMAT.rounds.splice(dragIdx,1)[0];FORMAT.rounds.splice(idx,0,item);dragIdx=-1;goFormatEdit();}

function flushFormatInputs(){
  if(!FORMAT)return;
  var allInputs=document.querySelectorAll('input[type=number]');
  for(var i=0;i<allInputs.length;i++){allInputs[i].dispatchEvent(new Event('input',{bubbles:true}));}
  if(document.activeElement&&document.activeElement.tagName==='INPUT')document.activeElement.blur();
}
function saveCurrentFormat(){if(!FORMAT||!FORMAT.name)return;flushFormatInputs();localStorage.setItem('debate_fmt_current',JSON.stringify(FORMAT));try{var list=JSON.parse(localStorage.getItem(FORMATS_KEY)||'[]');var key='fmt_'+Date.now();localStorage.setItem('debate_fmt_'+key,JSON.stringify(FORMAT));var existing=list.findIndex(function(x){return x.name===FORMAT.name});var entry={key:key,name:FORMAT.name,count:FORMAT.rounds.length,pool:FORMAT.timePool.enabled};if(existing>=0)list[existing]=entry;else list.push(entry);if(list.length>30)list=list.slice(-30);localStorage.setItem(FORMATS_KEY,JSON.stringify(list));}catch(e){}}

// Format Editor
function renderFormatEdit(m,f){
  if(!FORMAT)FORMAT={name:'',proTeam:'',conTeam:'',timePool:{enabled:false,pro:0,con:0},rounds:[]};
  var h='<div class="card"><h3>Custom Format</h3>';
  h+='<div class="row-inp"><label>Title</label><input value="'+esc(FORMAT.name||'')+'" oninput="FORMAT.name=this.value" placeholder="e.g. Tournament name, motion, or team names"></div>';
  // Time pool
  h+='<div class="row-inp"><label>Time Pool</label><select onchange="togglePool(this.value)"><option value="0" '+(FORMAT.timePool.enabled?'':'selected')+'>Disabled</option><option value="1" '+(FORMAT.timePool.enabled?'selected':'')+'>Enabled</option></select>';
  if(FORMAT.timePool.enabled){
    h+='<span style="font-size:12px;color:var(--gray)">Pro Pool</span><input type=number value="'+Math.floor(FORMAT.timePool.pro/60)+'" oninput="FORMAT.timePool.pro=this.value*60+(FORMAT.timePool.pro%60)" style="width:40px" min=0>min<input type=number value="'+(FORMAT.timePool.pro%60)+'" oninput="FORMAT.timePool.pro=Math.floor(FORMAT.timePool.pro/60)*60+(+this.value)" style="width:40px" min=0 max=59>sec';
    h+='<span style="font-size:12px;color:var(--gray);margin-left:8px">Con Pool</span><input type=number value="'+Math.floor(FORMAT.timePool.con/60)+'" oninput="FORMAT.timePool.con=this.value*60+(FORMAT.timePool.con%60)" style="width:40px" min=0>min<input type=number value="'+(FORMAT.timePool.con%60)+'" oninput="FORMAT.timePool.con=Math.floor(FORMAT.timePool.con/60)*60+(+this.value)" style="width:40px" min=0 max=59>sec';
    h+='<button class="btn-sm" onclick="flushFormatInputs();goFormatEdit()" title="Apply pool settings">Apply</button>';
    h+='<p class="text-sm text-gray mt-8">When enabled, each round can be set to deduct from the pool. Remaining pool time is shown in real time during the match.</p>';
  }
  h+='</div>';
  h+='<div class="row-inp"><label>Proposition</label><input value="'+esc(FORMAT.proTeam||'')+'" oninput="FORMAT.proTeam=this.value" placeholder="Team name or side label"></div>';
  h+='<div class="row-inp"><label>Opposition</label><input value="'+esc(FORMAT.conTeam||'')+'" oninput="FORMAT.conTeam=this.value" placeholder="Team name or side label"></div>';
  h+='</div></div>';
  // Rounds
  if(FORMAT.rounds.length===0)h+='<p class="text-gray text-sm" style="text-align:center;padding:20px">No rounds added yet. Click the button below to build your format.</p>';
  FORMAT.rounds.forEach(function(r,i){
    h+='<div class="card round-card" style="padding:12px" draggable="true" ondragstart="onDragStart('+i+',event)" ondragend="onDragEnd(event)" ondragover="onDragOver('+i+',event)" ondragleave="onDragLeave(event)" ondrop="onDrop('+i+',event)"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
    h+='<span class="drag-handle" title="Drag to reorder">⋮⋮</span><b>'+(i+1)+'.</b> <input value="'+esc(r.name)+'" oninput="FORMAT.rounds['+i+'].name=this.value" style="width:100px" placeholder="Round name">';
    h+='<select onchange="onModeChange('+i+',this.value)">'+MODES.map(function(x){return'<option value="'+x.v+'" '+(r.mode===x.v?'selected':'')+'>'+x.t+'</option>';}).join('')+'</select>';
    var speakerOpts=r.mode==='2'?'<option>Both</option>':'<option '+(r.speaker==='Pro'?'selected':'')+'>Pro</option><option '+(r.speaker==='Con'?'selected':'')+'>Con</option>';h+='<select onchange="onSpeakerChange('+i+',this.value)">'+speakerOpts+'</select>';
    if(FORMAT.timePool.enabled){h+='<label style="font-size:12px"><input type=checkbox '+(r.fromPool?'checked':'')+' oninput="FORMAT.rounds['+i+'].fromPool=this.checked;goFormatEdit()">Deduct from Pool</label>';}
    if(!r.fromPool||!FORMAT.timePool.enabled){
      if(r.mode==='2'){h+='Pro <input type=number value="'+Math.floor((r.proDuration||120)/60)+'" oninput="FORMAT.rounds['+i+'].proDuration=this.value*60+FORMAT.rounds['+i+'].proSec" style="width:40px" min=0>min <input type=number value="'+(r.proSec||0)+'" oninput="FORMAT.rounds['+i+'].proSec=+this.value" style="width:40px" min=0 max=59>sec &nbsp;Con <input type=number value="'+Math.floor((r.conDuration||120)/60)+'" oninput="FORMAT.rounds['+i+'].conDuration=this.value*60+FORMAT.rounds['+i+'].conSec" style="width:40px" min=0>min <input type=number value="'+(r.conSec||0)+'" oninput="FORMAT.rounds['+i+'].conSec=+this.value" style="width:40px" min=0 max=59>sec';}
      else{h+='<input type=number value="'+Math.floor((r.duration||180)/60)+'" oninput="FORMAT.rounds['+i+'].duration=this.value*60+FORMAT.rounds['+i+'].durSec" style="width:40px" min=0>min <input type=number value="'+(r.durSec||0)+'" oninput="FORMAT.rounds['+i+'].durSec=+this.value" style="width:40px" min=0 max=59>sec';}
      h+='<button class="btn-sm" onclick="flushFormatInputs();goFormatEdit()" title="Apply time settings">Apply</button>';
    }
    h+='<button class="btn-sm danger" onclick="deleteRound('+i+')">×</button></div>';
    if(r.mode==='3a'){
      h+='<div style="margin-top:6px;display:flex;align-items:center;gap:6px;font-size:12px">';
      h+='<label><input type=checkbox '+(r.passiveLimit?'checked':'')+' oninput="FORMAT.rounds['+i+'].passiveLimit=this.checked;goFormatEdit()"> Limit response time per turn</label>';
      if(r.passiveLimit){
        var pd=(r.passiveDuration||20);
        h+='<input type=number value="'+pd+'" oninput="FORMAT.rounds['+i+'].passiveDuration=+this.value" style="width:40px" min=1 max=999>sec';
      }
      h+='</div>';
    }
    h+='</div>';
  });
  h+='<button class="btn-sm" onclick="addRound()">+ Add Round</button>';
  m.innerHTML=h;
  f.innerHTML='<button class="btn gold" onclick="if(!FORMAT.name){alert(\'Please enter a title first.\');return;}flushFormatInputs();MATCH=null;goMatch()">Save & Start</button><button class="btn-sm" onclick="exportFormat()">Export Format</button><button class="btn" onclick="goStart()">← Back</button>';
}

// Match runner
function renderMatch(m,f){
  stopTimer();
  document.getElementById('header-title').textContent=FORMAT.name||'Debate Timer';
  var r=FORMAT.rounds[roundIdx];MATCH.currentRound=roundIdx;
  if(!r.durSec)r.durSec=0;if(!r.proSec)r.proSec=0;if(!r.conSec)r.conSec=0;
  if(!r.proDuration)r.proDuration=r.duration||180;if(!r.conDuration)r.conDuration=r.duration||180;
  if(r.fromPool&&FORMAT.timePool.enabled){
    MATCH._snapPro=MATCH.proPool;MATCH._snapCon=MATCH.conPool;
    if(r.speaker==='Both'){proRemain=MATCH.proPool;conRemain=MATCH.conPool;}
    else if(r.speaker==='Pro'){proRemain=MATCH.proPool;conRemain=r.mode==='2'?MATCH.conPool:0;}
    else{proRemain=MATCH.conPool;conRemain=r.mode==='2'?MATCH.proPool:0;}
  }else{
    proRemain=r.mode==='2'?(r.proDuration||120):(r.duration||180);
    conRemain=r.mode==='2'?(r.conDuration||120):0;
  }

  var h='<div class="card timer-main">';
  if(r.mode==='2'){
    h+='<div class="timer-dual"><div id="dual-pro" class="active" onclick="switchSide(\'pro\')"><div class="sub-label">'+(FORMAT.proTeam?'Pro · '+FORMAT.proTeam:'Proposition')+'</div><div class="time" id="t-pro">'+fmtTime(proRemain)+'</div></div><div class="vs-sep">VS</div><div id="dual-con" onclick="switchSide(\'con\')"><div class="sub-label">'+(FORMAT.conTeam?'Con · '+FORMAT.conTeam:'Opposition')+'</div><div class="time" id="t-con">'+fmtTime(conRemain)+'</div></div></div>';
  }else if(r.mode==='3a'){
    var isConActive=r.speaker==='Con';
    var activeTeam=isConActive?(FORMAT.conTeam?'Con · '+FORMAT.conTeam:'Opposition'):(FORMAT.proTeam?'Pro · '+FORMAT.proTeam:'Proposition');
    var passiveTeam=isConActive?(FORMAT.proTeam?'Pro · '+FORMAT.proTeam:'Proposition'):(FORMAT.conTeam?'Con · '+FORMAT.conTeam:'Opposition');
    var rev=isConActive?' row-reverse':'';
    var passiveInit=r.passiveLimit&&r.passiveDuration?fmtTime(r.passiveDuration):'0s';
    h+='<div class="timer-split" style="flex-direction:'+rev+'"><div class="active-side"><div class="sub-label">'+activeTeam+' · '+r.name+'</div><div class="time" id="t-main">'+fmtTime(proRemain)+'</div></div><div class="passive-side" style="border-left:'+(isConActive?'0':'')+';border-right:'+(isConActive?'1px solid var(--border)':'')+'"><div class="p-label">'+passiveTeam+' Response</div><div class="p-time" id="passive-time">'+passiveInit+'</div></div></div>';
  }else{
    h+='<div><div class="sub-label">'+(r.speaker==='Pro'?(FORMAT.proTeam?'Pro · '+FORMAT.proTeam:'Proposition'):r.speaker==='Con'?(FORMAT.conTeam?'Con · '+FORMAT.conTeam:'Opposition'):r.speaker)+' · '+r.name+'</div><div class="big-time" id="t-main">'+fmtTime(proRemain)+'</div></div>';
  }
  if(FORMAT.timePool.enabled){h+='<div class="pool-info"><span id="pool-pro">Pro Pool: '+fmtTime(MATCH.proPool)+'</span><span id="pool-con">Con Pool: '+fmtTime(MATCH.conPool)+'</span></div>';}
  h+='</div>'; // close timer-main
  // Controls outside timer card
  if(r.mode==='2'){
    h+='<div class="timer-ctrl"><button class="btn-sm" onclick="testSoundBtn(this)">\u{1F514} Test Beep</button><button class="btn gold" id="btn-toggle" onclick="toggleDual()">Start</button><button class="btn-sm" onclick="if(timerRunning){switchSide(activeSide===\'pro\'?\'con\':\'pro\')}" id="switch-btn">Switch Side</button><button class="btn-sm" onclick="resetRound()">Reset</button><button class="btn-sm" onclick="if(confirm(\'Reset all round timers? Format settings will be preserved.\')){stopTimer();MATCH.proPool=FORMAT.timePool.pro;MATCH.conPool=FORMAT.timePool.con;goMatch()}">Reset All Rounds</button></div>';
  }else{
    h+='<div class="timer-ctrl"><button class="btn-sm" onclick="testSoundBtn(this)">\u{1F514} Test Beep</button><button class="btn gold" id="btn-toggle" onclick="toggleSingle()">Start</button><button class="btn-sm" onclick="resetRound()">Reset</button><button class="btn-sm" onclick="if(confirm(\'Reset all round timers? Format settings will be preserved.\')){stopTimer();MATCH.proPool=FORMAT.timePool.pro;MATCH.conPool=FORMAT.timePool.con;goMatch()}">Reset All Rounds</button></div>';
  }
  m.innerHTML=h;
  if(timerPaused){var btn=document.getElementById('btn-toggle');if(btn)btn.textContent='Pause / Resume';}

  // Step bar above main
  var sbEl=document.getElementById('main').previousElementSibling;
  if(!sbEl||!sbEl.classList.contains('step-bar')){sbEl=document.createElement('div');sbEl.className='step-bar';document.getElementById('main').parentNode.insertBefore(sbEl,document.getElementById('main'));}
  var sbH='<div class="step-bar">';
  FORMAT.rounds.forEach(function(rr,i){var cls=i===roundIdx?' current':'',lc=i===roundIdx?' current':'';if(i<roundIdx){cls=' done';lc=' done'}sbH+='<span class="dot'+cls+'"></span><span class="label'+lc+'">'+(i+1)+'/'+FORMAT.rounds.length+'. '+rr.name+'</span>';if(i<FORMAT.rounds.length-1)sbH+='<span class="sep">--</span>';});
  sbH+='</div>';sbEl.outerHTML=sbH;

  f.innerHTML='';
  f.innerHTML+='<button class="btn" onclick="goMatchRound('+(roundIdx-1)+')">← Prev</button>';
  f.innerHTML+='<button class="btn gold" onclick="goMatchRound('+(roundIdx+1)+')">Next →</button>';
  f.innerHTML+='<button class="btn-sm" style="margin-left:8px" onclick="if(confirm(\'Return to format editor? Current match progress will be saved.\')){stopTimer();goFormatEdit();}">Edit Format</button>';
  f.innerHTML+='<button class="btn-sm danger" style="margin-left:8px" onclick="endMatch()">End Match</button>';
}
function endMatch(){
  stopTimer();
  if(!confirm('End this match?'))return;
  if(FORMAT&&FORMAT.name&&confirm('Export current format "'+FORMAT.name+'"?\n\nChoose Cancel to skip.')){
    exportFormat();
  }
  goStart();
}
function goMatchRound(idx){stopTimer();clearPassiveHistory();if(idx<0||idx>=FORMAT.rounds.length)return;roundIdx=idx;MATCH.currentRound=idx;render();}

// Timer logic
function toggleSingle(){
  if(timerRunning&&!timerPaused){
    stopTimer();timerPaused=true;
    startPassiveTimer();
    updateToggleBtn();return;
  }
  var wasPaused=timerPaused;
  timerPaused=false;
  if(wasPaused)stopPassiveTimer();
  runSingle();updateToggleBtn();
}
function toggleDual(){
  if(timerRunning&&!timerPaused){timerPaused=true;stopTimer();updateToggleBtn();return;}
  timerPaused=false;runDual();updateToggleBtn();
}
function updateToggleBtn(){var btn=document.getElementById('btn-toggle');var sw=document.getElementById('switch-btn');if(!btn)return;if(!timerRunning){btn.textContent='Start';btn.className='btn gold';if(sw){sw.className='btn-sm';}}else if(timerPaused){btn.textContent='Pause / Resume';btn.className='btn gold';if(sw){sw.className='btn-sm';}}else{btn.textContent='Pause / Resume';btn.className='btn';if(sw){sw.className='btn accent';}}}
function runSingle(){
  stopTimer();timerRunning=true;timerPaused=false;
  var r=FORMAT.rounds[roundIdx],fromPool=r.fromPool&&FORMAT.timePool.enabled;
  timerInterval=setInterval(function(){
    proRemain--;var el=document.getElementById('t-main');if(el){el.textContent=fmtTime(proRemain);if(proRemain<=30)el.classList.add('warn');}
    if(fromPool){if(r.speaker==='Pro')MATCH.proPool--;else MATCH.conPool--;updatePoolDisplay();}
    if(proRemain===30)playBeep('warn');
    if(proRemain<=0){stopTimer();stopPassiveTimer();playBeep('end');setTimeout(function(){alert("Time's up!");},250);updateToggleBtn();}
  },1000);
}
function runDual(){
  stopTimer();timerRunning=true;timerPaused=false;activeSide='pro';
  var r=FORMAT.rounds[roundIdx],fromPool=r.fromPool&&FORMAT.timePool.enabled;
  timerInterval=setInterval(function(){
    if(activeSide==='pro'){proRemain--;var el=document.getElementById('t-pro');if(el){el.textContent=fmtTime(proRemain);if(proRemain<=30)el.classList.add('warn');}if(fromPool)MATCH.proPool--;updatePoolDisplay();if(proRemain===30)playBeep('warn');if(proRemain<=0){playBeep('end');activeSide='con';switchSide('con');}}
    else{conRemain--;var el=document.getElementById('t-con');if(el){el.textContent=fmtTime(conRemain);if(conRemain<=30)el.classList.add('warn');}if(fromPool)MATCH.conPool--;updatePoolDisplay();if(conRemain===30)playBeep('warn');if(conRemain<=0){playBeep('end');activeSide='pro';switchSide('pro');}}
    if(proRemain<=0&&conRemain<=0){stopTimer();playBeep('end');setTimeout(function(){alert("Both sides' time is up!");},250);updateToggleBtn();}
  },1000);
}
function updatePoolDisplay(){
  var ep=document.getElementById('pool-pro');if(ep)ep.textContent='Pro Pool: '+fmtTime(MATCH.proPool);
  var ec=document.getElementById('pool-con');if(ec)ec.textContent='Con Pool: '+fmtTime(MATCH.conPool);
}
function resetRound(){
  stopTimer();clearPassiveHistory();
  if(MATCH._snapPro!==undefined){MATCH.proPool=MATCH._snapPro;MATCH.conPool=MATCH._snapCon;}
  goMatch();
}
function switchSide(side){activeSide=side;var ep=document.getElementById('dual-pro'),ec=document.getElementById('dual-con');if(ep)ep.className=side==='pro'?'active':'';if(ec)ec.className=side==='con'?'active':'';}

// Passive side timer (mode 3a)
function startPassiveTimer(){
  if(passiveInterval){clearInterval(passiveInterval);}
  var r=FORMAT.rounds[roundIdx];
  passiveLimitMode=!!(r.passiveLimit&&r.passiveDuration);
  if(passiveLimitMode){
    passiveRemain=r.passiveDuration||20;
  }else{
    passiveElapsed=0;
  }
  updatePassiveDisplay();
  passiveInterval=setInterval(function(){
    if(passiveLimitMode){
      passiveRemain--;
      updatePassiveDisplay();
      if(passiveRemain===30)playBeep('warn');
      if(passiveRemain<=0){stopPassiveTimer();playBeep('end');}
    }else{
      passiveElapsed++;
      updatePassiveDisplay();
    }
  },1000);
}
function stopPassiveTimer(){
  if(passiveInterval){clearInterval(passiveInterval);passiveInterval=null;}
  passiveElapsed=0;passiveRemain=0;passiveLimitMode=false;
  updatePassiveDisplay();
}
function clearPassiveHistory(){
  stopPassiveTimer();
}
function updatePassiveDisplay(){
  var el=document.getElementById('passive-time');
  if(!el)return;
  if(passiveInterval){
    if(passiveLimitMode){
      el.textContent=fmtTime(passiveRemain);
      if(passiveRemain<=30)el.style.color='var(--red)';
      else el.style.color='';
    }else{
      el.textContent=passiveElapsed+'s';
      el.style.color='';
    }
  }else{
    var r=FORMAT.rounds[roundIdx];
    if(r&&r.mode==='3a'&&r.passiveLimit&&r.passiveDuration){
      el.textContent=fmtTime(r.passiveDuration);
      el.style.color='';
    }else{
      el.textContent='0s';
      el.style.color='';
    }
  }
}

(function(){try{var s=localStorage.getItem('debate_fmt_current');if(s)FORMAT=JSON.parse(s);}catch(e){}goStart();})();
if(typeof Capacitor!=='undefined'){var fb=document.getElementById('fullscreen-btn');if(fb)fb.style.display='none';}
</script>
