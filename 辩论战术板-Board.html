<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>辩论战术板</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--border:#e0e0e0;--input:#f0f0f0;--gold:#4f6bed;--text:#222;--gray:#666;--dark-gray:#999;--red:#e53935;--green:#2ea86b;--blue:#4f8fd6;--grid:#e4e4e4;--hover:#fafafa;--shadow:rgba(0,0,0,.08)}
body.dark{--bg:#0d0d0d;--card:#141414;--border:#262626;--input:#1a1a1a;--gold:#ffc000;--text:#eee;--gray:#999;--dark-gray:#555;--red:#ee5555;--green:#6ecd71;--blue:#4fa8ee;--grid:#1e1e1e;--hover:#1b1b1b;--shadow:rgba(0,0,0,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Microsoft YaHei','PingFang SC',sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body{-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}

/* ---------- header ---------- */
header{background:var(--card);padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;position:relative;z-index:20}
header h1{font-size:16px;color:var(--gold);white-space:nowrap}
.btn-sm{background:var(--card);border:1px solid var(--border);color:var(--gray);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm.gold{background:var(--gold);color:var(--on-accent);border:none;font-weight:bold}
body.dark .btn-sm.gold{color:var(--on-accent)}
.btn-sm.gold:hover{opacity:.85}
.btn-sm.danger{color:var(--red);border-color:var(--red)}
.btn-sm.danger:hover{background:var(--red);color:var(--on-func)}
.hd-center{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#boardName{background:var(--input);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;outline:none;max-width:220px;width:100%}
#boardName:focus{border-color:var(--gold)}
#search{background:var(--input);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;outline:none;width:150px}
#search:focus{border-color:var(--gold)}
.hd-right{display:flex;gap:6px;align-items:center}

/* ---------- chipbar ---------- */
.chipbar{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8.5px 12px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin}
.chip-label{font-size:11px;color:var(--dark-gray);white-space:nowrap;margin-right:2px}
.chip{background:var(--input);border:1px solid var(--border);border-radius:14px;padding:5px 11px;font-size:12px;color:var(--text);cursor:pointer;white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--on-accent)}
body.dark .chip.on{color:#000}
.qchip{cursor:grab;touch-action:none}
.chip-sep{width:1px;height:20px;background:var(--border);margin:0 8px;flex-shrink:0}
.pn-sep{border-top:1px solid var(--border);margin:10px 0}
#filterRow{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
.chip-ghost{position:fixed;z-index:70;pointer-events:none;background:var(--gold);color:var(--on-accent);padding:5px 14px;border-radius:16px;font-size:12px;box-shadow:0 4px 14px var(--shadow);white-space:nowrap;transform:translate(-50%,-50%);opacity:.92}
body.dark .chip-ghost{color:#000}

/* ---------- main layout ---------- */
.main{flex:1;display:flex;min-height:0}
.toolbar{width:52px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;overflow-y:auto;z-index:10}
.tb{width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--gray);font-size:15px;cursor:pointer;font-family:inherit;transition:all .12s;flex-shrink:0;line-height:1}
.tb:hover{background:var(--input);color:var(--gold);border-color:var(--border)}
.tb.on{background:var(--gold);color:var(--on-accent)}
body.dark .tb.on{color:#000}
.tb-sep{width:26px;height:1px;background:var(--border);margin:4px 0;flex-shrink:0}

/* ---------- stage / world ---------- */
#stage{flex:1;position:relative;overflow:hidden;background:var(--bg);touch-action:none;min-width:0}
#stage.text-mode{cursor:crosshair}
#world{position:absolute;left:0;top:0;width:8192px;height:8192px;pointer-events:none;transform-origin:0 0;background-image:radial-gradient(circle,var(--grid) 1.2px,transparent 1.3px);background-size:24px 24px}
#svgLinks{position:absolute;left:0;top:0;width:20000px;height:20000px;overflow:visible;pointer-events:none}
#svgLinks .link-hit{pointer-events:stroke}
#svgLinks rect[data-link-id]{pointer-events:all;cursor:pointer}
#svgLinks [data-shape-id]{pointer-events:all}
#svgLinks [data-resize]{pointer-events:all;cursor:nwse-resize}
#svgLinks text{pointer-events:none}
#svgLinks .link-vis{pointer-events:none}
#cardLayer,#textLayer{position:absolute;left:0;top:0;width:0;height:0}

/* ---------- cards ---------- */
.card{position:absolute;width:220px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--dark-gray);border-radius:10px;box-shadow:0 2px 8px var(--shadow);cursor:grab;user-select:none;transition:box-shadow .12s;pointer-events:auto;padding:0}
.card:hover{box-shadow:0 4px 14px var(--shadow)}
.card.dragging{opacity:.92;cursor:grabbing}
.card.sel{box-shadow:0 0 0 2px var(--gold),0 4px 14px var(--shadow)}
.card.untyped{border-style:solid;border-left-style:dashed}
.card.dim{opacity:.18;pointer-events:none}
.card.editing{cursor:text;user-select:text;box-shadow:0 0 0 2px var(--gold),0 4px 14px var(--shadow)}
.card-head{display:flex;align-items:center;gap:6px;padding:9px 10px 3px}
.c-ico{font-size:calc(15px * var(--fscale));line-height:1}
.c-type{font-size:calc(11px * var(--fscale));font-weight:700;flex:1;letter-spacing:.3px}
.c-role{font-size:calc(10px * var(--fscale));font-weight:700;padding:1px 8px;border-radius:8px;background:var(--gold);color:var(--on-accent);white-space:nowrap;flex-shrink:0}
body.dark .c-role{color:#000}
.c-dur{font-size:calc(10px * var(--fscale));font-weight:700;padding:1px 8px;border-radius:8px;background:var(--blue);color:var(--on-func);white-space:nowrap;flex-shrink:0}
.c-done{color:var(--green);font-size:calc(13px * var(--fscale))}
.c-title{font-size:calc(14px * var(--fscale));font-weight:700;padding:2px 10px 4px;white-space:pre-wrap;word-break:break-word;min-height:20px;line-height:1.45;outline:none;border-radius:4px}
.c-body{font-size:calc(13px * var(--fscale));color:var(--gray);padding:0 10px 9px;white-space:pre-wrap;word-break:break-word;min-height:18px;line-height:1.55;outline:none;border-radius:4px}
.c-title:empty::before,.c-body:empty::before{content:attr(data-ph);color:var(--dark-gray);opacity:.65;font-weight:400}
.c-title:focus,.c-body:focus{background:var(--input)}
.c-tags{display:flex;gap:4px;flex-wrap:wrap;padding:0 10px 9px}
.c-tag{font-size:calc(10px * var(--fscale));color:var(--gray);background:var(--input);border:1px solid var(--border);border-radius:8px;padding:1px 7px;white-space:nowrap}
.card .port{position:absolute;right:-10px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);opacity:0;transition:opacity .15s;cursor:crosshair;z-index:3}
.card .port{pointer-events:none}
.card.sel .port,.card:hover .port{opacity:1}
.card.sel .port,.card:hover .port{pointer-events:auto}
.card .port:hover{transform:scale(1.25)}
.card .plus-btn{position:absolute;left:-10px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--dark-gray);color:var(--on-func);font-size:11px;line-height:14px;text-align:center;opacity:0;transition:opacity .15s;cursor:pointer;z-index:3;border:2px solid var(--bg)}
body.dark .card .plus-btn{color:#000}
.card .plus-btn{pointer-events:none}
.card.sel .plus-btn,.card:hover .plus-btn{opacity:1}
.card.sel .plus-btn,.card:hover .plus-btn{pointer-events:auto}
.card .plus-btn:hover{background:var(--gold);transform:scale(1.25)}
.card .dup-btn{position:absolute;left:50%;bottom:-8px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--dark-gray);color:var(--on-func);font-size:11px;line-height:14px;text-align:center;opacity:0;transition:opacity .15s;cursor:pointer;z-index:3;border:2px solid var(--bg);font-family:"Segoe UI Symbol","Segoe UI","Noto Sans Symbols2","Apple Symbols",sans-serif}
body.dark .card .dup-btn{color:#000}
.card .dup-btn{pointer-events:none}
.card.sel .dup-btn,.card:hover .dup-btn{opacity:1;pointer-events:auto}
.card .dup-btn:hover{background:var(--gold);transform:scale(1.25)}
.card .fold-btn{margin-left:auto;cursor:pointer;font-size:12px;color:var(--gray);padding:0 2px;user-select:none;opacity:.65;line-height:1}
.card .fold-btn:hover{color:var(--gold);opacity:1}
.card.folded .c-body,.card.folded .c-tags{display:none}
.card.hfix{display:flex;flex-direction:column}
.card.hfix .c-body{flex:1 1 auto;overflow-y:auto;min-height:0}
.card .del-btn{position:absolute;top:-9px;right:-9px;width:18px;height:18px;border-radius:50%;background:var(--red);color:var(--on-func);font-size:12px;line-height:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .15s;cursor:pointer;z-index:3;border:2px solid var(--bg);box-shadow:0 2px 6px var(--shadow)}
.card.sel .del-btn,.card:hover .del-btn{opacity:1;pointer-events:auto}
.card .del-btn:hover{transform:scale(1.2);background:var(--red)}
.card .rhandle{position:absolute;right:2px;bottom:2px;width:12px;height:12px;cursor:nwse-resize;opacity:0;pointer-events:none;transition:opacity .15s;z-index:3;background:linear-gradient(135deg,transparent 45%,var(--gold) 45%,var(--gold) 55%,transparent 55%)}
.card.sel .rhandle,.card:hover .rhandle{opacity:1;pointer-events:auto}

#world{--fscale:1}
/* ---------- text annotations ---------- */
.text-el{position:absolute;min-width:70px;cursor:grab;font-size:calc(16px * var(--fscale));line-height:1.5;color:var(--text);padding:3px 7px;border-radius:6px;white-space:pre-wrap;word-break:break-word;user-select:none;border:1px dashed transparent;pointer-events:auto;transition:box-shadow .12s}
.text-el.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.text-el.dim{opacity:.2;pointer-events:none}
.text-el.editing{user-select:text;cursor:text;border-color:var(--gold);background:var(--input);box-shadow:0 0 0 1px var(--gold)}
.text-el.size-s{font-size:calc(12px * var(--fscale))}
.text-el.size-l{font-size:calc(22px * var(--fscale))}
.text-el:empty::before{content:attr(data-ph);color:var(--dark-gray);opacity:.65}

/* ---------- links ---------- */
.link-g{cursor:pointer}
.link-vis.sel{filter:drop-shadow(0 0 4px var(--gold))}
.link-chip-text{pointer-events:none;user-select:none;font-size:calc(11px * var(--fscale))}

/* ---------- marquee / hold ring ---------- */
#marquee{position:fixed;left:0;top:0;border:1px solid var(--gold);background:rgba(79,107,237,.10);display:none;z-index:5;pointer-events:none}
body.dark #marquee{background:rgba(255,192,0,.10)}
#marquee.intersect{border-style:dashed;border-color:var(--blue);background:rgba(79,168,238,.12)}
#holdRing{position:fixed;left:0;top:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0%),rgba(128,128,128,.28) 0);display:none;z-index:6;pointer-events:none;transform:translate(-50%,-50%)}
#holdRingInner{position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
#tempLabel{position:fixed;left:0;top:0;display:none;z-index:8;background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:6px 8px;box-shadow:0 4px 14px var(--shadow)}
#tempLabel input{background:var(--input);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:5px;font-size:12px;outline:none;width:150px}
#tempLabel input:focus{border-color:var(--gold)}
#tempLabel button{margin-left:5px}

/* ---------- panel ---------- */
#panel{width:300px;flex-shrink:0;background:var(--card);border-left:1px solid var(--border);overflow-y:auto;padding:14px;z-index:15}
@media(min-width:861px){
  #panel.collapsed{display:none}
}
.pn-title{font-size:15px;color:var(--gold);margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:8px}
.field{margin:10px 0}
.field>label{font-size:12px;color:var(--gray);display:block;margin-bottom:5px}
.field input[type=text],.field input:not([type]),.field select,.field textarea{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:13px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.field .hint{font-size:11px;color:var(--dark-gray);margin-top:4px;line-height:1.5}
.stats{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--gray);line-height:1.8;margin:10px 0}
.pn-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.lchips{display:flex;gap:6px;flex-wrap:wrap}
.lchip{padding:5px 11px;border-radius:12px;font-size:12px;border:1px solid var(--border);background:var(--input);cursor:pointer;color:var(--text);transition:all .12s}
.lchip.on{color:var(--on-accent);border-color:transparent;font-weight:700}
.aseg{display:flex;gap:6px}
.aseg button{flex:1;background:var(--input);border:1px solid var(--border);color:var(--gray);padding:8px 0;border-radius:6px;cursor:pointer;font-size:16px;transition:all .12s}
.aseg button.on{border-color:var(--gold);color:var(--gold);background:var(--card)}
.pn-align .aseg button{height:34px;padding:0;line-height:34px;font-size:16px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0}
.sw.on{border-color:var(--gold);transform:scale(1.15)}
.sw.auto{background:linear-gradient(135deg,var(--gray) 45%,var(--card) 45%,var(--card) 55%,var(--gray) 55%)}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tchip{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--input);border:1px solid var(--border);color:var(--gray);cursor:pointer}
.tchip.on{background:var(--gold);color:var(--on-accent);border-color:var(--gold)}
body.dark .tchip.on{color:#000}
.chk-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer}

/* ---------- status ---------- */
#status{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 12px;font-size:12px;color:var(--gray);background:var(--card);border-top:1px solid var(--border);white-space:nowrap}
#status span{overflow:hidden;text-overflow:ellipsis}
#statHint{text-align:center;flex:1}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h2{color:var(--gold);font-size:18px;margin-bottom:12px}
.modal h3{color:var(--gold);font-size:14px;margin:16px 0 8px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.modal .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
.modal .grid-3 label{font-size:12px;color:var(--gray);display:block;margin-bottom:4px}
.modal input[type=text],.modal input[type=password],.modal select,.modal textarea{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;outline:none}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--gold)}
.modal textarea{resize:vertical;line-height:1.55}
.modal-close{position:sticky;top:0;float:right;background:var(--card);border:1px solid var(--border);color:var(--gray);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;z-index:2}
.issue{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:13px;line-height:1.5}
.issue.warn{border-color:var(--red);background:rgba(229,57,53,.06)}
.issue.info{border-color:var(--gold);background:rgba(255,192,0,.05)}
.issue.ok{border-color:var(--green);background:rgba(46,168,107,.06);color:var(--gray)}
.issue .ic{font-size:15px;flex-shrink:0}
.issue .txt{flex:1}
.issue .jump{flex-shrink:0}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin-bottom:12px}
.tab{padding:8px 16px;cursor:pointer;color:var(--gray);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--gold);border-color:var(--gold);font-weight:700}
#aiOut{background:var(--input);border:1px solid var(--border);border-radius:8px;min-height:180px;max-height:320px;overflow:auto;padding:12px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-top:10px}
.rec{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12px}
.rec .rec-meta{color:var(--gray);margin-bottom:4px}
.rec .rec-prev{color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:56px;overflow:hidden;margin-bottom:6px;opacity:.85}
.rec .rec-actions{display:flex;gap:6px}
.board-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.board-row:hover{border-color:var(--gold)}
.board-row .b-name{flex:1;font-size:14px;font-weight:600}
.board-row .b-meta{font-size:11px;color:var(--gray)}
.board-row .b-actions{display:flex;gap:5px}
.help-kbd{background:var(--input);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:12px;font-family:Consolas,monospace}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);color:var(--text);padding:10px 20px;border-radius:8px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;font-size:13px;box-shadow:0 4px 16px var(--shadow);max-width:80vw;text-align:center}
#toast.show{opacity:1}

/* ---------- responsive ---------- */
@media(max-width:860px){
  header{padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));gap:8px;flex-wrap:wrap}
  header h1{font-size:14px}
  .hd-center{order:3;flex-basis:100%;min-width:0}
  #boardName{max-width:none}
  #search{width:auto;flex:1}
  #panel{position:fixed;right:0;top:0;bottom:0;width:min(86vw,320px);transform:translateX(105%);transition:transform .2s;box-shadow:-8px 0 30px rgba(0,0,0,.2);z-index:40;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:env(safe-area-inset-bottom)}
  #panel.open{transform:translateX(0)}
  .toolbar{width:46px}
  .tb{width:34px;height:34px;font-size:14px}
  #statHint{display:none}
  #status{padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .grid-3{grid-template-columns:1fr}
  .modal{padding:16px 14px}
  .modal .row{flex-direction:column;align-items:stretch}
  .modal .row .btn-sm{width:100%}
}
</style>
<script>
(function(){

<header>
  <button class="btn-sm" onclick="window.location.href='toolbox.html'" data-i18n="home" data-i18n-title="homeTitle">主页</button>
  <h1 data-i18n="titleName">辩论战术板</h1>
  <div class="hd-center">
    <input id="boardName" value="" data-i18n-title="boardNameF" placeholder="" onchange="pBoardField('name',this.value)">
    <input id="search" data-i18n-ph="searchPh" placeholder="" oninput="onSearch(this.value)">
  </div>
  <span class="hd-right">
    <button class="btn-sm" onclick="toggleFilterRow()" data-i18n="filter" data-i18n-title="filterTitle">筛选</button>
    <button class="btn-sm" onclick="openBoards()" data-i18n="boards" data-i18n-title="boardsTitle">战术板</button>
    <button class="btn-sm" onclick="togglePanel()" data-i18n="panel" data-i18n-title="panelTitle">属性</button>
    <button class="btn-sm" id="btnLang" onclick="toggleLang()" data-i18n="langBtn" title=""></button>
    <button class="btn-sm" id="btnTheme" onclick="toggleTheme()" data-i18n="theme">界面颜色</button>
  </span>
</header>

<div id="filterRow" class="hidden"></div>
<div class="chipbar" id="chipbar"></div>

<div class="main">
  <div class="toolbar">
    <button class="tb" onclick="newCardAtCenter()" data-i18n-title="newCardT">＋</button>
    <button class="tb" id="tbText" onclick="toggleTextMode()" data-i18n-title="textT">文</button>
    <button class="tb" id="tbShapeRect" onclick="toggleShape('rect')" data-i18n-title="rectT">▭</button>
    <button class="tb" id="tbShapeEllipse" onclick="toggleShape('ellipse')" data-i18n-title="ellipseT">◯</button>
    <button class="tb" id="tbShapeLine" onclick="toggleShape('line')" data-i18n-title="lineT">╱</button>
    <div class="tb-sep"></div>
    <button class="tb" onclick="undo()" data-i18n-title="undo">↶</button>
    <button class="tb" onclick="redo()" data-i18n-title="redo">↷</button>
    <div class="tb-sep"></div>
    <button class="tb" onclick="fit()" data-i18n-title="fitT">⤢</button>
    <button class="tb" onclick="zoomAtCenter(0.8)" data-i18n-title="zoomOut">−</button>
    <button class="tb" onclick="zoomAtCenter(1.25)" data-i18n-title="zoomIn">＋</button>
    <button class="tb" id="tbFont" onclick="toggleFontScale()" data-i18n-title="fontScaleT">Aa</button>
    <div class="tb-sep"></div>
    <button class="tb" onclick="openCheck()" data-i18n-title="checkT">✓</button>
    <button class="tb" onclick="openAI()" data-i18n-title="aiT">AI</button>
    <div class="tb-sep"></div>
    <button class="tb" onclick="saveBoard()" data-i18n-title="saveT">存</button>
    <button class="tb" onclick="loadBoard()" data-i18n-title="loadT">载</button>
    <button class="tb" onclick="clearBoard()" data-i18n-title="clearT">清</button>
    <button class="tb" onclick="openExport()" data-i18n-title="exportT">⤓</button>
    <button class="tb" onclick="openHelp()" data-i18n-title="helpT">?</button>
  </div>

  <div id="stage" style="position:relative">
    <div id="originMarker" style="position:absolute;left:0;top:0;width:1px;height:1px;pointer-events:none"></div>
    <div id="world">
      <svg id="svgLinks"></svg>
      <div id="cardLayer"></div>
      <div id="textLayer"></div>
    </div>
    <div id="marquee"></div>
    <div id="holdRing"><div id="holdRingInner"></div></div>
    <div id="tempLabel"><input id="tlInput" data-i18n-ph="labelPh" placeholder="" onkeydown="tlKey(event)"><button class="btn-sm" onclick="tlCommit()">✓</button></div>
  </div>

  <aside id="panel"></aside>
</div>

<div id="status">
  <span id="statLeft"></span>
  <span id="statHint" data-i18n="statusHint"></span>
  <span id="statRight"></span>
</div>

<div id="modalBack" class="modal-back hidden"></div>
<div id="toast"></div>

function $(s){return document.querySelector(s);}

function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function fmtTime(t){try{return new Date(t).toLocaleString('zh-CN',{hour12:false});}catch(e){return '';}}
function typeColor(t){return TYPES[t]?TYPES[t].color:'#999';}
function cardById(id){return board.cards.find(function(c){return c.id===id;});}
function textById(id){return board.texts.find(function(c){return c.id===id;});}
function linkById(id){return board.links.find(function(l){return l.id===id;});}
function cardTitle(id){var c=cardById(id);return c?(c.title||(lang==='en'?'(untitled)':'(无标题)')):(lang==='en'?'(missing)':'(缺失)');}
function linkBetween(a,b){return board.links.some(function(l){return (l.from===a&&l.to===b)||(l.from===b&&l.to===a);});}

/* 连线类型智能建议：只看两端卡片类型角色，与连线方向无关 */
function suggestLinkType(a,b){
  if(!a||!b)return '';
  if(a==='rebut'||b==='rebut')return 'rebut';
  if(a==='absorb'||b==='absorb')return 'absorb';
  if(a==='reverse'||b==='reverse')return 'reverse';
  if(a==='infer'||b==='infer')return 'infer';
  if(a==='evidence'||b==='evidence')return 'evidence';
  if(a==='opp'||b==='opp')return 'rebut';
  if(a==='point'&&b==='point')return 'infer';
  if((a==='point'&&b==='b0')||(a==='b0'&&b==='point'))return 'argue';
  if((a==='b0'&&b==='topic')||(a==='topic'&&b==='b0'))return 'argue';
  if((a==='plan'&&b==='solve')||(a==='solve'&&b==='plan'))return 'argue';
  if((a==='plan'&&b==='feasible')||(a==='feasible'&&b==='plan'))return 'argue';
  if((a==='plan'&&b==='topical')||(a==='topical'&&b==='plan'))return 'argue';
  if((a==='plan'&&b==='altplan')||(a==='altplan'&&b==='plan'))return 'parallel';
  if((a==='altplan'&&b==='minorfix')||(a==='minorfix'&&b==='altplan'))return 'rebut';
  if((a==='pureopp'&&b==='plan')||(a==='plan'&&b==='pureopp'))return 'rebut';
  if((a==='presume'&&b==='need')||(a==='need'&&b==='presume'))return 'rebut';
  if(a==='burden'||b==='burden')return 'argue';
  return 'argue';
}

/* ================= 存储 ================= */
function normalizeCard(c){
  if(!c)return c;
  if(!Array.isArray(c.tags))c.tags=[];
  if(c.title===undefined||c.title===null)c.title='';
  if(c.text===undefined||c.text===null)c.text='';
  if(c.type===undefined||c.type===null)c.type='';
  if(c.role===undefined||c.role===null)c.role='';
  if(c.color===undefined||c.color===null)c.color='';
  return c;
}
function normalizeText(t){
  if(!t)return t;
  if(t.text===undefined||t.text===null)t.text='';
  if(!t.size)t.size='m';
  if(t.color===undefined)t.color='';
  return t;
}
function load(){
  try{var raw=localStorage.getItem(LS); if(raw)store=JSON.parse(raw);}catch(e){}
  var migrated=false;
  if(store&&store.boards){
    store.boards.forEach(function(b){
      (b.cards||[]).forEach(function(c){
        normalizeCard(c);
        if(migrateWelcomeCard(c))migrated=true;
      });
      if(Array.isArray(b.texts))b.texts.forEach(normalizeText);
    });
  }
  if(!store||!store.boards||!store.boards.length){
    store={boards:[],active:null};
    var b=newBoard(lang==='en'?'New Board':'新战术板');
    addTipsCard(b);
    store.boards.push(b); store.active=b.id;
  }
  if(migrated)saveNow();
  var act=store.boards.find(function(b){return b.id===store.active;})||store.boards[0];
  setActive(act.id,true);
}
function migrateWelcomeCard(c){
  var oldTitles=['欢迎使用备赛白板','欢迎使用辩论战术板','Welcome to Debate Tactics Board','Welcome to Debate Tactical Board'];
  if(!c||oldTitles.indexOf(c.title)<0)return false;
  c.type='note';
  c.title=lang==='en'?'Quick Tips':'操作提示';
  c.text=lang==='en'?'Double-click empty space to start\nDrag empty space to move\nHold a card on another card for 0.3s to auto-link':'双击空白处开始\n拖动空白处移动\n卡片重叠 0.3 秒自动连线';
  c.tags=[lang==='en'?'Tips':'操作提示'];
  return true;
}
function save(){
  if(!store)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{if(board)board.updatedAt=Date.now();localStorage.setItem(LS,JSON.stringify(store));}catch(e){}
  },250);
}
function saveNow(){clearTimeout(saveTimer);try{if(board)board.updatedAt=Date.now();localStorage.setItem(LS,JSON.stringify(store));}catch(e){}}
function newBoard(name){
  var n=store.boards.length+1;
  return {id:uid(),name:name||(lang==='en'?'Board '+n:'战术板 '+n),topic:'',side:'',format:'',cards:[],texts:[],links:[],shapes:[],view:{x:60,y:60,scale:1},fontScale:1,createdAt:Date.now(),updatedAt:Date.now()};

function tipsCard(){
  return {id:uid(),type:'note',title:lang==='en'?'Quick Tips':'操作提示',text:lang==='en'?'Double-click empty space to start\nDrag empty space to move\nHold a card on another card for 0.3s to auto-link':'双击空白处开始\n拖动空白处移动\n卡片重叠 0.3 秒自动连线',x:120,y:120,done:false,tags:[lang==='en'?'Tips':'操作提示'],color:'',role:'',dur:null};

function setActive(id,silent){

/* ================= 撤销 / 重做 ================= */
function capture(){return JSON.stringify({cards:board.cards,texts:board.texts,links:board.links,shapes:board.shapes});}
function pushUndo(){
  undoStack.push(capture());
  if(undoStack.length>UNDO_MAX)undoStack.shift();
  redoStack=[];
}
function applySnap(s){
  var d=JSON.parse(s);
  board.cards=d.cards; board.texts=d.texts; board.links=d.links; board.shapes=d.shapes||[];
  save(); render(); renderPanel();
}
function undo(){
  if(editing)commitActive();
  if(!undoStack.length){toast(t('noUndo'));return;}
  redoStack.push(capture());
  applySnap(undoStack.pop());
}
function redo(){
  if(!redoStack.length){toast(t('noRedo'));return;}
  undoStack.push(capture());
  applySnap(redoStack.pop());
}
/* ================= 渲染 ================= */
var renderBusy=false, renderQueued=false, alignOffset={x:0,y:0}, lastAlignWarn=0;
function ensureWorldSize(){
  var maxX=0,maxY=0,minX=1e9,minY=1e9;
  board.cards.forEach(function(c){
    maxX=Math.max(maxX,c.x+cardW(c));maxY=Math.max(maxY,c.y+(cardH[c.id]||90));
    minX=Math.min(minX,c.x);minY=Math.min(minY,c.y);
  });
  board.texts.forEach(function(t){
    var sz=textSizes[t.id]||{w:160,h:40};
    maxX=Math.max(maxX,t.x+sz.w);maxY=Math.max(maxY,t.y+sz.h);
    minX=Math.min(minX,t.x);minY=Math.min(minY,t.y);
  });
  board.shapes.forEach(function(s){
    if(s.kind==='line'){maxX=Math.max(maxX,s.x1,s.x2);maxY=Math.max(maxY,s.y1,s.y2);minX=Math.min(minX,s.x1,s.x2);minY=Math.min(minY,s.y1,s.y2);}
    else{maxX=Math.max(maxX,s.x+(s.w||0));maxY=Math.max(maxY,s.y+(s.h||0));minX=Math.min(minX,s.x);minY=Math.min(minY,s.y);}
  });
  var need=Math.max(2000,Math.max(maxX-minX,maxY-minY)+1000);
  var w=$('#world');
  var cur=parseInt(w.style.width,10)||8192;
  var target=8192;
  while(target<need&&target<32768)target*=2;
  if(target!==cur){w.style.width=target+'px';w.style.height=target+'px';}
}
function refreshAlignOffset(){
  if(!board||!board.cards.length){alignOffset={x:0,y:0};return;}
  var ref=board.cards[0];
  if(drag&&drag.items&&drag.items.length){
    for(var i=0;i<board.cards.length;i++){
      var dc=board.cards[i];
      var isDrag=drag.items.some(function(it){return it.kind==='card'&&it.id===dc.id;});
      if(!isDrag){ref=dc;break;}
    }
  }
  var el0=document.querySelector('#cardLayer .card[data-id="'+ref.id+'"]');
  if(!el0){alignOffset={x:0,y:0};return;}
  var d=el0.getBoundingClientRect();
  var o=stageOrigin();
  var fx=o.x+view.x+ref.x*view.scale;
  var fy=o.y+view.y+ref.y*view.scale;
  var nx=Math.round(d.left-fx), ny=Math.round(d.top-fy);
  if(Math.abs(nx)>3000||Math.abs(ny)>3000)return;
  alignOffset={x:nx,y:ny};
}
function measureAlignOffset(){refreshAlignOffset();}
function checkRenderAlignment(){
  if(!board||!board.cards.length)return;
  var el0=document.querySelector('#cardLayer .card');
  if(!el0)return;
  var c=board.cards[0];
  var dom=el0.getBoundingClientRect();
  var det=cardScreenRect(c);
  var dy=Math.round(det.t-dom.top), dx=Math.round(det.l-dom.left);
  if((Math.abs(dy)>2||Math.abs(dx)>2)&&performance.now()-lastAlignWarn>1000){
    lastAlignWarn=performance.now();
    if(window.console)console.warn('[render-alignment]',JSON.stringify({
      dy:dy,dx:dx,offset:alignOffset,
      view:{x:view.x,y:view.y,s:view.scale},
      css:document.getElementById('world').style.transform,
      stage:{l:stageOrigin().x,t:stageOrigin().y},
      worlds:document.querySelectorAll('#world').length,
      stages:document.querySelectorAll('#stage').length,
      cardInFirstWorld:(el0.closest('#world')===document.getElementById('world')),
      cardParent:(el0.parentElement?el0.parentElement.id:'?'),
      url:location.href
    }));
  }
}
function render(){
  if(renderBusy){renderQueued=true;return;}
  renderBusy=true;
  try{
    $('#world').style.setProperty('--fscale',(board.fontScale||1));
    var fs=board.fontScale||1;
    var fb=$('#tbFont');
    if(fb){fb.classList.toggle('on',fs!==1);fb.title=t('fontScaleT')+' '+(Math.round(fs*100))+'%';}
    try{renderCards();}catch(err){if(window.console)console.error('renderCards:',err);}
    try{renderTexts();}catch(err){if(window.console)console.error('renderTexts:',err);}
    try{renderLinks();}catch(err){if(window.console)console.error('renderLinks:',err);}
    ensureWorldSize();
    updateView();
    updateStatus();
    measureAlignOffset();
    checkRenderAlignment();
  }catch(err){
    if(window.console)console.error('render:',err);
  }finally{
    renderBusy=false;
    if(renderQueued){renderQueued=false;render();}
  }
}
function updateView(){
  var w=$('#world');
  w.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.scale+')';
  void w.offsetHeight;
  var modeName=mode==='text'?t('textModeT'):mode==='shape'?(t('shapeModeT')+'·'+(shapeKind==='rect'?t('rectName'):shapeKind==='ellipse'?t('ellipseName'):t('lineName'))):t('selectMode');

function matchCard(c){
  if(q){
    var hay=((c.title||'')+' '+(c.text||'')+' '+(Array.isArray(c.tags)?c.tags.join(' '):'')+' '+cardTypeName(c)+' '+roleName(c.role)).toLowerCase();
    if(hay.indexOf(q.toLowerCase())<0)return false;
  }
  if(typeFilter.size){
    var key=c.type||'__untyped';
    if(!typeFilter.has(key))return false;
  }
  if(roleFilter.size&&(!c.role||!roleFilter.has(c.role)))return false;
  return true;
}

  if(!q)return true;
  return (t.text||'').toLowerCase().indexOf(q.toLowerCase())>=0;
}

function arrowPath(x,y,angle,col,id){

}
function shapeById(id){return board.shapes.find(function(s){return s.id===id;});}
function moveShapeAbs(s,ox,oy,dx,dy){
  if(s.kind==='line'){
    var lx=s.x2-s.x1, ly=s.y2-s.y1;
    s.x1=ox+dx;s.y1=oy+dy;s.x2=s.x1+lx;s.y2=s.y1+ly;

}
function shapeSvg(s){
  var col=s.color||'var(--gray)';
  var sel=isSel(s.id);
  var sw=sel?2.6:1.6;
  var dash=s.dash?'6 4':'';
  var o='';
  if(s.kind==='rect'){
    o+='<rect data-shape-id="'+s.id+'" x="'+s.x+'" y="'+s.y+'" width="'+s.w+'" height="'+s.h+'" fill="rgba(0,0,0,0.02)" stroke="'+col+'" stroke-width="'+sw+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+' rx="2"/>';
  }else if(s.kind==='ellipse'){
    o+='<ellipse data-shape-id="'+s.id+'" cx="'+(s.x+s.w/2)+'" cy="'+(s.y+s.h/2)+'" rx="'+(s.w/2)+'" ry="'+(s.h/2)+'" fill="rgba(0,0,0,0.02)" stroke="'+col+'" stroke-width="'+sw+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
  }else if(s.kind==='line'){
    var d='M'+s.x1+','+s.y1+' L'+s.x2+','+s.y2;
    o+='<path data-shape-id="'+s.id+'" d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+' style="pointer-events:stroke"/>';
    o+='<path data-shape-id="'+s.id+'" d="'+d+'" fill="none" stroke="transparent" stroke-width="14" style="pointer-events:stroke"/>';
    var a1=Math.atan2(s.y2-s.y1,s.x2-s.x1);
    var a2=Math.atan2(s.y1-s.y2,s.x1-s.x2);
    if(s.arrow===1||s.arrow===3)o+='<path d="M'+s.x2+','+s.y2+' L'+(s.x2+Math.cos(a1+Math.PI*0.85)*10).toFixed(1)+','+(s.y2+Math.sin(a1+Math.PI*0.85)*10).toFixed(1)+' L'+(s.x2+Math.cos(a1-Math.PI*0.85)*10).toFixed(1)+','+(s.y2+Math.sin(a1-Math.PI*0.85)*10).toFixed(1)+' Z" fill="'+col+'" style="pointer-events:none"/>';
    if(s.arrow===2||s.arrow===3)o+='<path d="M'+s.x1+','+s.y1+' L'+(s.x1+Math.cos(a2+Math.PI*0.85)*10).toFixed(1)+','+(s.y1+Math.sin(a2+Math.PI*0.85)*10).toFixed(1)+' L'+(s.x1+Math.cos(a2-Math.PI*0.85)*10).toFixed(1)+','+(s.y1+Math.sin(a2-Math.PI*0.85)*10).toFixed(1)+' Z" fill="'+col+'" style="pointer-events:none"/>';
  }
  if(sel&&s.kind!=='line'){
    o+='<rect data-resize="'+s.id+'" x="'+(s.x+s.w-6)+'" y="'+(s.y+s.h-6)+'" width="12" height="12" fill="var(--gold)" stroke="var(--bg)" stroke-width="1"/>';
  }
  return o;
}
function linkGeom(l){
  var from=cardById(l.from), to=cardById(l.to);
  if(!from||!to)return null;
  var h1=(cardH[from.id]||90)/2, h2=(cardH[to.id]||90)/2;
  var w1=cardW(from), w2=cardW(to);
  var x1=from.x+w1/2, y1=from.y+h1, x2=to.x+w2/2, y2=to.y+h2;
  var dx=x2-x1, dy=y2-y1;
  var e1x,e1y,e2x,e2y;
  if(Math.abs(dx)>=Math.abs(dy)){
    e1x=dx>=0?from.x+w1:from.x; e1y=y1;
    e2x=dx>=0?to.x:to.x+w2; e2y=y2;
  }else{
    e1x=x1; e1y=dy>=0?from.y+(cardH[from.id]||90):from.y;
    e2x=x2; e2y=dy>=0?to.y:to.y+(cardH[to.id]||90);
  }
  var ex=e2x-e1x, ey=e2y-e1y;
  var c1x=e1x+ex*.38, c1y=e1y+ey*.12, c2x=e2x-ex*.38, c2y=e2y-ey*.12;
  var d='M'+e1x.toFixed(1)+','+e1y.toFixed(1)+' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+e2x.toFixed(1)+','+e2y.toFixed(1);
  return {d:d,x1:e1x,y1:e1y,x2:e2x,y2:e2y,c1x:c1x,c1y:c1y,c2x:c2x,c2y:c2y,mx:(e1x+e2x)/2,my:(e1y+e2y)/2};
}
function linkDashed(l){
  return l.dash===true||(l.dash===undefined&&l.type==='infer');
}
function renderLinks(){
  var S=$('#svgLinks');
  var h='';
  board.links.forEach(function(l){
    try{
    var g=linkGeom(l);
    if(!g)return;
    var lt=LINK_TYPES[l.type]||LINK_TYPES[''];
    var col=lt.color;
    var s=isSel(l.id);
    var dash=linkDashed(l)?'7 5':'';
    var op=l.type==='parallel'?'0.7':'1';
    h+='<g class="link-g" data-link-id="'+l.id+'">';
    h+='<path class="link-hit" data-link-id="'+l.id+'" d="'+g.d+'" fill="none" stroke="transparent" stroke-width="14"/>';
    h+='<path class="link-vis'+(s?' sel':'')+'" data-link-id="'+l.id+'" d="'+g.d+'" fill="none" stroke="'+col+'" stroke-width="'+(s?3:2)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+' opacity="'+op+'"/>';
    if(l.arrow===1||l.arrow===3){
      var a=Math.atan2(g.y2-g.c2y,g.x2-g.c2x);
      h+=arrowPath(g.x2,g.y2,a,col,l.id);
    }
    if(l.arrow===2||l.arrow===3){
      var a2=Math.atan2(g.y1-g.c1y,g.x1-g.c1x);
      h+=arrowPath(g.x1,g.y1,a2,col,l.id);
    }
    if(l.type){
      var tw=lt.name.length*13+20, th=18;
      var cy=g.my-16-th/2;
      h+='<rect data-link-id="'+l.id+'" x="'+(g.mx-tw/2).toFixed(1)+'" y="'+cy.toFixed(1)+'" width="'+tw+'" height="'+th+'" rx="'+th/2+'" fill="var(--card)" stroke="'+col+'" stroke-width="1"/>';
      h+='<text class="link-chip-text" x="'+g.mx.toFixed(1)+'" y="'+(cy+th-5).toFixed(1)+'" text-anchor="middle" font-size="11" fill="'+col+'" font-weight="600">'+esc(lt.name)+'</text>';
    }
    if(l.label){
      h+='<text class="link-chip-text" x="'+g.mx.toFixed(1)+'" y="'+(g.my+12).toFixed(1)+'" text-anchor="middle" font-size="11" fill="var(--gray)">'+esc(l.label)+'</text>';
    }
    h+='</g>';
    }catch(err){if(window.console)console.error('renderLinks:',err);}
  });
  board.shapes.forEach(function(s){
    try{h+=shapeSvg(s);}catch(err){if(window.console)console.error('renderShapes:',err);}
  });
  h+='<path id="tempPath" d="" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 4" style="display:none;pointer-events:none"/>';
  h+='<g id="tempShape"></g>';
  try{S.innerHTML=h;}catch(err){if(window.console)console.error('renderLinks:',err);}
}

/* ================= 对齐与分布（测试） ================= */
function alignItems(){
  var out=[];
  sel.ids.forEach(function(id){
    var c=cardById(id);
    if(c){out.push({kind:'card',obj:c,x:c.x,y:c.y,w:cardW(c),h:cardH[id]||90});return;}
    var tx=textById(id);
    if(tx){var sz=textSizes[tx.id]||{w:160,h:40};out.push({kind:'text',obj:tx,x:tx.x,y:tx.y,w:sz.w,h:sz.h});}
  });
  return out;
}
function alignSnap(v){return board.gridSnap?Math.round(v/24)*24:v;}
function alignApply(op){
  var items=alignItems();
  if(items.length<2){toast(t('alignNeedTwo'));return;}
  pushUndo();
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  items.forEach(function(it){minX=Math.min(minX,it.x);minY=Math.min(minY,it.y);maxX=Math.max(maxX,it.x+it.w);maxY=Math.max(maxY,it.y+it.h);});
  if(op==='left'||op==='hcenter'||op==='right'){
    items.forEach(function(it){
      var nx=op==='left'?minX:(op==='right'?maxX-it.w:minX+(maxX-minX)/2-it.w/2);
      it.obj.x=alignSnap(Math.round(nx));
    });
  }else if(op==='top'||op==='vcenter'||op==='bottom'){
    items.forEach(function(it){
      var ny=op==='top'?minY:(op==='bottom'?maxY-it.h:minY+(maxY-minY)/2-it.h/2);
      it.obj.y=alignSnap(Math.round(ny));
    });
  }else if(op==='disth'){
    var s1=items.slice().sort(function(a,b){return a.x-b.x;});
    var tw=0;s1.forEach(function(it){tw+=it.w;});
    var gap=(maxX-minX-tw)/(s1.length-1);
    var cur=minX;
    s1.forEach(function(it){it.obj.x=alignSnap(Math.round(cur));cur+=it.w+gap;});
  }else if(op==='distv'){
    var s2=items.slice().sort(function(a,b){return a.y-b.y;});
    var th=0;s2.forEach(function(it){th+=it.h;});
    var gap=(maxY-minY-th)/(s2.length-1);
    var cur=minY;
    s2.forEach(function(it){it.obj.y=alignSnap(Math.round(cur));cur+=it.h+gap;});
  }else{return;}
  save();render();renderPanel();
  toast(t('alignedOk')+items.length+t('alignedOk2'));
}
function alignGridToggle(){
  board.gridSnap=!board.gridSnap;
  if(board.gridSnap)alignGrid();else{save();renderPanel();toast(t('gridSnapOff'));}
}
function alignGrid(){
  var items=alignItems();
  if(!items.length){toast(t('alignNeedTwo'));return;}
  pushUndo();
  items.forEach(function(it){it.obj.x=Math.round(it.x/24)*24;it.obj.y=Math.round(it.y/24)*24;});
  save();render();renderPanel();
  toast(t('gridSnapOn'));
}

function deleteSelection(){

    board.texts=board.texts.filter(function(t){return ids.indexOf(t.id)<0;});
    board.shapes=board.shapes.filter(function(s){return ids.indexOf(s.id)<0;});
    board.links=board.links.filter(function(l){return ids.indexOf(l.id)<0&&ids.indexOf(l.from)<0&&ids.indexOf(l.to)<0;});
  }

  save(); render(); renderPanel();

function duplicateSelection(){
  if(sel.kind==='none'||!sel.ids.length)return;
  pushUndo();
  var map={}, nids=[];
  var off=36;
  board.cards.forEach(function(c){
    if(sel.ids.indexOf(c.id)<0)return;
    var n={id:uid(),type:c.type,typeCustom:c.typeCustom||'',title:c.title,text:c.text,x:c.x+off,y:c.y+off,done:c.done,tags:(c.tags||[]).slice(),color:c.color,role:c.role,dur:c.dur,w:c.w,h:c.h,fold:c.fold};
    map[c.id]=n.id; nids.push(n.id);
    board.cards.push(n);
  });
  board.texts.forEach(function(t){
    if(sel.ids.indexOf(t.id)<0)return;
    var n={id:uid(),text:t.text,x:t.x+off,y:t.y+off,size:t.size,color:t.color};
    map[t.id]=n.id; nids.push(n.id);
    board.texts.push(n);
  });
  board.shapes.forEach(function(s){
    if(sel.ids.indexOf(s.id)<0)return;
    var n={id:uid(),kind:s.kind,x:s.x,y:s.y,w:s.w,h:s.h,x1:s.x1,y1:s.y1,x2:s.x2,y2:s.y2,color:s.color,dash:s.dash,arrow:s.arrow};
    map[s.id]=n.id; nids.push(n.id);
    board.shapes.push(n);
  });
  var copies=board.links.filter(function(l){return map[l.from]&&map[l.to];});
  copies.forEach(function(l){
    board.links.push({id:uid(),from:map[l.from],to:map[l.to],type:l.type,label:l.label,arrow:l.arrow,auto:l.auto});
  });
  sel={kind:'multi',ids:nids};
  save(); render(); renderPanel();
}

/* ---------- 剪贴板：Ctrl+C / Ctrl+X / Ctrl+V ---------- */
function clipboardIds(){
  var ids=sel.ids.slice();
  ids.slice().forEach(function(id){
    var l=linkById(id);
    if(l)ids.push(l.from,l.to);
  });
  return ids.filter(function(id,i){return ids.indexOf(id)===i;});
}
function buildClipData(ids){
  var cards=board.cards.filter(function(c){return ids.indexOf(c.id)>=0;}).map(cloneBoard);
  var texts=board.texts.filter(function(t){return ids.indexOf(t.id)>=0;}).map(cloneBoard);
  var shapes=board.shapes.filter(function(s){return ids.indexOf(s.id)>=0;}).map(cloneBoard);
  if(!cards.length&&!texts.length&&!shapes.length)return null;
  var cset={};
  cards.forEach(function(c){cset[c.id]=1;});
  var links=board.links.filter(function(l){return cset[l.from]&&cset[l.to];}).map(cloneBoard);
  return {cards:cards,texts:texts,links:links,shapes:shapes};
}
function copySelectionToClip(){
  var ids=clipboardIds();
  if(!ids.length){toast(t('selFirst'));return;}
  var d=buildClipData(ids);
  if(!d){toast(t('cannotCopy'));return;}
  clipData=d;pasteCount=0;pasteBase=null;
  toast(t('copied')+d.cards.length+t('cardsUnit')+(d.texts.length?' / '+d.texts.length+t('textsUnit'):'')+(d.shapes.length?' / '+d.shapes.length+t('shapesUnit'):'')+'（Ctrl+V）');
}
function cutSelectionToClip(){
  var ids=clipboardIds();
  if(!ids.length){toast(t('selFirst'));return;}
  var d=buildClipData(ids);
  if(!d){toast(t('cannotCopy'));return;}
  pushUndo();
  clipData=d;pasteCount=0;pasteBase=null;
  // 剪切：仅删除真正选中的实体；连线带入的端点卡片保留。
  var delIds=sel.ids.slice();
  var objIds=sel.ids.filter(function(id){return !linkById(id);});
  board.links.forEach(function(l){
    if(objIds.indexOf(l.from)>=0||objIds.indexOf(l.to)>=0)delIds.push(l.id);
  });
  var cutCards=0,cutShapes=0,cutLinks=0;
  board.cards.forEach(function(c){if(delIds.indexOf(c.id)>=0)cutCards++;});
  board.shapes.forEach(function(s){if(delIds.indexOf(s.id)>=0)cutShapes++;});
  board.links.forEach(function(l){if(delIds.indexOf(l.id)>=0)cutLinks++;});
  board.cards=board.cards.filter(function(c){return delIds.indexOf(c.id)<0;});
  board.texts=board.texts.filter(function(t){return delIds.indexOf(t.id)<0;});
  board.shapes=board.shapes.filter(function(s){return delIds.indexOf(s.id)<0;});
  board.links=board.links.filter(function(l){return delIds.indexOf(l.id)<0;});
  sel={kind:'none',ids:[]};
  save();render();renderPanel();
  toast(t('cutToast')+(cutCards?cutCards+t('cardsUnit'):'')+(cutShapes?' / '+cutShapes+t('shapesUnit'):'')+(cutLinks?' / '+cutLinks+t('linesUnit'):'')+'（Ctrl+V）');
}
function pasteClip(){
  if(!clipData||(!clipData.cards.length&&!clipData.texts.length&&!clipData.shapes.length)){toast(t('clipEmpty'));return;}
  pushUndo();
  var r=$('#stage').getBoundingClientRect();
  var base=pasteBase||screenToWorld(r.left+r.width/2,r.top+r.height/2);
  if(!pasteBase)pasteBase=base;
  var ox=pasteCount*26, oy=pasteCount*26;
  var minx=1e9,miny=1e9;
  clipData.cards.forEach(function(c){minx=Math.min(minx,c.x);miny=Math.min(miny,c.y);});
  clipData.texts.forEach(function(t){minx=Math.min(minx,t.x);miny=Math.min(miny,t.y);});
  clipData.shapes.forEach(function(s){minx=Math.min(minx,s.kind==='line'?Math.min(s.x1,s.x2):s.x);miny=Math.min(miny,s.kind==='line'?Math.min(s.y1,s.y2):s.y);});
  if(minx===1e9){minx=0;miny=0;}
  var map={},nids=[];
  clipData.cards.forEach(function(c){
    var n={id:uid(),type:c.type,typeCustom:c.typeCustom||'',title:c.title,text:c.text,x:base.x+(c.x-minx)+ox,y:base.y+(c.y-miny)+oy,done:c.done,tags:(c.tags||[]).slice(),color:c.color,role:c.role,dur:c.dur};
    map[c.id]=n.id;nids.push(n.id);board.cards.push(n);
  });
  clipData.texts.forEach(function(t){
    var n={id:uid(),text:t.text,x:base.x+(t.x-minx)+ox,y:base.y+(t.y-miny)+oy,size:t.size||'m',color:t.color||''};
    map[t.id]=n.id;nids.push(n.id);board.texts.push(n);
  });
  clipData.links.forEach(function(l){
    if(!map[l.from]||!map[l.to])return;
    board.links.push({id:uid(),from:map[l.from],to:map[l.to],type:l.type,label:l.label,arrow:l.arrow,auto:l.auto,dash:l.dash});
  });
  clipData.shapes.forEach(function(s){
    var n={id:uid(),kind:s.kind,color:s.color,dash:s.dash,arrow:s.arrow};
    if(s.kind==='line'){
      n.x1=base.x+(s.x1-minx)+ox;n.y1=base.y+(s.y1-miny)+oy;
      n.x2=base.x+(s.x2-minx)+ox;n.y2=base.y+(s.y2-miny)+oy;
    }else{
      n.x=base.x+(s.x-minx)+ox;n.y=base.y+(s.y-miny)+oy;
      n.w=s.w;n.h=s.h;
    }
    board.shapes.push(n);
  });
  pasteCount++;
  if(pasteCount>60){pasteCount=0;pasteBase=null;}
  save();render();
  sel={kind:'multi',ids:nids};renderPanel();
  toast(t('pasted')+clipData.cards.length+t('cardsUnit')+(clipData.texts.length?' / '+clipData.texts.length+t('textsUnit'):'')+(clipData.shapes.length?' / '+clipData.shapes.length+t('shapesUnit'):''));
}

function screenToWorld(cx,cy){

}
function worldToScreen(x,y){

function stageOrigin(){

function newCard(x,y,type){

function fmtDur(sec){
  sec=Math.max(0,Math.round(sec||0));
  var m=Math.floor(sec/60),s=sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function parseDur(v){
  v=String(v||'').trim();
  if(!v)return null;
  if(/^\d+$/.test(v))return parseInt(v,10);
  var m=v.match(/^(\d{1,3})[:：]([0-5]?\d)$/);
  return m?parseInt(m[1],10)*60+parseInt(m[2],10):null;
}

function findFreeSpot(x,y,h){
  var cands=[[x,y],[x,y+h],[x,y-h],[x-CARD_W-40,y]];
  for(var i=0;i<cands.length;i++){
    var ok=true;
    board.cards.forEach(function(c){
      if(!ok)return;
      if(Math.abs(c.x-cands[i][0])<CARD_W+40&&Math.abs(c.y-cands[i][1])<h+40)ok=false;
    });
    if(ok)return {x:cands[i][0],y:cands[i][1]};
  }
  return {x:x,y:y};
}
/* ================= 视图控制 ================= */
function zoomAt(cx,cy,f){
  var ns=clamp(view.scale*f,ZOOM_MIN,ZOOM_MAX);
  var o=stageOrigin();
  var wx=(cx-o.x-view.x)/view.scale, wy=(cy-o.y-view.y)/view.scale;
  view.scale=ns; view.x=cx-o.x-wx*ns; view.y=cy-o.y-wy*ns;
  updateView(); debounceViewSave();
}
function zoomAtCenter(f){
  var r=$('#stage').getBoundingClientRect();
  zoomAt(r.left+r.width/2,r.top+r.height/2,f);
}
function contentBBox(){
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  board.cards.forEach(function(c){
    minX=Math.min(minX,c.x);minY=Math.min(minY,c.y);
    maxX=Math.max(maxX,c.x+cardW(c));maxY=Math.max(maxY,c.y+(cardH[c.id]||90));
  });
  board.texts.forEach(function(t){
    var sz=textSizes[t.id]||{w:160,h:40};
    minX=Math.min(minX,t.x);minY=Math.min(minY,t.y);
    maxX=Math.max(maxX,t.x+sz.w);maxY=Math.max(maxY,t.y+sz.h);
  });
  board.shapes.forEach(function(s){
    if(s.kind==='line'){
      minX=Math.min(minX,s.x1,s.x2);minY=Math.min(minY,s.y1,s.y2);
      maxX=Math.max(maxX,s.x1,s.x2);maxY=Math.max(maxY,s.y1,s.y2);
    }else{
      minX=Math.min(minX,s.x);minY=Math.min(minY,s.y);
      maxX=Math.max(maxX,s.x+s.w);maxY=Math.max(maxY,s.y+s.h);
    }
  });
  if(minX===1e9){return {x:0,y:0,w:400,h:200};}
  return {x:minX,y:minY,w:maxX-minX,h:maxY-minY};
}
function fit(){
  var b=contentBBox();
  var r=$('#stage').getBoundingClientRect();
  var cw=Math.max(r.width-80,200), ch=Math.max(r.height-80,200);
  var s=clamp(Math.min(cw/Math.max(b.w,300),ch/Math.max(b.h,200)),ZOOM_MIN,1.25);
  view.scale=s;
  view.x=(r.width-b.w*s)/2-b.x*s;
  view.y=(r.height-b.h*s)/2-b.y*s;
  updateView(); debounceViewSave();
}
function centerOn(id){
  var o=cardById(id)||textById(id);
  if(!o)return;
  var r=$('#stage').getBoundingClientRect();
  view.scale=clamp(view.scale,0.5,1);
  view.x=r.width/2-(o.x+110)*view.scale;
  view.y=r.height/2-(o.y+50)*view.scale;
  updateView(); debounceViewSave();
}
function debounceViewSave(){clearTimeout(viewTimer);viewTimer=setTimeout(save,400);}

/* ================= 编辑状态 ================= */
function caretEnd(el){
  try{el.focus({preventScroll:true});}catch(e){el.focus();}
  try{
    var r=document.createRange();r.selectNodeContents(el);r.collapse(false);
    var s=window.getSelection();s.removeAllRanges();s.addRange(r);
  }catch(e){}
}
function contentText(el){
  if(!el)return '';
  // innerText 保留块级换行（contenteditable 回车产生的 <div>/<br>）
  var s=el.innerText!==undefined?el.innerText:el.textContent;
  return String(s).replace(/\u00a0/g,' ').replace(/\r\n/g,'\n');
}

/* ---------- 中键平移：document 级双通道（pointer + mousedown 兜底） ---------- */
var midPan=null;
function initMidPan(){
  document.addEventListener('pointerdown',function(e){
    if(e.button===1&&e.target&&e.target.closest&&e.target.closest('#stage')){
      e.preventDefault();
      midPan={pid:e.pointerId,sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y,moved:false};
    }
  },true);
  document.addEventListener('pointermove',function(e){
    if(midPan&&midPan.pid===e.pointerId)moveMidPan(e.clientX,e.clientY);
  },true);
  document.addEventListener('pointerup',function(e){
    if(midPan&&midPan.pid===e.pointerId)endMidPan();
  },true);
  document.addEventListener('pointercancel',function(e){
    if(midPan&&midPan.pid===e.pointerId)endMidPan();
  },true);
  // 兜底：某些设备/浏览器对中键不产生 pointer 事件时走 mousedown
  document.addEventListener('mousedown',function(e){
    if(e.button===1&&e.target&&e.target.closest&&e.target.closest('#stage')&&!midPan){
      e.preventDefault();
      midPan={pid:'mouse',sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y,moved:false};
    }
  },true);
  document.addEventListener('mousemove',function(e){
    if(midPan&&midPan.pid==='mouse')moveMidPan(e.clientX,e.clientY);
  },true);
  document.addEventListener('mouseup',function(e){
    if(midPan&&midPan.pid==='mouse')endMidPan();
  },true);
}
function moveMidPan(cx,cy){
  if(!midPan)return;
  var dx=cx-midPan.sx,dy=cy-midPan.sy;
  if(Math.abs(dx)+Math.abs(dy)>4)midPan.moved=true;
  view.x=midPan.ox+dx;view.y=midPan.oy+dy;
  updateView();
}
function endMidPan(){
  if(midPan&&!midPan.moved)clearSel();
  midPan=null;
  debounceViewSave();
}

function onPD(e){
  // 中键平移由 document 级双通道监听处理（见 initMidPan），这里直接放行不参与常规拖拽
  if(e.button===1)return;
  // 备选平移：右键拖拽 / Alt+左键拖拽（无中键设备可用）
  if(e.button===2||e.altKey){
    e.preventDefault();
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    startPan(e);
    return;
  }
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    if(drag)drag=null;
    cancelHold();
    var pts=Array.from(pointers.values());
    pinch={cx0:(pts[0].x+pts[1].x)/2,cy0:(pts[0].y+pts[1].y)/2,d0:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),s0:view.scale};
    return;
  }
  if(window.__diagPointer){
    window.__diagPointer=false;
    var _r=document.getElementById('stage').getBoundingClientRect();
    var _w=document.getElementById('world').getBoundingClientRect();
    var _c0=board.cards[0];
    var _e0=document.querySelector('#cardLayer .card');
    if(window.console)console.warn('[pointer-diag]',JSON.stringify({
      clientX:e.clientX,clientY:e.clientY,target:(t&&(t.id||t.className||t.tagName))||'?',
      stage:{l:_r.left,t:_r.top},world:{l:_w.left,t:_w.top},
      view:{x:view.x,y:view.y,s:view.scale},css:document.getElementById('world').style.transform,
      alignOffset:alignOffset,
      card0:_c0?{x:_c0.x,y:_c0.y,id:_c0.id.slice(0,8)}:null,
      card0Rect:_e0?{l:Math.round(_e0.getBoundingClientRect().left),t:Math.round(_e0.getBoundingClientRect().top)}:null,
      dpr:devicePixelRatio,innerW:innerWidth,innerH:innerHeight,scrollY:window.scrollY,
      visualScale:window.visualViewport?window.visualViewport.scale:null
    }));
  }
  var t=e.target;
  var linkEl=t.closest?t.closest('[data-link-id]'):null;
  var cardEl=t.closest?t.closest('.card'):null;
  var textEl=t.closest?t.closest('.text-el'):null;
  var editableTarget=!!(t.closest&&t.closest('button,input,textarea,[contenteditable="true"]'));
  var inEditCard=!!(editing&&editing.kind==='card'&&cardEl&&editing.id===cardEl.dataset.id);
  var inEditText=!!(editing&&editing.kind==='text'&&textEl&&editing.id===textEl.dataset.id);
  if(!(editableTarget||inEditCard||inEditText))e.preventDefault();
  if(linkEl){startLinkTap(e,linkEl);return;}
  if(t.closest&&t.closest('.del-btn')&&cardEl){handleDelCard(cardEl);return;}
  if(t.closest&&t.closest('.rhandle')&&cardEl){startCardResize(e,cardEl);return;}
  if(t.closest&&t.closest('.plus-btn')&&cardEl){handlePlus(cardEl);return;}
  if(t.closest&&t.closest('.dup-btn')&&cardEl){handleDup(cardEl);return;}
  if(t.closest&&t.closest('.fold-btn')&&cardEl){toggleFold(cardEl.dataset.id);return;}
  if(t.closest&&t.closest('.port')&&cardEl){startPortDrag(e,cardEl);return;}
  if(cardEl){startCardDrag(e,cardEl);return;}
  if(textEl){startTextDrag(e,textEl);return;}
  var resizeEl=t.closest?t.closest('[data-resize]'):null;
  var shapeEl=t.closest?t.closest('[data-shape-id]'):null;
  if(resizeEl){startShapeResize(e,resizeEl);return;}
  if(shapeEl){startShapeTap(e,shapeEl);return;}
  if(mode==='text'){startTapText(e);return;}
  if(spaceDown||e.shiftKey||e.ctrlKey){if(e.shiftKey||e.ctrlKey){startMarquee(e);}else{startPan(e);}return;}
  if(mode==='shape'){startShapeDraw(e);return;}
  startPan(e);
}
function startLinkTap(e,linkEl){
  var chip=!!(e.target.closest&&e.target.closest('rect[data-link-id]'));
  drag={mode:'link',pointerId:e.pointerId,id:linkEl.dataset.linkId,chip:chip,sx:e.clientX,sy:e.clientY,moved:false};
  $('#stage').setPointerCapture(e.pointerId);
  selectLinkById(linkEl.dataset.linkId);
}
function onPM(e){
  var p=pointers.get(e.pointerId);
  if(!p)return;
  p.x=e.clientX;p.y=e.clientY;
  if(pointers.size===2){handlePinch();return;}
  if(!drag||drag.pointerId!==e.pointerId)return;
  if(drag.mode==='pan'){
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
    view.x=drag.ox+dx;view.y=drag.oy+dy;updateView();
  }else if(drag.mode==='marquee'){
    updateMarquee(e);
  }else if(drag.mode==='group'){
    var cdx=(e.clientX-drag.sx)/view.scale, cdy=(e.clientY-drag.sy)/view.scale;
    if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>4)drag.moved=true;
    drag.items.forEach(function(it){
      if(it.kind==='card'){
        var c=cardById(it.id);if(!c)return;
        c.x=drag.orig[it.id].x+cdx;c.y=drag.orig[it.id].y+cdy;
        updateCardEl(c);
      }else if(it.kind==='text'){
        var tt=textById(it.id);if(!tt)return;
        tt.x=drag.orig[it.id].x+cdx;tt.y=drag.orig[it.id].y+cdy;
        updateTextEl(tt);
      }else{
        var s=shapeById(it.id);if(!s)return;
        moveShapeAbs(s,drag.orig[it.id].x,drag.orig[it.id].y,cdx,cdy);
      }
    });
    renderLinks();
    if(drag.items.length===1&&drag.items[0].kind==='card')holdCheck(e);
  }else if(drag.mode==='port'){
    updateTemp(e);
  }else if(drag.mode==='shape-draw'){
    var p=screenToWorld(e.clientX,e.clientY);
    if(Math.abs(p.x-drag.sx)+Math.abs(p.y-drag.sy)>4)drag.moved=true;
    updateShapePreview(drag,p);
  }else if(drag.mode==='shape-resize'){
    var rs=shapeById(drag.id);if(!rs)return;
    rs.w=Math.max(20,drag.ow+(e.clientX-drag.sx)/view.scale);
    rs.h=Math.max(20,drag.oh+(e.clientY-drag.sy)/view.scale);
    renderLinks();
  }else if(drag.mode==='card-resize'){
    var rc=cardById(drag.id);if(!rc)return;
    if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>4)drag.moved=true;
    rc.w=Math.round(clamp(drag.ow+(e.clientX-drag.sx)/view.scale,160,520));
    var dy=(e.clientY-drag.sy)/view.scale;
    if(drag.oh||Math.abs(dy)>4){ rc.h=Math.round(clamp((drag.oh||0)+dy,60,900)); }
    else if(!drag.oh){ delete rc.h; }
    var rel=$('#cardLayer').querySelector('.card[data-id="'+drag.id+'"]');
    if(rel){ rel.style.width=rc.w+'px'; rel.style.height=rc.h?rc.h+'px':''; }
    renderLinks();
  }
}
function onPU(e){
  pointers.delete(e.pointerId);
  if(pinch&&pointers.size<2){pinch=null;debounceViewSave();}
  if(!drag||drag.pointerId!==e.pointerId)return;
  try{
  if(drag.mode==='pan'){
    if(!drag.moved){
      if(isDoubleTap('empty',null,e.clientX,e.clientY)){lastTap=null;dblCreateAt(e.clientX,e.clientY);}
      else{lastTap={kind:'empty',id:null,x:e.clientX,y:e.clientY,t:performance.now()};clearSel();}
    }else lastTap=null;
    debounceViewSave();
  }else if(drag.mode==='marquee'){
    finishMarquee(e);
  }else if(drag.mode==='group'){
    if(!drag.moved&&drag.items.length===1){
      var it0=drag.items[0];
      if(it0.kind==='card'&&isDoubleTap('card',it0.id,e.clientX,e.clientY)){lastTap=null;enterEdit(it0.id);}
      else if(it0.kind==='text'&&isDoubleTap('text',it0.id,e.clientX,e.clientY)){lastTap=null;enterTextEdit(it0.id);}
      else if(it0.kind==='shape'){
        var shp=shapeById(it0.id);
        if(shp&&shp.kind==='line'&&isDoubleTap('shape',it0.id,e.clientX,e.clientY)){lastTap=null;cycleShapeArrow(it0.id);}
        else if(shp&&shp.kind==='line'){lastTap={kind:'shape',id:it0.id,x:e.clientX,y:e.clientY,t:performance.now()};}
        else lastTap=null;
      }
      else lastTap={kind:it0.kind,id:it0.id,x:e.clientX,y:e.clientY,t:performance.now()};
    }else lastTap=null;
    cancelHold();
    render();save();
  }else if(drag.mode==='link'){
    if(!drag.moved){
      if(isDoubleTap('link',drag.id,e.clientX,e.clientY)){
        lastTap=null;
        if(drag.chip)openLinkLabel(drag.id);
        else cycleLinkArrow(drag.id);
      }else{
        lastTap={kind:'link',id:drag.id,x:e.clientX,y:e.clientY,t:performance.now()};
      }
    }else lastTap=null;
  }else if(drag.mode==='port'){
    finishPort(e);
  }else if(drag.mode==='shape-draw'){
    var p=screenToWorld(e.clientX,e.clientY);
    $('#tempShape').innerHTML='';
    var s=null;
    if(drag.moved){
      pushUndo();
      if(drag.kind==='line'){
        s={id:uid(),kind:'line',x1:drag.sx,y1:drag.sy,x2:p.x,y2:p.y,color:'',dash:false,arrow:0};
      }else{
        var x=Math.min(drag.sx,p.x),y=Math.min(drag.sy,p.y);
        s={id:uid(),kind:drag.kind,x:x,y:y,w:Math.max(12,Math.abs(p.x-drag.sx)),h:Math.max(12,Math.abs(p.y-drag.sy)),color:'',dash:false,arrow:0};
      }
    }
    if(s){
      board.shapes.push(s);
      save();render();
      sel={kind:'shape',ids:[s.id]};renderPanel();
    }else{
      if(mode==='shape'){mode='select';updateModeUI();updateView();toast(lang==='en'?'Shape mode off':'已退出图形模式');}
    }
  }else if(drag.mode==='shape-resize'){
    save();render();
  }else if(drag.mode==='card-resize'){
    if(!drag.moved){
      if(isDoubleTap('rh',drag.id,e.clientX,e.clientY)){lastTap=null;resetCardHeight(drag.id);}
      else{lastTap={kind:'rh',id:drag.id,x:e.clientX,y:e.clientY,t:performance.now()};}
    }else lastTap=null;
    save();render();
  }else if(drag.mode==='tap-text'){
    if(!drag.moved){
      var pt=screenToWorld(e.clientX,e.clientY);
      pushUndo();
      var t={id:uid(),text:'',x:pt.x-70,y:pt.y-12,size:'m',color:''};
      board.texts.push(t);
      save();render();
      sel={kind:'text',ids:[t.id]};renderPanel();
      enterTextEdit(t.id);
    }
  }
  }catch(err){if(window.console)console.error(err);}
  finally{drag=null;}
}

function startMarquee(e){

  var o=stageOrigin();

function updateMarquee(e){
  var o=stageOrigin();
  var x1=Math.min(drag.sx,e.clientX)-o.x, y1=Math.min(drag.sy,e.clientY)-o.y;
  var x2=Math.max(drag.sx,e.clientX)-o.x, y2=Math.max(drag.sy,e.clientY)-o.y;
  var m=$('#marquee');
  m.style.left=(Math.min(drag.sx,e.clientX))+'px';m.style.top=(Math.min(drag.sy,e.clientY))+'px';m.style.width=(Math.abs(e.clientX-drag.sx))+'px';m.style.height=(Math.abs(e.clientY-drag.sy))+'px';
  m.classList.toggle('intersect',e.clientX<drag.sx);
}
function finishMarquee(e){
  $('#marquee').style.display='none';
  var x1=Math.min(drag.sx,e.clientX),y1=Math.min(drag.sy,e.clientY);
  var x2=Math.max(drag.sx,e.clientX),y2=Math.max(drag.sy,e.clientY);
  var w1=screenToWorld(x1,y1),w2=screenToWorld(x2,y2);
  var contain=e.clientX>=drag.sx; // 从左往右=完全包含；从右往左=碰撞
  var ids=[];
  board.cards.forEach(function(c){
    var ch=cardH[c.id]||90;
    if(contain?(c.x>=w1.x&&c.x+cardW(c)<=w2.x&&c.y>=w1.y&&c.y+ch<=w2.y):(c.x<w2.x&&c.x+cardW(c)>w1.x&&c.y<w2.y&&c.y+ch>w1.y))ids.push(c.id);
  });
  board.texts.forEach(function(t){
    var sz=textSizes[t.id]||{w:160,h:40};
    if(contain?(t.x>=w1.x&&t.x+sz.w<=w2.x&&t.y>=w1.y&&t.y+sz.h<=w2.y):(t.x<w2.x&&t.x+sz.w>w1.x&&t.y<w2.y&&t.y+sz.h>w1.y))ids.push(t.id);
  });
  board.shapes.forEach(function(s){
    var l,t,r,b;
    if(s.kind==='line'){
      l=Math.min(s.x1,s.x2);t=Math.min(s.y1,s.y2);r=Math.max(s.x1,s.x2);b=Math.max(s.y1,s.y2);
    }else{
      l=s.x;t=s.y;r=s.x+s.w;b=s.y+s.h;
    }
    if(contain?(l>=w1.x&&r<=w2.x&&t>=w1.y&&b<=w2.y):(l<w2.x&&r>w1.x&&t<w2.y&&b>w1.y))ids.push(s.id);
  });
  board.links.forEach(function(l){
    var g=linkGeom(l);
    if(!g)return;
    var lx1=Math.min(g.x1,g.x2,g.c1x,g.c2x), ly1=Math.min(g.y1,g.y2,g.c1y,g.c2y);
    var lx2=Math.max(g.x1,g.x2,g.c1x,g.c2x), ly2=Math.max(g.y1,g.y2,g.c1y,g.c2y);
    if(contain?(lx1>=w1.x&&lx2<=w2.x&&ly1>=w1.y&&ly2<=w2.y):(lx1<w2.x&&lx2>w1.x&&ly1<w2.y&&ly2>w1.y))ids.push(l.id);
  });
  // 已有选择时框选=追加（并集）；无选择时框选=替换
  if(sel.kind!=='none'&&sel.ids.length){
    sel.ids.forEach(function(id){if(ids.indexOf(id)<0)ids.push(id);});
  }
  if(ids.length){
    sel={kind:ids.length>1?'multi':(cardById(ids[0])?'card':textById(ids[0])?'text':shapeById(ids[0])?'shape':'link'),ids:ids};
  }else{sel={kind:'none',ids:[]};}
  render();renderPanel();
}

function buildDragItems(){

function buildDragOrig(items){

  items.forEach(function(it){
    var o=it.kind==='card'?cardById(it.id):it.kind==='text'?textById(it.id):shapeById(it.id);
    if(o)orig[it.id]={x:o.kind==='line'?o.x1:o.x,y:o.kind==='line'?o.y1:o.y};

/* ---------- 悬停 0.5s 自动连线 ---------- */
function cardScreenRect(c){
  refreshAlignOffset();
  var h=cardH[c.id]||90;
  var o=stageOrigin();
  return {l:o.x+view.x+c.x*view.scale+alignOffset.x,t:o.y+view.y+c.y*view.scale+alignOffset.y,r:o.x+view.x+(c.x+cardW(c))*view.scale+alignOffset.x,b:o.y+view.y+(c.y+h)*view.scale+alignOffset.y};
}
function cardAtPoint(px,py,excludeId){
  for(var i=board.cards.length-1;i>=0;i--){
    var c=board.cards[i];
    if(c.id===excludeId)continue;
    var r=cardScreenRect(c);
    if(px>=r.l&&px<=r.r&&py>=r.t&&py<=r.b)return c;
  }
  return null;
}
function showHold(target){
  var r=cardScreenRect(target);
  var ring=$('#holdRing');
  ring.style.left=((r.l+r.r)/2)+'px';
  ring.style.top=((r.t+r.b)/2)+'px';
  ring.style.setProperty('--p','0%');
  ring.style.display='block';
}
function updateHold(p){
  $('#holdRing').style.setProperty('--p',(Math.min(1,p)*100)+'%');
}
function cancelHold(){
  $('#holdRing').style.display='none';
  if(holdTimer){clearInterval(holdTimer);holdTimer=null;}
  if(holdCompleteTimer){clearTimeout(holdCompleteTimer);holdCompleteTimer=null;}
  if(drag)drag.hold=null;
}
function completeHold(){
  if(!drag||!drag.hold||drag.items.length!==1||drag.items[0].kind!=='card')return;
  var dragged=cardById(drag.items[0].id);if(!dragged)return;
  var target=cardById(drag.hold.id);if(!target)return;
  if(linkBetween(target.id,dragged.id)){cancelHold();return;}
  createLink(target.id,dragged.id,true);
  nudgeCard(dragged,target);
  cancelHold();
  toast(t('autoLinked')+cardTitle(target.id)+' → '+cardTitle(dragged.id));
}
function holdCheck(e){
  if(drag.items.length!==1||drag.items[0].kind!=='card')return;
  var els=document.querySelectorAll('#cardLayer .card');
  for(var ei=0;ei<els.length;ei++)cardH[els[ei].dataset.id]=els[ei].offsetHeight;
  var c=cardById(drag.items[0].id);if(!c)return;
  var target=cardAtPoint(e.clientX,e.clientY,c.id);
  if(target){
    if(linkBetween(target.id,c.id)){
      if(drag.hold&&drag.hold.id!==target.id)cancelHold();
      return;
    }
    if(!drag.hold||drag.hold.id!==target.id){
      drag.hold={id:target.id,t0:performance.now()};
      showHold(target);
      clearInterval(holdTimer);clearTimeout(holdCompleteTimer);
      holdTimer=setInterval(function(){if(drag&&drag.hold)updateHold((performance.now()-drag.hold.t0)/HOLD_MS);},50);
      holdCompleteTimer=setTimeout(completeHold,HOLD_MS+40);
    }
    var p=(performance.now()-drag.hold.t0)/HOLD_MS;
    updateHold(p);
    if(p>=1)completeHold();
  }else{
    if(drag.hold)cancelHold();
  }
}
function nudgeCard(c,target){
  var th=cardH[target.id]||90, ch=cardH[c.id]||90;
  var cands=[
    {x:target.x+CARD_W+40,y:target.y},
    {x:target.x,y:target.y+th+30},
    {x:target.x-CARD_W-40,y:target.y},
    {x:target.x,y:target.y-ch-30}
  ];
  for(var i=0;i<cands.length;i++){
    var ok=true;
    board.cards.forEach(function(o){
      if(!ok||o.id===c.id||o.id===target.id)return;
      if(Math.abs(o.x-cands[i].x)<CARD_W+30&&Math.abs(o.y-cands[i].y)<th+30)ok=false;
    });
    if(ok){c.x=cands[i].x;c.y=cands[i].y;updateCardEl(c);return;}
  }
}
function createLink(from,to,noUndo){
  if(linkBetween(from,to)){if(!noUndo)toast(t('alreadyLinked'));return null;}
  if(!noUndo)pushUndo();
  var l={id:uid(),from:from,to:to,type:suggestLinkType((cardById(from)||{}).type,(cardById(to)||{}).type),label:'',arrow:0,auto:true};
  board.links.push(l);
  save();render();
  return l;
}

/* ---------- 捏合缩放 ---------- */
function handlePinch(){
  var pts=Array.from(pointers.values());
  if(pts.length<2||!pinch)return;
  var d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
  var cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2;
  var o=stageOrigin();
  var ns=clamp(pinch.s0*(pinch.d0?d/pinch.d0:1),ZOOM_MIN,ZOOM_MAX);
  var wx=(pinch.cx0-o.x-view.x)/pinch.s0,wy=(pinch.cy0-o.y-view.y)/pinch.s0;
  view.scale=ns;view.x=cx-o.x-wx*ns;view.y=cy-o.y-wy*ns;
  updateView();
}

/* ---------- 双击 / 滚轮 / 键盘 ---------- */
function isDoubleTap(kind,id,x,y){
  if(!lastTap||lastTap.kind!==kind||lastTap.id!==id)return false;
  if(Math.abs(lastTap.x-x)>10||Math.abs(lastTap.y-y)>10)return false;
  if(performance.now()-lastTap.t>350)return false;
  return true;
}
function dblCreateAt(cx,cy){
  var pt=screenToWorld(cx,cy);
  if(mode==='text'){
    pushUndo();
    var tx={id:uid(),text:'',x:pt.x-70,y:pt.y-12,size:'m',color:''};
    board.texts.push(tx);
    save();render();
    sel={kind:'text',ids:[tx.id]};renderPanel();
    enterTextEdit(tx.id);
    return;
  }
  pushUndo();
  var n=newCard(pt.x-CARD_W/2,pt.y-40,'');
  board.cards.push(n);
  save();render();
  sel={kind:'card',ids:[n.id]};renderPanel();
  enterEdit(n.id);
}
function onWheel(e){
  e.preventDefault();
  // 滚轮默认缩放（Ctrl/⌘+滚轮同样缩放，作为兼容保留）
  zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:0.89);
}
function onKey(e){
  var tg=e.target;
  var editingField=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.isContentEditable);
  if(editingField){
    if(e.key==='Escape'){commitActive();}
    return;
  }
  if(e.key==='Escape'){
    if(editing){commitActive();return;}
    if(!$('#modalBack').classList.contains('hidden')){closeModal();return;}
    if(mode==='text'){toggleTextMode();return;}
    if(mode==='shape'){toggleShape(shapeKind);return;}
    clearSel();return;
  }
  var mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();return;}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if(mod&&e.key.toLowerCase()==='c'){e.preventDefault();copySelectionToClip();return;}
  if(mod&&e.key.toLowerCase()==='x'){e.preventDefault();cutSelectionToClip();return;}
  if(mod&&e.key.toLowerCase()==='v'){e.preventDefault();pasteClip();return;}
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSelection();return;}
  if(mod&&e.key.toLowerCase()==='f'){e.preventDefault();$('#search').focus();return;}
  if(mod&&e.key.toLowerCase()==='a'){e.preventDefault();selectAll();return;}
  if(e.key==='Delete'||e.key==='Backspace'){
    if(!$('#modalBack').classList.contains('hidden'))return;
    if(sel.kind!=='none'){e.preventDefault();deleteSelection();}
    return;
  }
  if(e.key==='r'||e.key==='R'){e.preventDefault();toggleShape('rect');return;}
  if(e.key==='c'||e.key==='C'){e.preventDefault();toggleShape('ellipse');return;}
  if(e.key==='l'||e.key==='L'){e.preventDefault();toggleShape('line');return;}
  if(e.key==='n'||e.key==='N'){e.preventDefault();newCardAtCenter();return;}
  if(e.key==='t'||e.key==='T'){e.preventDefault();toggleTextMode();return;}
  if(e.key==='f'||e.key==='F'){e.preventDefault();fit();return;}
  if(e.key==='+'||e.key==='='){zoomAtCenter(1.25);return;}
  if(e.key==='-'||e.key==='_'){zoomAtCenter(0.8);return;}
  if(e.key==='0'){fit();return;}
  if(e.key==='?'){openHelp();return;}
  if(e.code==='Space'&&!e.repeat){spaceDown=true;e.preventDefault();}
}

/* ---------- 快速建卡：点击或拖到画布 ---------- */
var chipDrag=null;
function bindChipDrag(){
  var bar=$('#chipbar');
  bar.addEventListener('pointerdown',onChipPD);
  bar.addEventListener('pointermove',onChipPM);
  bar.addEventListener('pointerup',onChipPU);
  bar.addEventListener('pointercancel',onChipPU);
  // document 级兜底：指针捕获失败或事件重定向时也能收到 move/up
  document.addEventListener('pointermove',onChipPM,true);
  document.addEventListener('pointerup',onChipPU,true);
  document.addEventListener('pointercancel',onChipPU,true);
}
function onChipPD(e){
  var chip=e.target.closest('.qchip');
  if(!chip)return;
  e.preventDefault();
  var type=chip.dataset.type;
  var g=document.createElement('div');
  g.className='chip-ghost';
  g.textContent=(TYPES[type]?TYPES[type].icon+' ':'')+(TYPES[type]?TYPES[type].name:type);
  g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';
  document.body.appendChild(g);
  chipDrag={type:type,id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false,ghost:g};
  chip.setPointerCapture(e.pointerId);
}
function onChipPM(e){
  if(!chipDrag||e.pointerId!==chipDrag.id)return;
  if(Math.abs(e.clientX-chipDrag.sx)+Math.abs(e.clientY-chipDrag.sy)>4)chipDrag.moved=true;
  if(chipDrag.ghost){
    chipDrag.ghost.style.left=(e.clientX+12)+'px';
    chipDrag.ghost.style.top=(e.clientY+14)+'px';
  }
}
function onChipPU(e){
  if(!chipDrag||e.pointerId!==chipDrag.id)return;
  var g=chipDrag.ghost;if(g)g.remove();
  var type=chipDrag.type, moved=chipDrag.moved;
  chipDrag=null;
  if(!moved){quickAdd(type);return;}
  var el=document.elementFromPoint(e.clientX,e.clientY);
  if(el&&el.closest('#stage')){
    var pt=screenToWorld(e.clientX,e.clientY);
    pushUndo();
    var n=newCard(pt.x-CARD_W/2,pt.y-40,type);
    board.cards.push(n);
    save();render();
    sel={kind:'card',ids:[n.id]};renderPanel();
    enterEdit(n.id);
    toast(t('created')+(TYPES[type]?typeName(type):type)+t('created2'));
  }
}
