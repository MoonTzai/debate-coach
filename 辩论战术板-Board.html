function copyTextFallback(text){
  if(typeof text!=='string'||!text)return;
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        toast(t('copiedOk')+'（'+t('copyHint')+'）');
      },function(){});
    }
  }catch(e){}
}
async function smartDownload(blob,name,mime,text){
  // 1) Capacitor 原生应用：Filesystem 写入应用文档目录 + Share 分享（与 debate-coach-web 一致）
  if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Filesystem){
    try{
      var C=window.Capacitor;
      var FS=C.Plugins.Filesystem;
      var Dir=(C.Plugins.Directory&&C.Plugins.Directory.Documents)?C.Plugins.Directory.Documents:'DOCUMENTS';
      var Enc=(C.Plugins.Encoding&&C.Plugins.Encoding.UTF8)?C.Plugins.Encoding.UTF8:'utf8';
      var folder='Debate-Coach';
      var isText=mime&&(mime.indexOf('text/')===0||mime.indexOf('json')>=0||mime.indexOf('html')>=0);
      var opts={path:folder+'/'+name,directory:Dir,recursive:true};
      if(isText){
        opts.data=await blob.text();
        opts.encoding=Enc;
      }else{
        opts.data=await new Promise(function(resolve){
          var reader=new FileReader();
          reader.onload=function(){resolve(String(reader.result).split(',')[1]);};
          reader.readAsDataURL(blob);
        });
      }
      var result=await FS.writeFile(opts);
      var Share=C.Plugins.Share;
      if(Share&&Share.share){
        try{
          await Share.share({title:t('exportShareTitle'),text:t('exportShareText'),files:[result.uri]});
          return;
        }catch(se){}
      }
      toast(t('capSaved')+'Debate-Coach/'+name);
      return;
    }catch(e){console.warn('Capacitor export failed: '+e.message);}
  }
  // 2) 移动端浏览器：系统分享优先
  var iOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  var file=null;
  try{file=new File([blob],name,{type:mime});}catch(e){}
  var canShare=!!(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}));
  if(isMobileUA()&&canShare){
    navigator.share({files:[file],title:name}).then(function(){
      // 原生分享成功（用户选择了保存/发送目标）
    },function(){
      // 用户取消或分享失败 -> 下载兜底；iOS 文本类再给剪贴板兜底
      anchorClick(blob,name,mime);
      if(iOS&&(mime.indexOf('text/')===0||mime.indexOf('json')>=0))copyTextFallback(text);
    });
    return;
  }
  // 3) 桌面/兜底：直接下载
  anchorClick(blob,name,mime);
  if(iOS&&(mime.indexOf('text/')===0||mime.indexOf('json')>=0))copyTextFallback(text);
}
function importJSON(ev){
  var f=ev.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      var list=[];
      if(d&&d.app==='Debate-Board'&&d.board)list.push(d.board);
      else if(d&&Array.isArray(d.boards))list=d.boards;
      else if(d&&Array.isArray(d.cards))list.push(d);
      else{toast(t('importBad'));return;}
      var added=0;
      list.forEach(function(b){
        var nb=remapBoard(b);
        if(nb){store.boards.push(nb);added++;}
      });
      if(added){save();setActive(store.boards[store.boards.length-1].id);closeModal();toast(t('imported')+added+t('imported2'));}
      else toast(t('importFail'));
    }catch(err){toast(t('importErr'));}
  };
  rd.readAsText(f);
  ev.target.value='';
}
function remapBoard(b){
  if(!b||!Array.isArray(b.cards))return null;
  var nb=cloneBoard(b);
  nb.id=uid();
  if(!nb.name)nb.name=lang==='en'?'Imported board':'导入战术板';
  if(nb.cards)nb.cards.forEach(function(c){migrateWelcomeCard(c);normalizeCard(c);});
  if(Array.isArray(nb.texts))nb.texts.forEach(normalizeText);
  var cmap={};
  nb.cards.forEach(function(c){var old=c.id;c.id=uid();cmap[old]=c.id;});
  if(nb.texts)nb.texts.forEach(function(t){t.id=uid();});
  if(nb.shapes)nb.shapes.forEach(function(s){s.id=uid();});
  if(nb.links)nb.links.forEach(function(l){
    if(cmap[l.from])l.from=cmap[l.from];
    if(cmap[l.to])l.to=cmap[l.to];
  });
  nb.view={x:60,y:60,scale:1};
  nb.createdAt=Date.now();nb.updatedAt=Date.now();
  return nb;
}

/* ================= 备赛体检 ================= */
function buildCheck(){
  var issues=[];
  function warn(txt,id){issues.push({lvl:'warn',txt:txt,id:id});}
  function info(txt,id){issues.push({lvl:'info',txt:txt,id:id});}
  function ok(txt){issues.push({lvl:'ok',txt:txt});}
  var byType={};
  TYPE_ORDER.forEach(function(t){byType[t]=[];});
  board.cards.forEach(function(c){if(byType[c.type])byType[c.type].push(c);});
  var done=board.cards.filter(function(c){return c.done;}).length;
  ok(t('checkDone')+done+' / '+board.cards.length+t('checkPct')+(board.cards.length?Math.round(done/board.cards.length*100)+t('checkPct2'):''));
  if(!byType.topic.length)warn(t('checkNoTopic'),null);
  if(!byType.def.length)warn(t('checkNoDef'),null);
  if(!byType.scope.length)info(t('checkNoScope'),null);
  if(!byType.b0.length)warn(t('checkNoB0'),null);
  if(!byType.point.length)info(t('checkNoPoint'),null);
  byType.point.forEach(function(p){
    var hasEv=board.links.some(function(l){return (l.type==='evidence'||l.type==='infer')&&(l.from===p.id||l.to===p.id);});
    if(!hasEv)info(t('checkPointQ')+(p.title||(lang==='en'?'untitled':'无标题'))+t('checkPointQ2')+t('checkNoArg'),p.id);
    var rebs=board.links.filter(function(l){
      return (l.from===p.id||l.to===p.id)&&l.type==='rebut';
    }).map(function(l){return l.from===p.id?l.to:l.from;});
    if(!rebs.length){
      warn(t('checkPointQ')+(p.title||(lang==='en'?'untitled':'无标题'))+t('checkPointQ2')+t('checkNoRebuttal'),p.id);
    }else{
      var tags=new Set();
      rebs.forEach(function(rid){var c=cardById(rid);if(c)(c.tags||[]).forEach(function(tg){if(SUGGEST_TAGS.indexOf(tg)>=0)tags.add(tg);});});
      var missing=[];
      if(!tags.has('事实层'))missing.push(tagName('事实层'));
      if(!tags.has('逻辑层'))missing.push(tagName('逻辑层'));
      if(!tags.has('价值层'))missing.push(tagName('价值层'));
      if(missing.length)info(t('checkPointQ')+(p.title||(lang==='en'?'untitled':'无标题'))+t('checkPointQ2')+t('checkRebMissing')+missing.join(' / ')+t('checkRebTag'),p.id);
    }
  });
  if(!byType.value.length)info(t('checkNoValue'),null);
  if(!byType.opp.length)info(t('checkNoOpp'),null);
  if(byType.opp.length&&!byType.absorb.length&&!byType.reverse.length)warn(t('checkNoClash'),null);
  if(byType.opp.length&&!board.links.some(function(l){return (l.type==='absorb'||l.type==='reverse')&&(l.from&&l.to);}))
    info(t('checkOppNoLink'),null);
  if(!byType.mainline.length)info(t('checkNoMainline'),null);
  var hasOregon=['need','root','plan','feasible','solve','cost'].some(function(t){return byType[t].length;});
  if(hasOregon){
    var om=['need','root','plan','solve'].filter(function(t){return !byType[t].length;}).map(typeName);
    if(om.length)info(t('checkOregonMiss')+om.join(' / '),null);
  }
  var unlinked=board.cards.filter(function(c){return !board.links.some(function(l){return l.from===c.id||l.to===c.id;});});
  if(unlinked.length)info(lang==='en'?unlinked.length+t('checkIsolated'):'有 '+unlinked.length+t('checkIsolated'),unlinked[0]?unlinked[0].id:null);
  var untyped=board.cards.filter(function(c){return !c.type;});
  if(untyped.length)info(lang==='en'?untyped.length+t('checkUntypedN'):'有 '+untyped.length+t('checkUntypedN'),untyped[0]?untyped[0].id:null);
  var roles=new Set();
  board.cards.forEach(function(c){if(c.role)roles.add(c.role);});
  if(!roles.size){
    info(t('checkNoRole'),null);
  }else{
    ['1','2','3','4'].forEach(function(r){
      if(!roles.has(r))info(t('checkRoleMissing')+roleName(r)+t('checkRoleMissing2'),null);
    });
  }
  if(!issues.some(function(i){return i.lvl==='warn';}))ok(t('checkOkAll'));
  return issues;
}
function openCheck(){
  var issues=buildCheck();
  var h='<button class="modal-close" onclick="closeModal()">×</button><h2>'+t('checkTitle')+'</h2>';
  h+='<p style="font-size:13px;color:var(--gray);margin-bottom:12px">'+t('checkSub')+'</p>';

/* ================= Markdown 导出 ================= */
function buildMarkdown(){
  var L=[];
  L.push('# '+t('mdTitle')+board.name);
  L.push('');
  L.push('> '+t('mdFooter')+new Date().toLocaleString(lang==='en'?'en-US':'zh-CN',{hour12:false}));

  L.push('- '+t('mdMotion')+(board.topic||(lang==='en'?'(empty)':'（未填写）')));
  L.push('- '+t('mdSide')+(board.side?(lang==='en'?(board.side==='正方'?'Pro':'Con'):board.side):(lang==='en'?'Unset':'未定')));
  L.push('- '+t('mdFormat')+(board.format?(lang==='en'?(board.format==='传辩'?'Traditional':board.format==='奥瑞冈'?'Oregon':board.format):board.format):(lang==='en'?'Unset':'未定')));
  L.push('');
  var sections=[
    [t('mdSecArg'),['evidence','infer']],
    [t('mdSecTopic'),['topic','def']],
    [t('mdSecScope'),['scope']],
    [t('mdSecCase'),['b0','point','value']],
    [t('mdSecClash'),['opp','rebut','absorb','reverse','mainline','tactic']],
    [t('mdSecOregon'),['need','root','solve','cost']],
    [t('mdSecOther'),['note']]
  ];
  sections.forEach(function(sec){
    var cards=board.cards.filter(function(c){return sec[1].indexOf(c.type)>=0;});
    if(!cards.length)return;
    L.push('## '+sec[0]);
    L.push('');
    cards.forEach(function(c){
    L.push('### '+(c.done?'[✓] ':'[ ] ')+(c.title||(lang==='en'?'(untitled)':'(无标题)'))+'（'+cardTypeName(c)+(c.role?' · '+roleName(c.role):'')+(c.dur?' · '+fmtDur(c.dur):'')+'）');
      if(c.text){L.push('');c.text.split('\n').forEach(function(line){L.push(line);});}
      if(c.tags&&c.tags.length)L.push(t('mdTags')+(c.tags||[]).map(tagName).join('、'));
      var outs=board.links.filter(function(l){return l.from===c.id;});
      if(outs.length){
        L.push(t('mdLinks'));
        outs.forEach(function(l){
          var lt=linkName(l.type);
          var tgt=cardById(l.to);
          L.push('- （'+lt+'）'+(l.label?l.label+' · ':'')+cardTitle(l.to)+'：'+String((tgt&&tgt.text)||'').replace(/\n/g,' ').slice(0,60));
        });
      }
      L.push('');
    });
  });
  if(board.texts.length){
    L.push('## '+t('mdNotes'));
    L.push('');
    board.texts.forEach(function(t){L.push('- '+String(t.text).replace(/\n/g,' '));});
    if(board.shapes.length)L.push('- '+t('mdShapes')+board.shapes.length+t('mdShapes2'));
    L.push('');
  }else if(board.shapes.length){
    L.push('## '+t('mdNotes'));
    L.push('');
    L.push('- '+t('mdShapes')+board.shapes.length+t('mdShapes2'));
    L.push('');
  }
  var unlinked=board.cards.filter(function(c){return !board.links.some(function(l){return l.from===c.id||l.to===c.id;});});
  if(unlinked.length){
    L.push('## '+t('mdUnlinked'));
    L.push('');
    unlinked.forEach(function(c){L.push('- '+(c.title||(lang==='en'?'(untitled)':'(无标题)'))+'（'+cardTypeName(c)+'）');});
    L.push('');
  }
  return L.join('\n');
}

/* ================= PNG 导出 ================= */
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapText(text,ctx,maxW){
  var lines=[];
  String(text).split('\n').forEach(function(para){
    if(!para){lines.push('');return;}
    var cur='';
    for(var i=0;i<para.length;i++){
      var test=cur+para[i];
      if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=para[i];}
      else cur=test;
    }
    if(cur)lines.push(cur);
  });
  return lines;
}
function exportPNG(opts){
  opts=opts||{};
  var b=contentBBox(), pad=56;
  var w=b.w+pad*2, h=b.h+pad*2;
  var s=Math.min(2,4096/Math.max(w,h,1));
  var cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.ceil(w*s));cv.height=Math.max(1,Math.ceil(h*s));
  var ctx=cv.getContext('2d');
  ctx.scale(s,s);ctx.translate(pad-b.x,pad-b.y);
  var dark=document.body.classList.contains('dark');
  var FONT='"Microsoft YaHei","PingFang SC",sans-serif';
  ctx.fillStyle=dark?'#0d0d0d':'#f5f5f5';
  ctx.fillRect(b.x-pad,b.y-pad,w,h);
  ctx.fillStyle=dark?'#1e1e1e':'#e4e4e4';
  var gx=Math.floor((b.x-pad)/24)*24, gy=Math.floor((b.y-pad)/24)*24;
  for(var gxp=gx;gxp<b.x-pad+w;gxp+=24){
    for(var gyp=gy;gyp<b.y-pad+h;gyp+=24){
      ctx.fillRect(gxp-0.5,gyp-0.5,1,1);
    }
  }
  board.shapes.forEach(function(s){
    var col=s.color||(dark?'#999':'#666');
    ctx.strokeStyle=col;ctx.lineWidth=1.8;
    ctx.setLineDash(s.dash?[6,4]:[]);
    if(s.kind==='rect'){
      rr(ctx,s.x,s.y,s.w,s.h,2);ctx.stroke();
    }else if(s.kind==='ellipse'){
      ctx.beginPath();
      ctx.ellipse(s.x+s.w/2,s.y+s.h/2,s.w/2,s.h/2,0,0,Math.PI*2);
      ctx.stroke();
    }else{
      ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
      var a1=Math.atan2(s.y2-s.y1,s.x2-s.x1),a2=Math.atan2(s.y1-s.y2,s.x1-s.x2);
      function tri2(x,y,ang){
        ctx.fillStyle=col;ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x+Math.cos(ang+Math.PI*0.85)*10,y+Math.sin(ang+Math.PI*0.85)*10);
        ctx.lineTo(x+Math.cos(ang-Math.PI*0.85)*10,y+Math.sin(ang-Math.PI*0.85)*10);
        ctx.closePath();ctx.fill();
      }
      if(s.arrow===1||s.arrow===3)tri2(s.x2,s.y2,a1);
      if(s.arrow===2||s.arrow===3)tri2(s.x1,s.y1,a2);
    }
    ctx.setLineDash([]);
  });
  board.links.forEach(function(l){
    var g=linkGeom(l);
    if(!g)return;
    var lt=LINK_TYPES[l.type]||LINK_TYPES[''];
    ctx.strokeStyle=lt.color;ctx.lineWidth=l.type==='parallel'?1.5:2;
    ctx.setLineDash(linkDashed(l)?[7,5]:[]);
    ctx.beginPath();ctx.moveTo(g.x1,g.y1);ctx.bezierCurveTo(g.c1x,g.c1y,g.c2x,g.c2y,g.x2,g.y2);ctx.stroke();
    ctx.setLineDash([]);
    function tri(x,y,ang){
      ctx.fillStyle=lt.color;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(ang+Math.PI*0.85)*9,y+Math.sin(ang+Math.PI*0.85)*9);
      ctx.lineTo(x+Math.cos(ang-Math.PI*0.85)*9,y+Math.sin(ang-Math.PI*0.85)*9);
      ctx.closePath();ctx.fill();
    }
    if(l.arrow===1||l.arrow===3)tri(g.x2,g.y2,Math.atan2(g.y2-g.c2y,g.x2-g.c2x));
    if(l.arrow===2||l.arrow===3)tri(g.x1,g.y1,Math.atan2(g.y1-g.c1y,g.x1-g.c1x));
    if(l.type){
      ctx.font='600 11px '+FONT;
      var tw=ctx.measureText(lt.name).width+16, th=17;
      var cy=g.my-16-th/2;
      ctx.fillStyle=dark?'#141414':'#ffffff';
      rr(ctx,g.mx-tw/2,cy,tw,th,th/2);ctx.fill();
      ctx.strokeStyle=lt.color;ctx.lineWidth=1;
      rr(ctx,g.mx-tw/2,cy,tw,th,th/2);ctx.stroke();
      ctx.fillStyle=lt.color;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(lt.name,g.mx,cy+th/2+1);
      ctx.textAlign='left';ctx.textBaseline='top';
    }
    if(l.label){
      ctx.font='11px '+FONT;ctx.fillStyle=dark?'#999':'#666';
      ctx.textAlign='center';ctx.fillText(l.label,g.mx,g.my+8);ctx.textAlign='left';
    }
  });
  board.cards.forEach(function(c){
    var t=TYPES[c.type];
    var col=c.color||(t?t.color:'#999');
    var x=c.x,y=c.y,ht=cardH[c.id]||90,cw=cardW(c);
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.12)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;
    ctx.fillStyle=dark?'#141414':'#ffffff';
    rr(ctx,x,y,cw,ht,10);ctx.fill();
    ctx.restore();
    ctx.fillStyle=col;
    rr(ctx,x,y,5,ht,0);ctx.fill();
    ctx.fillStyle=col;ctx.font='12px '+FONT;ctx.textBaseline='top';
    ctx.fillText(t?t.icon:'❔',x+12,y+9);
    ctx.fillText(cardTypeName(c)+(c.role?' · '+roleName(c.role):'')+(c.dur?' · '+fmtDur(c.dur):''),x+30,y+10);
    if(c.done){ctx.fillStyle=dark?'#6ecd71':'#2ea86b';ctx.font='bold 13px '+FONT;ctx.fillText('✓',x+cw-20,y+8);}
    ctx.fillStyle=dark?'#eee':'#222';ctx.font='bold 14px '+FONT;
    var ty=y+34;
    wrapText(c.title||'',ctx,cw-26).forEach(function(ln){ctx.fillText(ln,x+13,ty);ty+=20;});
    if(c.text){
      ctx.fillStyle=dark?'#999':'#666';ctx.font='13px '+FONT;
      wrapText(c.text,ctx,cw-26).forEach(function(ln){ctx.fillText(ln,x+13,ty);ty+=19;});
    }
    if(c.tags&&c.tags.length){
      ctx.font='10px '+FONT;ctx.fillStyle=dark?'#999':'#888';
      var tx=x+13;
      (c.tags||[]).forEach(function(tg){
        var tw2=ctx.measureText('#'+tg).width+12;
        ctx.fillStyle=dark?'#1a1a1a':'#f0f0f0';
        rr(ctx,tx,ty,tw2,16,8);ctx.fill();
        ctx.strokeStyle=dark?'#262626':'#e0e0e0';ctx.lineWidth=1;
        rr(ctx,tx,ty,tw2,16,8);ctx.stroke();
        ctx.fillStyle=dark?'#999':'#666';
        ctx.fillText('#'+tg,tx+6,ty+3);
        tx+=tw2+6;
      });
    }
  });
  board.texts.forEach(function(t){
    var fs=t.size==='s'?12:t.size==='l'?22:16;
    ctx.fillStyle=t.color?TEXT_COLORS[t.color]:(dark?'#eee':'#222');
    ctx.font=fs+'px '+FONT;
    var ty=t.y;
    wrapText(t.text,ctx,320).forEach(function(ln){ctx.fillText(ln,t.x,ty);ty+=fs*1.45;});
  });
  var url=cv.toDataURL('image/png');
  if(!opts.silent){
    var b64=url.split(',')[1];
    var bin=atob(b64);
    var arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    smartDownload(new Blob([arr],{type:'image/png'}),'debate-tactical-board-'+sanitize(board.name)+'.png','image/png');
  }
  return url;
}

function aiTab(name){

function aiSnapshot(){
  var L=[];
  L.push(t('snapBoard')+board.name);
  L.push(t('snapMotion')+(board.topic||(lang==='en'?'(empty)':'未填写'))+' | '+t('snapSide')+(board.side?(lang==='en'?(board.side==='正方'?'Pro':'Con'):board.side):(lang==='en'?'Unset':'未定'))+' | '+t('snapFormat')+(board.format?(lang==='en'?(board.format==='传辩'?'Traditional':board.format==='奥瑞冈'?'Oregon':board.format):board.format):(lang==='en'?'Unset':'未定')));
  L.push('');
  var idx={};TYPE_ORDER.forEach(function(t,i){idx[t]=i;});
  var cards=board.cards.slice().sort(function(a,b){
    var ia=idx[a.type]!=null?idx[a.type]:99, ib=idx[b.type]!=null?idx[b.type]:99;
    return ia-ib||a.createdAt-b.createdAt;
  });
  cards.forEach(function(c){
    L.push('【'+cardTypeName(c)+(c.role?' · '+roleName(c.role):'')+'】'+(c.title||(lang==='en'?'(untitled)':'(无标题)'))); 
    if(c.text)L.push(c.text);
    L.push(t('snapTags')+((c.tags&&c.tags.length)?c.tags.map(tagName).join('、'):(lang==='en'?'none':'无'))+' | '+(lang==='en'?'Done: ':'完成：')+(c.done?(lang==='en'?'yes':'是'):(lang==='en'?'no':'否'))+(c.dur?' | '+(lang==='en'?'Dur: ':'时长：')+fmtDur(c.dur):''));
    L.push('');
  });
  board.links.forEach(function(l){
    var lt=LINK_TYPES[l.type]||LINK_TYPES[''];
    L.push(t('snapLink')+cardTitle(l.from)+' —（'+linkName(l.type)+(l.label?' · '+l.label:'')+'）→ '+cardTitle(l.to));
  });
  if(board.links.length)L.push('');
  board.texts.forEach(function(tx){L.push(t('snapNote')+tx.text);});
  if(board.shapes.length)L.push(t('snapShapes')+board.shapes.length+t('snapShapes2'));
  var s=L.join('\n');
  if(s.length>24000)s=s.slice(0,24000)+t('snapTruncated');
  return s;
}
function scrollAIOut(){var o=$('#aiOut');o.scrollTop=o.scrollHeight;}
async function aiStart(){
  var key=($('#aiKey').value.trim())||localStorage.getItem('debate_coach_api_key')||'';
  var url=($('#aiUrl').value.trim())||localStorage.getItem('debate_coach_api_url')||'https://api.deepseek.com/v1';
  var model=($('#aiModel').value.trim())||localStorage.getItem('debate_coach_model')||'deepseek-v4-flash';
  var missing=[];
  if(!key)missing.push('API Key');
  if(!url)missing.push('URL');
  if(!model)missing.push('Model');
  if(missing.length){toast(t('fillCfg')+t('fillMissing')+missing.join(' / ')+t('fillMissing2'));return;}
  aiSaveSilent(key,url,model);
  var ep=url.replace(/\/+$/,'');
  if(!/\/chat\/completions$/.test(ep))ep+='/chat/completions';
  var mode=aiModeCur;
  var sys=AI_PROMPTS[mode][lang];
  var user=aiSnapshot();
  if(mode==='free'){
    var ins=$('#aiCustom').value.trim();
    if(ins)user=ins+'\n\n'+(lang==='en'?'Here is the board content:\n\n':'以下是战术板内容：\n\n')+user;
  }
  var out=$('#aiOut');
  out.textContent=t('running')+aiModeName(mode)+t('running2');
  $('#aiStartBtn').classList.add('hidden');
  $('#aiStopBtn').classList.remove('hidden');
  aiCtrl=new AbortController();
  var acc='';
  try{
    var res=await fetch(ep,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:model,messages:[{role:'system',content:sys},{role:'user',content:user}],stream:true,temperature:.6}),
      signal:aiCtrl.signal
    });
    if(!res.ok){
      var errText='';
      try{errText=await res.text();}catch(e){}
      out.textContent=t('aiFail')+res.status+t('aiFail2')+(errText.slice(0,400)||t('aiCheckCfg'));
      toast(t('aiReqFail'));
      return;
    }
    var ct=res.headers.get('content-type')||'';
    if(ct.indexOf('text/event-stream')>=0){
      var reader=res.body.getReader();
      var dec=new TextDecoder();
      var buf='';
      while(true){
        var r=await reader.read();
        if(r.done)break;
        buf+=dec.decode(r.value,{stream:true});
        var lines=buf.split('\n');
        buf=lines.pop();
        for(var i=0;i<lines.length;i++){
          var ln=lines[i].trim();
          if(ln.indexOf('data:')!==0)continue;
          var data=ln.slice(5).trim();
          if(data==='[DONE]')continue;
          try{
            var j=JSON.parse(data);
            var d=j.choices&&j.choices[0]&&j.choices[0].delta;
            if(d&&d.content){acc+=d.content;out.textContent=acc;scrollAIOut();}
          }catch(e2){}
        }
      }
    }else{
      var j2=await res.json();
      if(j2.choices&&j2.choices[0])acc=(j2.choices[0].message&&j2.choices[0].message.content)||'';
      out.textContent=acc;
    }
  }catch(err){
    if(err.name==='AbortError'){
      out.textContent+=acc?acc+t('stopped'):t('stopped');
    }else{
      out.textContent=t('aiErr')+err.message;
      toast(t('aiReqErr'));
    }
  }finally{
    $('#aiStartBtn').classList.remove('hidden');
    $('#aiStopBtn').classList.add('hidden');
    aiCtrl=null;
  }
  if(acc.trim())aiAddRecord(mode,acc);
}
function aiStop(){if(aiCtrl)aiCtrl.abort();}
function aiOutText(){var o=$('#aiOut');return o?o.textContent:'';}
function aiCopy(){
  var t=aiOutText();
  if(!t){toast(t('noCopy'));return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast(t('copiedOk'));},function(){toast(t('copyFail'));});
  }else{
    var ta=document.createElement('textarea');
    ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast(t('copiedOk'));}catch(e){toast(t('copyFail'));}
    ta.remove();
  }
}
function aiDownload(){
  var t=aiOutText();
  if(!t){toast(t('noDownload'));return;}
  download(t,'debate-tactical-board-'+sanitize(board.name)+'-'+aiModeName(aiModeCur)+'.md','text/markdown;charset=utf-8');
}
function aiSaveCard(){
  var t=aiOutText();
  if(!t){toast(t('noSaveCard'));return;}
  pushUndo();
  var r=$('#stage').getBoundingClientRect();
  var p=screenToWorld(r.left+r.width/2,r.top+r.height/2);
  var c={id:uid(),type:'note',title:(lang==='en'?'AI · ':'AI整理 · ')+aiModeName(aiModeCur)+' · '+fmtTime(Date.now()),text:t.slice(0,4000),x:p.x-110,y:p.y-60,done:false,tags:[],color:''};
  board.cards.push(c);
  save();render();
  sel={kind:'card',ids:[c.id]};renderPanel();
  toast(t('savedAsCard'));
}
function aiAddRecord(mode,text){
  try{
    var recs=JSON.parse(localStorage.getItem(LS_REC)||'[]');
    if(!Array.isArray(recs))recs=[];
    recs.unshift({id:uid(),time:Date.now(),boardId:board.id,boardName:board.name,mode:aiModeName(mode)||mode,text:text});
    if(recs.length>50)recs=recs.slice(0,50);
    localStorage.setItem(LS_REC,JSON.stringify(recs));
  }catch(e){}
}
function getAIRecords(){
  try{var r=JSON.parse(localStorage.getItem(LS_REC)||'[]');return Array.isArray(r)?r:[];}catch(e){return [];}
}
function renderAIRecords(){
  var recs=getAIRecords();
  var box=$('#aiRec');
  if(!box)return;
  if(!recs.length){box.innerHTML='<div class="hint" style="color:var(--gray);font-size:13px">'+t('noRec')+'</div>';return;}
  var h='';
  recs.forEach(function(r){
    h+='<div class="rec"><div class="rec-meta">'+esc(r.boardName)+' · '+esc(r.mode)+' · '+fmtTime(r.time)+'</div>'
      +'<div class="rec-prev">'+esc(r.text.slice(0,120))+'</div>'
      +'<div class="rec-actions">'
      +'<button class="btn-sm" onclick="aiViewRec(\''+r.id+'\')">'+t('viewRec')+'</button>'
      +'<button class="btn-sm" onclick="aiCopyRec(\''+r.id+'\')">'+t('copyRec')+'</button>'
      +'<button class="btn-sm danger" onclick="aiDelRec(\''+r.id+'\')">'+t('delRec')+'</button>'
      +'</div></div>';
  });
  box.innerHTML=h;
}
function aiViewRec(id){
  var r=getAIRecords().find(function(x){return x.id===id;});
  if(!r)return;
  aiTab('run');
  $('#aiOut').textContent=r.text;
}
function aiCopyRec(id){
  var r=getAIRecords().find(function(x){return x.id===id;});
  if(!r)return;
  var ta=document.createElement('textarea');
  ta.value=r.text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast(t('copiedOk'));}catch(e){toast(t('copyFail'));}
  ta.remove();
}
function aiDelRec(id){
  var recs=getAIRecords().filter(function(x){return x.id!==id;});
  localStorage.setItem(LS_REC,JSON.stringify(recs));
  renderAIRecords();
}

  createLink:function(a,b){return createLink(a,b);},

  createShape:function(kind,x,y,w,h,opts){
