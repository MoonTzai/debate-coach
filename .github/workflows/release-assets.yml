name: Publish release assets

# Legacy/manual fallback only. Normal releases are published through FolderBridge Git Publisher.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve version
        id: release
        shell: pwsh
        run: |
          $v = Get-Content -LiteralPath version.json -Raw | ConvertFrom-Json
          $tag = [string]$v.tag
          if (-not $tag) { throw 'version.json has no tag' }
          $apk = "Debate-Coach-APK-$tag.apk"
          $exe = "Debate-Coach-Windows-$tag-WebView2.exe"
          if (-not (Test-Path -LiteralPath Debate-Coach-web.html -PathType Leaf)) { throw 'missing Debate-Coach-web.html' }
          if (-not (Test-Path -LiteralPath $apk -PathType Leaf)) { throw "missing $apk" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "apk=$apk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install pinned Windows build dependencies
        id: deps
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.22.2" "pywebview==6.2.1" "pillow==11.3.0"

      - name: Extract transparent Totoro icon
        id: icon
        shell: pwsh
        run: |
          python WindowsApp/extract-icon.py
          if ($LASTEXITCODE -ne 0) { throw "icon extraction failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath WindowsApp/generated/Debate-Coach.ico -PathType Leaf)) { throw 'generated icon missing' }

      - name: Build single-file WebView2 EXE
        id: build
        shell: pwsh
        env:
          EXE: ${{ steps.release.outputs.exe }}
        run: |
          $name = [IO.Path]::GetFileNameWithoutExtension($env:EXE)
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --name $name `
            --version-file WindowsApp/windows_version_info.txt `
            --manifest WindowsApp/windows_dpi_manifest.xml `
            --icon WindowsApp/generated/Debate-Coach.ico `
            --add-data "Debate-Coach-web.html;." `
            --collect-all webview `
            --hidden-import clr `
            --hidden-import webview.platforms.winforms `
            --hidden-import webview.platforms.edgechromium `
            --distpath dist `
            --workpath build `
            --specpath spec `
            WindowsApp/host.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path dist $env:EXE) -PathType Leaf)) { throw 'built EXE missing' }

      - name: Smoke embedded master
        id: smoke
        shell: pwsh
        env:
          EXE: ${{ steps.release.outputs.exe }}
        run: |
          $exePath = Join-Path dist $env:EXE
          $p = Start-Process -FilePath $exePath -ArgumentList '--smoke' -PassThru -Wait
          $smoke = [IO.Path]::ChangeExtension($exePath, '.smoke.txt')
          if (-not (Test-Path -LiteralPath $smoke -PathType Leaf)) { throw "smoke report missing; exit=$($p.ExitCode)" }
          $report = Get-Content -LiteralPath $smoke -Raw
          $masterSha = (Get-FileHash -Algorithm SHA256 -LiteralPath Debate-Coach-web.html).Hash.ToLowerInvariant()
          if ($report -notmatch [regex]::Escape("embedded_master_sha256=$masterSha")) { throw 'embedded master SHA mismatch' }
          if ($p.ExitCode -ne 0 -and $report -notmatch 'webview2_runtime=MISSING') { throw "EXE smoke failed unexpectedly: $($p.ExitCode)" }
          if ($report -match 'webview2_runtime=MISSING') { Write-Host 'CI runner has no WebView2 Runtime; package-integrity smoke passed and local UI smoke remains authoritative.' }
          Write-Host $report

      - name: Prepare friendly Release filenames
        id: friendly
        shell: pwsh
        env:
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.release.outputs.apk }}
          EXE: ${{ steps.release.outputs.exe }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $web = "Debate-Coach-web-$env:TAG（网页版）.html"
          $apk = ([IO.Path]::GetFileNameWithoutExtension($env:APK) + '（安卓版）.apk')
          $exe = ([IO.Path]::GetFileNameWithoutExtension($env:EXE) + '（Windows版）.exe')
          Copy-Item -LiteralPath Debate-Coach-web.html -Destination (Join-Path release-assets $web)
          Copy-Item -LiteralPath $env:APK -Destination (Join-Path release-assets $apk)
          Copy-Item -LiteralPath (Join-Path dist $env:EXE) -Destination (Join-Path release-assets $exe)
          "web=$web" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "apk=$apk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate SHA256SUMS
        id: sums
        shell: pwsh
        env:
          WEB: ${{ steps.friendly.outputs.web }}
          APK: ${{ steps.friendly.outputs.apk }}
          EXE: ${{ steps.friendly.outputs.exe }}
        run: |
          $files = @($env:WEB, $env:APK, $env:EXE)
          $lines = foreach ($name in $files) {
            $file = Join-Path release-assets $name
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content -LiteralPath (Join-Path release-assets SHA256SUMS.txt) -Encoding utf8
          Get-Content -LiteralPath (Join-Path release-assets SHA256SUMS.txt)

      - name: Create or update GitHub Release
        id: github_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --title "Debate-Coach $env:TAG" --latest
          } else {
            gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Debate-Coach $env:TAG" --notes "Debate-Coach $env:TAG multi-platform release." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "release create/edit failed: $LASTEXITCODE" }

      - name: Upload and verify Release assets
        id: upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_APK: ${{ steps.release.outputs.apk }}
          SOURCE_EXE: ${{ steps.release.outputs.exe }}
          WEB: ${{ steps.friendly.outputs.web }}
          APK: ${{ steps.friendly.outputs.apk }}
          EXE: ${{ steps.friendly.outputs.exe }}
        run: |
          $legacy = @('Debate-Coach-web.html', $env:SOURCE_APK, $env:SOURCE_EXE)
          foreach ($name in $legacy) {
            gh release delete-asset $env:TAG $name --repo $env:GITHUB_REPOSITORY -y 2>$null
          }
          gh release upload $env:TAG `
            (Join-Path release-assets $env:WEB) `
            (Join-Path release-assets $env:APK) `
            (Join-Path release-assets $env:EXE) `
            (Join-Path release-assets 'SHA256SUMS.txt') `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "release upload failed: $LASTEXITCODE" }
          $names = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          foreach ($required in @($env:WEB, $env:APK, $env:EXE, 'SHA256SUMS.txt')) {
            if ($names -notcontains $required) { throw "release asset missing: $required" }
          }
          foreach ($old in $legacy) {
            if ($names -contains $old) { throw "legacy release asset still present: $old" }
          }
          Write-Host $names

      - name: Write verified release receipt
        id: receipt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          WEB: ${{ steps.friendly.outputs.web }}
          APK: ${{ steps.friendly.outputs.apk }}
          EXE: ${{ steps.friendly.outputs.exe }}
        run: |
          $releaseUrl = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json url --jq '.url'
          if ($LASTEXITCODE -ne 0 -or -not $releaseUrl) { throw 'release URL verification failed' }
          $receipt = [ordered]@{
            tag = $env:TAG
            source_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            release_url = $releaseUrl
            assets = @($env:WEB, $env:APK, $env:EXE, 'SHA256SUMS.txt')
            verified_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $receipt | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath .github/release-status.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git add -- .github/release-status.json
          git commit -m "Record verified $env:TAG release assets"
          if ($LASTEXITCODE -ne 0) { throw "release receipt commit failed: $LASTEXITCODE" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "release receipt push failed: $LASTEXITCODE" }

      - name: Record workflow diagnostic
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          TAG: ${{ steps.release.outputs.tag }}
          DEPS: ${{ steps.deps.outcome }}
          ICON: ${{ steps.icon.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          FRIENDLY: ${{ steps.friendly.outcome }}
          SUMS: ${{ steps.sums.outcome }}
          RELEASE: ${{ steps.github_release.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          RECEIPT: ${{ steps.receipt.outcome }}
        run: |
          $debug = [ordered]@{
            run_id = $env:GITHUB_RUN_ID
            source_sha = $env:GITHUB_SHA
            tag = $env:TAG
            job_status = $env:JOB_STATUS
            steps = [ordered]@{
              deps = $env:DEPS
              icon = $env:ICON
              build = $env:BUILD
              smoke = $env:SMOKE
              friendly = $env:FRIENDLY
              sums = $env:SUMS
              release = $env:RELEASE
              upload = $env:UPLOAD
              receipt = $env:RECEIPT
            }
            recorded_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $debug | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath .github/release-debug.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git add -- .github/release-debug.json
          git commit -m "Record release workflow diagnostic"
          if ($LASTEXITCODE -ne 0) { throw "diagnostic commit failed: $LASTEXITCODE" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "diagnostic push failed: $LASTEXITCODE" }
