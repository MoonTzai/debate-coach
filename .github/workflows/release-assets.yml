name: Publish release assets

# Legacy/manual fallback only. Normal releases are published through FolderBridge Git Publisher.
on:
  push:
    branches: [main]
    paths:
      - version.json
      - Debate-Coach-web.html
      - 'Debate-Coach-APK-v*.apk'
      - 'Debate-Coach-Windows-v*.exe'
      - .github/workflows/release-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-labels:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch historical Release display labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "v9.2.1"
          labels = {
              "Debate-Coach-web-v9.2.1.html": "Debate-Coach-web-v9.2.1\uff08\u7f51\u9875\u7248\uff09.html",
              "Debate-Coach-APK-v9.2.1.apk": "Debate-Coach-APK-v9.2.1\uff08\u5b89\u5353\u7248\uff09.apk",
              "Debate-Coach-Windows-v9.2.1.exe": "Debate-Coach-Windows-v9.2.1\uff08Windows\u7248\uff09.exe",
          }
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "Debate-Coach-Release-Label-Fix",
          }

          def request(url, *, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          release_url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          release = request(release_url)
          by_name = {asset["name"]: asset for asset in release.get("assets", [])}
          for name, label in labels.items():
              asset = by_name.get(name)
              if not asset:
                  continue
              request(
                  f"https://api.github.com/repos/{repo}/releases/assets/{asset['id']}",
                  method="PATCH",
                  payload={"name": name, "label": label},
              )

          verified = request(release_url)
          actual = {asset["name"]: asset.get("label") or "" for asset in verified.get("assets", [])}
          for name, label in labels.items():
              if name in by_name and actual.get(name) != label:
                  raise SystemExit(f"label verification failed: {name}: {actual.get(name)!r} != {label!r}")
          print(json.dumps(labels, ensure_ascii=True, sort_keys=True))
          PY

      - name: Normalize current Release asset names and bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(jq -r '.tag' version.json)"
          web="Debate-Coach-web-${tag}.html"
          apk="Debate-Coach-APK-${tag}.apk"
          exe="Debate-Coach-Windows-${tag}.exe"
          web_label="Debate-Coach-web-${tag}（网页版）.html"
          apk_label="Debate-Coach-APK-${tag}（安卓版）.apk"
          exe_label="Debate-Coach-Windows-${tag}（Windows版）.exe"
          test -f Debate-Coach-web.html
          test -f "$apk"
          test -f "$exe"
          rm -rf release-assets
          mkdir -p release-assets
          cp Debate-Coach-web.html "release-assets/$web"
          cp "$apk" "release-assets/$apk"
          cp "$exe" "release-assets/$exe"
          for legacy in \
            "Debate-Coach-HTML-${tag}.html" \
            "Debate-Coach-web.html" \
            "Debate-Coach-Windows-${tag}-WebView2.exe"; do
            gh release delete-asset "$tag" "$legacy" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
          done
          gh release upload "$tag" \
            "release-assets/$web#$web_label" \
            "release-assets/$apk#$apk_label" \
            "release-assets/$exe#$exe_label" \
            --repo "$GITHUB_REPOSITORY" --clobber
          names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fx "$web" <<<"$names"
          grep -Fx "$apk" <<<"$names"
          grep -Fx "$exe" <<<"$names"
          labels="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | "\(.name)\t\(.label // \"\")"')"
          grep -Fqx "$web"$'\t'"$web_label" <<<"$labels"
          grep -Fqx "$apk"$'\t'"$apk_label" <<<"$labels"
          grep -Fqx "$exe"$'\t'"$exe_label" <<<"$labels"
          if grep -Fx "Debate-Coach-HTML-${tag}.html" <<<"$names"; then exit 1; fi
          if grep -Fx "Debate-Coach-Windows-${tag}-WebView2.exe" <<<"$names"; then exit 1; fi

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize checkout bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
          $worktreeBlob = (git hash-object --no-filters Debate-Coach-web.html).Trim()
          $repoBlob = (git rev-parse HEAD:Debate-Coach-web.html).Trim()
          if ($worktreeBlob -ne $repoBlob) { throw "Debate-Coach-web.html bytes differ from repository blob after normalization" }
          Write-Host "Canonical web blob verified: $repoBlob"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve version
        id: release
        shell: pwsh
        run: |
          $v = Get-Content -LiteralPath version.json -Raw | ConvertFrom-Json
          $tag = [string]$v.tag
          if (-not $tag) { throw 'version.json has no tag' }
          $apk = "Debate-Coach-APK-$tag.apk"
          $exe = "Debate-Coach-Windows-$tag.exe"
          if (-not (Test-Path -LiteralPath Debate-Coach-web.html -PathType Leaf)) { throw 'missing Debate-Coach-web.html' }
          if (-not (Test-Path -LiteralPath $apk -PathType Leaf)) { throw "missing $apk" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "apk=$apk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install pinned Windows build dependencies
        id: deps
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.22.2" "pywebview==6.2.1" "pillow==11.3.0"

      - name: Extract transparent Totoro icon
        id: icon
        shell: pwsh
        run: |
          python WindowsApp/extract-icon.py
          if ($LASTEXITCODE -ne 0) { throw "icon extraction failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath WindowsApp/generated/Debate-Coach.ico -PathType Leaf)) { throw 'generated icon missing' }

      - name: Build single-file WebView2 EXE
        id: build
        shell: pwsh
        env:
          EXE: ${{ steps.release.outputs.exe }}
        run: |
          $root = (Resolve-Path '.').Path
          $name = [IO.Path]::GetFileNameWithoutExtension($env:EXE)
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --name $name `
            --version-file (Join-Path $root 'WindowsApp/windows_version_info.txt') `
            --manifest (Join-Path $root 'WindowsApp/windows_dpi_manifest.xml') `
            --icon (Join-Path $root 'WindowsApp/generated/Debate-Coach.ico') `
            --add-data ((Join-Path $root 'Debate-Coach-web.html') + ';.') `
            --collect-all webview `
            --hidden-import clr `
            --hidden-import webview.platforms.winforms `
            --hidden-import webview.platforms.edgechromium `
            --distpath dist `
            --workpath build `
            --specpath spec `
            (Join-Path $root 'WindowsApp/host.py')
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path dist $env:EXE) -PathType Leaf)) { throw 'built EXE missing' }

      - name: Verify CI build artifact
        id: smoke
        shell: pwsh
        env:
          EXE: ${{ steps.release.outputs.exe }}
        run: |
          $exePath = Join-Path dist $env:EXE
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) { throw 'built EXE missing before Release upload' }
          $size = (Get-Item -LiteralPath $exePath).Length
          if ($size -lt 1048576) { throw "built EXE is unexpectedly small: $size bytes" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exePath).Hash.ToLowerInvariant()
          Write-Host "CI artifact verified: $env:EXE ($size bytes, SHA-256 $hash)"
          Write-Host 'GUI/WebView2 smoke is intentionally not executed on GitHub-hosted Windows runners; the pinned local Windows build passed --smoke before publication.'

      - name: Prepare friendly Release filenames
        id: friendly
        shell: pwsh
        env:
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.release.outputs.apk }}
          EXE: ${{ steps.release.outputs.exe }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $web = "Debate-Coach-web-$env:TAG.html"
          $apk = $env:APK
          $exe = $env:EXE
          Copy-Item -LiteralPath Debate-Coach-web.html -Destination (Join-Path release-assets $web)
          Copy-Item -LiteralPath $env:APK -Destination (Join-Path release-assets $apk)
          Copy-Item -LiteralPath (Join-Path dist $env:EXE) -Destination (Join-Path release-assets $exe)
          "web=$web" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "apk=$apk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate SHA256SUMS
        id: sums
        shell: pwsh
        env:
          WEB: ${{ steps.friendly.outputs.web }}
          APK: ${{ steps.friendly.outputs.apk }}
          EXE: ${{ steps.friendly.outputs.exe }}
        run: |
          $files = @($env:WEB, $env:APK, $env:EXE)
          $lines = foreach ($name in $files) {
            $file = Join-Path release-assets $name
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content -LiteralPath (Join-Path release-assets SHA256SUMS.txt) -Encoding utf8
          Get-Content -LiteralPath (Join-Path release-assets SHA256SUMS.txt)

      - name: Create or update GitHub Release
        id: github_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --title "Debate-Coach $env:TAG" --latest
          } else {
            gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Debate-Coach $env:TAG" --notes "Debate-Coach $env:TAG multi-platform release." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "release create/edit failed: $LASTEXITCODE" }

      - name: Upload and verify Release assets
        id: upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_APK: ${{ steps.release.outputs.apk }}
          SOURCE_EXE: ${{ steps.release.outputs.exe }}
          WEB: ${{ steps.friendly.outputs.web }}
          APK: ${{ steps.friendly.outputs.apk }}
          EXE: ${{ steps.friendly.outputs.exe }}
        run: |
          $legacy = @(
            'Debate-Coach-web.html',
            $env:SOURCE_APK,
            $env:SOURCE_EXE,
            'Debate-Coach-Windows-v9.2.1-WebView2.Windows.exe'
          )
          foreach ($name in $legacy) {
            gh release delete-asset $env:TAG $name --repo $env:GITHUB_REPOSITORY -y 2>$null
          }
          gh release upload $env:TAG `
            ((Join-Path release-assets $env:WEB) + ('#' + ($env:WEB -replace '\.html$', '（网页版）.html'))) `
            ((Join-Path release-assets $env:APK) + ('#' + ($env:APK -replace '\.apk$', '（安卓版）.apk'))) `
            ((Join-Path release-assets $env:EXE) + ('#' + ($env:EXE -replace '\.exe$', '（Windows版）.exe'))) `
            (Join-Path release-assets 'SHA256SUMS.txt') `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "release upload failed: $LASTEXITCODE" }
          $names = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          foreach ($required in @($env:WEB, $env:APK, $env:EXE, 'SHA256SUMS.txt')) {
            if ($names -notcontains $required) { throw "release asset missing: $required" }
          }
          @'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "Debate-Coach-Release-Verify",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          expected = {
              os.environ["WEB"]: os.environ["WEB"].removesuffix(".html") + "（网页版）.html",
              os.environ["APK"]: os.environ["APK"].removesuffix(".apk") + "（安卓版）.apk",
              os.environ["EXE"]: os.environ["EXE"].removesuffix(".exe") + "（Windows版）.exe",
          }
          actual = {asset.get("name"): asset.get("label") or "" for asset in release.get("assets", [])}
          for name, label in expected.items():
              if actual.get(name) != label:
                  raise SystemExit(f"release asset label mismatch: {name}: {actual.get(name)!r} != {label!r}")
          print(json.dumps(expected, ensure_ascii=True, sort_keys=True))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "release asset label verification failed: $LASTEXITCODE" }
          foreach ($old in $legacy) {
            if ($names -contains $old) { throw "legacy release asset still present: $old" }
          }
          Write-Host $names

      - name: Write verified release receipt
        id: receipt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          WEB: ${{ steps.friendly.outputs.web }}
          APK: ${{ steps.friendly.outputs.apk }}
          EXE: ${{ steps.friendly.outputs.exe }}
        run: |
          $releaseUrl = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json url --jq '.url'
          if ($LASTEXITCODE -ne 0 -or -not $releaseUrl) { throw 'release URL verification failed' }
          $receipt = [ordered]@{
            tag = $env:TAG
            source_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            release_url = $releaseUrl
            assets = @($env:WEB, $env:APK, $env:EXE, 'SHA256SUMS.txt')
            verified_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $receipt | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath .github/release-status.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git add -- .github/release-status.json
          git commit -m "Record verified $env:TAG release assets"
          if ($LASTEXITCODE -ne 0) { throw "release receipt commit failed: $LASTEXITCODE" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "release receipt push failed: $LASTEXITCODE" }

      - name: Record workflow diagnostic
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          TAG: ${{ steps.release.outputs.tag }}
          DEPS: ${{ steps.deps.outcome }}
          ICON: ${{ steps.icon.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          FRIENDLY: ${{ steps.friendly.outcome }}
          SUMS: ${{ steps.sums.outcome }}
          RELEASE: ${{ steps.github_release.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          RECEIPT: ${{ steps.receipt.outcome }}
        run: |
          $debug = [ordered]@{
            run_id = $env:GITHUB_RUN_ID
            source_sha = $env:GITHUB_SHA
            tag = $env:TAG
            job_status = $env:JOB_STATUS
            steps = [ordered]@{
              deps = $env:DEPS
              icon = $env:ICON
              build = $env:BUILD
              smoke = $env:SMOKE
              friendly = $env:FRIENDLY
              sums = $env:SUMS
              release = $env:RELEASE
              upload = $env:UPLOAD
              receipt = $env:RECEIPT
            }
            recorded_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $debug | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath .github/release-debug.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git add -- .github/release-debug.json
          git commit -m "Record release workflow diagnostic"
          if ($LASTEXITCODE -ne 0) { throw "diagnostic commit failed: $LASTEXITCODE" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "diagnostic push failed: $LASTEXITCODE" }
