<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flowing Tool · Debate Note-Taking</title>
<style>
:root{--bg:#0d0d0d;--card:#141414;--border:#222;--input-bg:#1a1a1a;--gold:#ffc000;--text:#eee;--gray:#999;--dark-gray:#555;--blue:#4fa8ee;--green:#6ecd71;--red:#ee5555;--radius:8px;--radius-sm:6px}
body.light{--bg:#f5f5f5;--card:#fff;--border:#e0e0e0;--input-bg:#f0f0f0;--gold:#4f6bed;--text:#222;--gray:#666;--dark-gray:#999;--blue:#4f6bed;--green:#4caf50;--red:#e53935}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:var(--card);padding:14px 24px 14px 80px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative}
header h1{font-size:16px;color:var(--gold);position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
.home-btn{position:absolute;left:20px}
header .step-label{font-size:12px;color:var(--gray)}
main{flex:1;overflow-y:auto;padding:20px;max-width:920px;margin:0 auto;width:100%}

.step-bar{display:flex;align-items:center;justify-content:center;gap:6px;margin:16px 0 20px;flex-wrap:wrap;font-size:13px}
.step-bar .dot{width:10px;height:10px;border-radius:50%;background:var(--border);flex-shrink:0}
.step-bar .dot.done{background:var(--green)}
.step-bar .dot.current{background:var(--gold)}
.step-bar .sep{color:var(--dark-gray);font-size:11px;flex-shrink:0}
.step-bar .label{color:var(--gray);font-size:12px}
.step-bar .label.current{color:var(--gold);font-weight:bold}
.step-bar .label.done{color:var(--green)}

.round-name-center{text-align:center;font-size:18px;color:var(--gold);font-weight:bold;margin-bottom:20px}

.start-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:24px}
.start-wrap .logo{font-size:36px;margin-bottom:8px}
.start-wrap h2{color:var(--gold);font-size:22px}
.start-wrap .desc{color:var(--gray);font-size:14px;line-height:1.7;max-width:420px}
.start-wrap .desc li{list-style:none;margin:4px 0}
.start-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}

.btn{background:var(--card);color:var(--gray);border:1px solid var(--border);padding:10px 20px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--on-accent);border:none;font-weight:bold}
.btn.gold:hover{opacity:.85}
body.light .btn.gold{color:var(--on-accent)}
.btn-sm{background:var(--card);border:1px solid var(--border);color:var(--gray);padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:inherit}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm.danger{color:var(--red);border-color:transparent}
.btn-sm.danger:hover{border-color:var(--red)}
.btn-sm.gold{border-color:var(--gold);color:var(--gold)}
.btn-sm.gold:hover{background:var(--gold);color:var(--on-accent)}
body.light .btn-sm.gold:hover{color:var(--on-accent)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h3{color:var(--gold);font-size:15px;margin:0 0 8px 0;border-bottom:1px solid var(--border);padding-bottom:6px}
.card h4{font-size:13px;color:var(--gray);margin:8px 0 4px}

.row-inp{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.row-inp label{color:var(--gray);font-size:12px;width:96px;min-width:96px;padding-top:9px;flex-shrink:0}
.row-inp input,.row-inp textarea,.row-inp select{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none}
.row-inp textarea{min-height:72px;resize:vertical;width:100%;word-wrap:break-word;white-space:pre-wrap}
.row-inp input:focus,.row-inp textarea:focus,.row-inp select:focus{border-color:var(--gold)}

.plus-one-row{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.plus-one-row .plus-label{color:var(--gray);font-size:12px;min-width:70px;padding-top:9px;flex-shrink:0}
.plus-one-row .ta-wrap{flex:1}
.plus-one-row .ta-wrap textarea{width:100%;min-height:72px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none;resize:vertical;word-wrap:break-word;white-space:pre-wrap}
.plus-one-row .ta-wrap textarea:focus{border-color:var(--gold)}
.plus-one-row .plus-col{display:flex;flex-direction:column;justify-content:flex-end;flex-shrink:0;padding-bottom:2px}

select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none}
select:focus{border-color:var(--gold)}

.round-config{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:var(--input-bg);border-radius:var(--radius-sm);font-size:13px}
.round-config select{min-width:90px}
.round-config .config-text{color:var(--text);font-size:14px;white-space:nowrap}

.vs-divider{text-align:center;padding:8px 0;color:var(--gold);font-weight:bold;font-size:15px}
.side-divider{border:none;border-top:2px dashed var(--border);margin:16px 0}

#footer-bar{padding:12px 80px 12px 80px;border-top:1px solid var(--border);flex-shrink:0;display:flex;justify-content:center;background:var(--card);align-items:center;position:relative;gap:8px;flex-wrap:wrap;min-height:48px}
#footer-bar .spacer{flex:1}
#footer-bar .home-btn-left{position:absolute;left:20px;top:50%;transform:translateY(-50%)}
#footer-bar .start-btn-left{position:absolute;left:20px;top:50%;transform:translateY(-50%)}

.summary-box textarea{min-height:160px;font-size:14px;line-height:1.7;width:100%;word-wrap:break-word;white-space:pre-wrap}
.export-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px}
.export-group h3{color:var(--gold);font-size:14px;margin-bottom:10px}
.export-group .note{color:var(--gray);font-size:12px;margin-bottom:10px}

#theme-toggle{background:transparent;border:1px solid var(--border);color:var(--gray);padding:10px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit}
#theme-toggle:hover{border-color:var(--gold);color:var(--gold)}

.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mb-8{margin-bottom:8px}
.hidden{display:none !important}
.text-sm{font-size:12px}.text-gray{color:var(--gray)}
@media(max-width:600px){
  header{padding:10px 14px;flex-wrap:wrap;gap:6px}.home-btn{position:static;margin-right:auto}header h1{font-size:14px;position:static;transform:none;margin:4px 0;width:100%;text-align:center;order:5}header span{margin-left:auto}
  header .btn-sm{position:static;font-size:11px;padding:6px 8px}
  #theme-toggle{font-size:11px;padding:6px 8px}
  main{padding:12px}
  .card{padding:14px}
  .step-bar .label{font-size:10px}
  .round-config{font-size:12px}
  .row-inp{flex-direction:column;gap:4px}.row-inp label{padding-top:0}
  .plus-one-row{flex-direction:column;gap:4px}.plus-one-row .plus-label{padding-top:0}
  #footer-bar{padding:10px 8px;gap:6px}
  #footer-bar .start-btn-left{position:static;transform:none;font-size:12px;padding:6px 10px}
  #footer-bar .btn{padding:8px 12px;font-size:13px}
  #footer-bar .btn-sm{padding:8px 10px;font-size:12px}
}
</style>

<body class="light">
<header>
  <button onclick="window.location.href='toolbox.html'" class="btn-sm home-btn">Home</button>
  <h1>Debate · Flowing Tool <span class="step-label" id="match-title-label"></span></h1>
  <span style="display:flex;gap:8px;align-items:center;margin-left:auto">
    <button id="theme-toggle" onclick="toggleTheme()">Theme</button><button class="btn-sm" id="lang-toggle" onclick="localStorage.setItem('debate_coach_lang','zh');window.location.href='简易流水单-Flowing-Tool.html'">中文</button>
  </span>
</header>
<div id="step-bar-container"></div>
<main id="main"></main>
<div id="footer-bar">
  <button onclick="goStart()" class="btn start-btn-left" style="padding:10px 12px">Start</button>
  <span id="footer-btns" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center"></span>
</div>

<script>

// Data
var M=null;
var VIEW=0; // 0=start, 1=opening, 2=round, 3=summary
var roundIdx=0;
var STORAGE_KEY='flowing_v2_data';
var STORAGE_LIST_KEY='flowing_v2_matches';

var POSITIONS=['','1st Speaker','2nd Speaker','3rd Speaker','4th Speaker','5th Speaker','6th Speaker','Coach','Judge','Other','N/A'];
var ROUND_TYPES=['Select','Cross-Examination','Direct Confrontation','Deposition','Rebuttal','Summary','Free Debate','Closing Speech','Surprise Attack','Judge Q&A','Other'];

function save(){if(M){M._updated=Date.now();localStorage.setItem(STORAGE_KEY,JSON.stringify(M));}}

function newMatch(){
  return {
    title:'', date:new Date().toISOString(), _summaryVisited:false,
    rounds:[{
      name:'Constructive',type:'opening',proPlayer:'1st Speaker',conPlayer:'1st Speaker',
      proStance:'Pro',conStance:'Con',
      pro:{definition:'',scope:'',standard:'',points:['',''],value:'',other:['']},
      con:{definition:'',scope:'',standard:'',points:['',''],value:'',other:['']}
    }],
    assessment:{proStruct:'',conStruct:'',proArg:'',conArg:'',impression:'',value:'',overall:'',otherAssess:''},
    lastView:1
  };
}

function loadMatch(){
  try{var s=localStorage.getItem(STORAGE_KEY);if(s){M=JSON.parse(s);migrateData();return true;}}catch(e){}
  return false;
}

function migrateData(){
  if(!M||!M.rounds)return;
  if(!M.rounds[0].proStance)M.rounds[0].proStance='Pro';
  if(!M.rounds[0].conStance)M.rounds[0].conStance='Con';
  M.rounds.forEach(function(r){
    if(r.type==='opening'){
      ['pro','con'].forEach(function(side){
        var o=r[side];
        if(typeof o.points==='string')o.points=o.points?[o.points,'']:['',''];
        if(!Array.isArray(o.points))o.points=['',''];
        if(o.points.length<2)o.points.push('');
        if(typeof o.other==='string')o.other=o.other?[o.other]:[''];
        if(!Array.isArray(o.other))o.other=[''];
      });
    }
    if(!r.mergedNote)r.mergedNote='';
  });
  if(!M.assessment)M.assessment={proStruct:'',conStruct:'',proArg:'',conArg:'',impression:'',value:'',overall:'',otherAssess:''};
  if(M.assessment.otherAssess===undefined)M.assessment.otherAssess='';
  delete M.assessment.aiNotes;
  if(M._summaryVisited===undefined)M._summaryVisited=false;
  if(M.lastView===undefined)M.lastView=1;
  if(M.lastRoundIdx===undefined)M.lastRoundIdx=0;
}

// View switching
function goStart(){VIEW=0;render();}
function goOpening(){VIEW=1;render();}
function goRound(idx){VIEW=2;roundIdx=idx;render();}
function goSummary(){save();M._summaryVisited=true;M._lastRoundBeforeSummary=roundIdx;VIEW=3;render();}
function gotoLast(){if(M&&M.lastView!==undefined&&M.lastView>0){VIEW=M.lastView;if(VIEW===2)roundIdx=(M.lastRoundIdx!==undefined?M.lastRoundIdx:M.rounds.length-1);render();}else if(M){goOpening();}}

function render(){
  if(M){M.lastView=VIEW;M.lastRoundIdx=roundIdx;}save();
  renderStepBar();
  var m=document.getElementById('main');
  var f=document.getElementById('footer-btns');
  updateTitleLabel();
  if(VIEW===0){renderStart(m,f);}
  else if(VIEW===1){renderOpening(m,f);}
  else if(VIEW===2){renderRound(m,f,roundIdx);}
  else if(VIEW===3){renderSummary(m,f);}
}

// Step bar
function renderStepBar(){
  var container=document.getElementById('step-bar-container');
  if(!M||VIEW===0){container.innerHTML='';return;}
  var total=M.rounds.length+1;
  var steps=[{name:'Constructive',idx:1}];
  M.rounds.forEach(function(r,i){if(r.type!=='opening')steps.push({name:r.name,idx:steps.length+1});});
  steps.push({name:'Summary',idx:total});
  var h='<div class="step-bar">';
  steps.forEach(function(s,i){
    var cls='',labelCls='';
    if(s.name==='Constructive'&&(VIEW===1||(VIEW===2&&roundIdx===0))){cls=' current';labelCls=' current';}
    else if(VIEW===2&&M.rounds[roundIdx]&&M.rounds[roundIdx].name===s.name&&M.rounds[roundIdx].type!=='opening'){cls=' current';labelCls=' current';}
    else if(VIEW===3&&s.name==='Summary'){cls=' current';labelCls=' current';}
    else if(VIEW===3||(VIEW===2&&i<=roundIdx)){cls=' done';labelCls=' done';}
    h+='<span class="dot'+cls+'"></span>';
    h+='<span class="label'+labelCls+'">'+s.idx+'/'+total+'. '+s.name+'</span>';
    if(i<steps.length-1)h+='<span class="sep">──</span>';
  });
  h+='</div>';
  container.innerHTML=h;
}

// View 0: Start
function renderStart(m,f){
  f.innerHTML='';
  var hasMatch=!!M;
  var h='<div class="start-wrap">';
  h+='<div class="logo">📋</div>';
  h+='<h2>Debate · Flowing Tool</h2>';
  h+='<div class="desc"><ul>';
  h+='<li>📝 <b>Constructive Case</b> — Map both sides: definition, criterion, arguments, value</li>';
  h+='<li>🎙️ <b>Round Notes</b> — Record clash content round by round</li>';
  h+='<li>📊 <b>Post-Match Summary</b> — Auto-compiled flow, multi-dimensional assessment</li>';
  h+='<li>📁 <b>Import / Export</b> — Format templates, JSON/MD/HTML/CSV/TXT</li>';
  h+='</ul></div>';
  h+='<div class="start-actions">';
  if(hasMatch)h+='<button class="btn gold" onclick="gotoLast()">Continue Last Match</button>';
  h+='<button class="btn'+(hasMatch?'':' primary')+'" onclick="startNew()">New Match</button>';
  h+='<button class="btn-sm" onclick="document.getElementById(\'load-file\').click()">Load Match</button>';
  h+='<button class="btn-sm" onclick="document.getElementById(\'import-template\').click()">Import Template</button>';
  h+='</div>';
  h+='<input type="file" id="load-file" accept=".json" class="hidden" onchange="loadFromFile(this)">';
  h+='<input type="file" id="import-template" accept=".json" class="hidden" onchange="importTemplate(this)">';
  if(hasMatch){
    h+='<p class="text-sm text-gray mt-12">Match in progress: '+(M.title||'(Untitled)')+'（'+new Date(M.date).toLocaleString()+'）</p>';
  }
  h+=renderMatchList();
  h+='<div style="margin-top:24px"><button class="btn-sm danger" onclick="clearAllData()">Clear All Data</button></div>';
  h+='</div>';
  m.innerHTML=h;
}

function clearAllData(){
  if(!confirm('Clear all match data?\n\nThis will delete all locally stored flowing data including the current match and match history.\nThis cannot be undone.'))return;
  if(!confirm('Confirm: Really delete all data?'))return;
  try{
    var list=JSON.parse(localStorage.getItem(STORAGE_LIST_KEY)||'[]');
    list.forEach(function(item){localStorage.removeItem('flowing_v2_'+item.key);});
    localStorage.removeItem(STORAGE_LIST_KEY);
  }catch(e){}
  localStorage.removeItem(STORAGE_KEY);
  M=null;VIEW=0;render();
  alert('Cache cleared.');
}

function renderMatchList(){
  try{
    var list=JSON.parse(localStorage.getItem(STORAGE_LIST_KEY)||'[]');
    if(!list.length)return'';
    var h='<div class="card" style="max-width:500px;text-align:left;margin-top:20px"><h3>Saved Matches</h3>';
    list.forEach(function(item,i){
      h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">';
      h+='<span style="flex:1;cursor:pointer" onclick="loadMatchByKey(\''+item.key+'\')">'+(item.title||'Untitled')+' <span class="text-sm text-gray">'+new Date(item.date).toLocaleString()+'</span></span>';
      h+='<button class="btn-sm danger" onclick="deleteMatch(\''+item.key+'\',this)">Delete</button>';
      h+='</div>';
    });
    h+='</div>';
    return h;
  }catch(e){return'';}
}

function startNew(){
  M=newMatch();VIEW=1;roundIdx=0;save();saveToList();render();
}

function loadFromFile(input){
  if(!input.files||!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(data.rounds&&Array.isArray(data.rounds)){M=data;migrateData();M._updated=Date.now();save();saveToList();gotoLast();}
      else{alert('Invalid match file format.');}
    }catch(ex){alert('JSON parse error: '+ex.message);}
  };
  reader.readAsText(input.files[0]);input.value='';
}

function loadMatchByKey(key){
  try{var s=localStorage.getItem('flowing_v2_'+key);if(s){M=JSON.parse(s);migrateData();save();gotoLast();}}catch(e){}
}

function deleteMatch(key,btn){
  if(!confirm('Delete this match?'))return;
  localStorage.removeItem('flowing_v2_'+key);
  try{
    var list=JSON.parse(localStorage.getItem(STORAGE_LIST_KEY)||'[]');
    list=list.filter(function(x){return x.key!==key;});
    localStorage.setItem(STORAGE_LIST_KEY,JSON.stringify(list));
  }catch(e){}
  if(btn)btn.closest('div').remove();render();
}

function saveToList(){
  if(!M)return;
  try{
    var list=JSON.parse(localStorage.getItem(STORAGE_LIST_KEY)||'[]');
    var key='match_'+Date.now();
    localStorage.setItem('flowing_v2_'+key,JSON.stringify(M));
    var existing=list.findIndex(function(x){return x.title===M.title&&x.date===M.date;});
    var entry={key:key,title:M.title||'Untitled',date:M.date||new Date().toISOString()};
    if(existing>=0)list[existing]=entry;else list.push(entry);
    if(list.length>50)list=list.slice(-50);
    localStorage.setItem(STORAGE_LIST_KEY,JSON.stringify(list));
  }catch(e){}
}

// View 1: Opening
function renderOpening(m,f){
  var r=M.rounds[0];
  var h='<div class="round-name-center">Constructive</div>';
  h+='<div style="text-align:center;margin-bottom:16px"><input value="'+esc(M.title||'')+'" oninput="M.title=this.value;save();updateTitleLabel()" placeholder="Click to enter match title" style="background:transparent;border:none;border-bottom:1px dashed var(--border);color:var(--text);font-size:14px;text-align:center;padding:4px 12px;width:300px;max-width:100%;font-family:inherit;outline:none"></div>';
  h+='<div class="card"><h3>Proposition</h3>';
  h+=openingFields('pro',r.proPlayer,'setRoundField(0,\'proPlayer\',this.value)');
  h+='</div>';
  h+='<div class="vs-divider">'+(r.proStance||'Pro')+' VS '+(r.conStance||'Con')+'</div>';
  h+='<div class="card"><h3>Opposition</h3>';
  h+=openingFields('con',r.conPlayer,'setRoundField(0,\'conPlayer\',this.value)');
  h+='</div>';

  f.innerHTML='<button class="btn gold" onclick="nextFromOpening()">Next →</button>';

function openingFields(side,playerVal,playerOnchange){
  var stanceKey=side==='pro'?'proStance':'conStance';
  var stanceVal=M.rounds[0][stanceKey]||(side==='pro'?'Pro':'Con');
  var h='<div class="row-inp"><label>Stance</label><input value="'+esc(stanceVal)+'" oninput="setRoundField(0,\''+stanceKey+'\',this.value)" placeholder="Enter stance name"></div>';
  h+='<div class="row-inp"><label>Speaker</label><select onchange="'+playerOnchange+'">'+POSITIONS.map(function(x){return'<option '+(playerVal===x?'selected':'')+'>'+(x||'— Select —')+'</option>';}).join('')+'</select></div>';
  var o=M.rounds[0][side];
  var fields=[['Inherent Definition (Domain)','definition'],['Scope of Discussion','scope'],['Criterion','standard']];
  fields.forEach(function(f){
    h+='<div class="row-inp"><label>'+f[0]+'</label><textarea oninput="setOpeningField(0,\''+side+'\',\''+f[1]+'\',this.value)" placeholder="Enter text">'+esc(o[f[1]]||'')+'</textarea></div>';
  });
  // Points array
  if(!o.points||!Array.isArray(o.points))o.points=['',''];
  if(o.points.length<2)o.points.push('');
  o.points.forEach(function(pt,i){
    h+='<div class="plus-one-row">';
    h+='<span class="plus-label">Sub-Argument'+(o.points.length>1?(i+1):'')+'</span>';
    h+='<div class="ta-wrap"><textarea oninput="setOpeningArrField(0,\''+side+'\',\'points\','+i+',this.value)" placeholder="Enter text">'+esc(pt)+'</textarea></div>';
    if(i===o.points.length-1)h+='<div class="plus-col"><button class="plus-one-btn" onclick="addOpeningArrField(0,\''+side+'\',\'points\')">+1</button></div>';
    h+='</div>';
  });
  // Value
  h+='<div class="row-inp"><label>Value Point</label><textarea oninput="setOpeningField(0,\''+side+'\',\'value\',this.value)" placeholder="Enter text">'+esc(o.value||'')+'</textarea></div>';
  // Other array
  if(!o.other||!Array.isArray(o.other))o.other=[''];
  o.other.forEach(function(ot,i){
    h+='<div class="plus-one-row">';
    h+='<span class="plus-label">Additional'+(o.other.length>1?(i+1):'')+'</span>';
    h+='<div class="ta-wrap"><textarea oninput="setOpeningArrField(0,\''+side+'\',\'other\','+i+',this.value)" placeholder="Enter text">'+esc(ot)+'</textarea></div>';
    if(i===o.other.length-1)h+='<div class="plus-col"><button class="plus-one-btn" onclick="addOpeningArrField(0,\''+side+'\',\'other\')">+1</button></div>';
    h+='</div>';
  });
  return h;
}

function setOpeningField(ri,side,field,val){M.rounds[ri][side][field]=val;save();}
function setOpeningArrField(ri,side,arrName,idx,val){
  if(!M.rounds[ri][side][arrName])M.rounds[ri][side][arrName]=[''];
  M.rounds[ri][side][arrName][idx]=val;save();
}
function addOpeningArrField(ri,side,arrName){
  M.rounds[ri][side][arrName].push('');save();render();
}
function setRoundField(ri,field,val){M.rounds[ri][field]=val;save();}

function nextFromOpening(){
  if(!M.rounds[1]){M.rounds.push({name:'Select',type:null,proPlayer:'',conPlayer:'',proContent:'',conContent:'',mergedNote:''});save();}
  VIEW=2;roundIdx=1;render();
}

// View 2: Round
function renderRound(m,f,idx){

  if(!r.proContent)r.proContent='';
  if(!r.conContent)r.conContent='';
  if(!r.mergedNote)r.mergedNote='';
  var proStance=M.rounds[0].proStance||'Pro';
  var conStance=M.rounds[0].conStance||'Con';
  var h='<div class="round-name-center">'+r.name+' · '+esc(proStance)+' VS '+esc(conStance)+'</div>';
  // Config bar
  h+='<div class="round-config">';
  h+='<span class="config-text">Round</span>';
  h+='<select onchange="onRoundTypeChange('+idx+',this)">'+ROUND_TYPES.map(function(x){return'<option '+(r.name===x?'selected':'')+'>'+x+'</option>';}).join('')+'</select>';
  h+='<span class="config-text">, Pro</span>';
  h+='<select onchange="setRoundField('+idx+',\'proPlayer\',this.value)">'+POSITIONS.map(function(x){return'<option '+(r.proPlayer===x?'selected':'')+'>'+(x||'— Select —')+'</option>';}).join('')+'</select>';
  h+='<span class="config-text"> VS Con</span>';
  h+='<select onchange="setRoundField('+idx+',\'conPlayer\',this.value)">'+POSITIONS.map(function(x){return'<option '+(r.conPlayer===x?'selected':'')+'>'+(x||'— Select —')+'</option>';}).join('')+'</select>';
  h+='</div>';
  // Pro
  h+='<div class="card"><h3>Pro'+(r.proPlayer?' · '+r.proPlayer:'')+'</h3>';
  h+='<div class="row-inp"><textarea style="min-height:140px" oninput="setRoundField('+idx+',\'proContent\',this.value)" placeholder="Enter notes">'+esc(r.proContent)+'</textarea></div>';
  h+='</div>';
  h+='<div class="vs-divider">'+esc(proStance)+' VS '+esc(conStance)+'</div>';
  // Con
  h+='<div class="card"><h3>Con'+(r.conPlayer?' · '+r.conPlayer:'')+'</h3>';
  h+='<div class="row-inp"><textarea style="min-height:140px" oninput="setRoundField('+idx+',\'conContent\',this.value)" placeholder="Enter notes">'+esc(r.conContent)+'</textarea></div>';
  h+='</div>';
  // Merged
  h+='<div class="card"><h3>Merged Notes</h3>';

  h+='</div>';
  m.innerHTML=h;

  var isLastRound=(idx===M.rounds.length-1);
  var isSummary= (r.name==='Closing Speech');
  var shouldConfirm= isLastRound && (isSummary || M._summaryVisited);
  var summaryBtnLabel=M._summaryVisited?'Back to Summary':'Finish Match & Summarize';

  f.innerHTML='';
  f.innerHTML+='<button class="btn" onclick="goPrev('+idx+')">← Prev</button>';
  f.innerHTML+='<button class="btn gold" onclick="goOpening()">Constructive</button>';

  f.innerHTML+='<button class="btn gold" onclick="goNext('+idx+','+(shouldConfirm?'true':'false')+')">Next →</button>';
  f.innerHTML+='<button class="btn-sm" style="margin-left:8px" onclick="goSummary()">'+summaryBtnLabel+'</button>';

    f.innerHTML+='<button class="btn-sm danger" style="margin-left:16px" onclick="deleteRound('+idx+')">Delete Round</button>';
  }
}

function onRoundTypeChange(idx,sel){
  var val=sel.value;
  if(val==='Select'){M.rounds[idx].name='Select';save();render();return;}
  if(val==='Other'){
    var custom=prompt('Enter custom round name:','Other');
    if(custom&&custom.trim())val=custom.trim();else{M.rounds[idx].name='Other';sel.value='Other';save();return;}
  }
  M.rounds[idx].name=val;
  if(val==='Free Debate'){M.rounds[idx].proPlayer='Other';M.rounds[idx].conPlayer='Other';}
  else if(val==='Closing Speech'){M.rounds[idx].proPlayer='4th Speaker';M.rounds[idx].conPlayer='4th Speaker';}
  save();render();
}

function goPrev(idx){
  save();
  if(idx<=1){goOpening();return;}
  VIEW=2;roundIdx=idx-1;render();
}

function goNext(idx,shouldConfirm){
  save();
  if(shouldConfirm){
    if(!confirm('This is the closing round or the last round before summary. Add another round?'))return;
  }
  var nextIdx=idx+1;
  if(!M.rounds[nextIdx]){
    M.rounds.splice(nextIdx,0,{name:'Select',type:null,proPlayer:'',conPlayer:'',proContent:'',conContent:'',mergedNote:''});save();
  }
  VIEW=2;roundIdx=nextIdx;render();
}

function deleteRound(idx){
  if(idx===0){alert('The constructive round cannot be deleted.');return;}
  if(!confirm('Delete "'+M.rounds[idx].name+'" round? This cannot be undone.'))return;
  M.rounds.splice(idx,1);save();
  if(M.rounds.length<=1){goOpening();return;}
  if(roundIdx>=M.rounds.length)roundIdx=M.rounds.length-1;
  render();
}

  f.innerHTML+='<span class="spacer"></span>';
  f.innerHTML+='<button class="btn-sm danger" onclick="clearAllData()">Clear All Data</button>';

function buildSideSummary(side){
  var lines=[];
  M.rounds.forEach(function(r){
    var label='['+r.name+']';
    if(side==='pro'){
      if(r.type==='opening'){
        var o=r.pro;
        lines.push(label);
        if(o.definition)lines.push('Inherent Definition (Domain): '+o.definition);
        if(o.scope)lines.push('Scope of Discussion: '+o.scope);
        if(o.standard)lines.push('Criterion: '+o.standard);
        var pts=Array.isArray(o.points)?o.points:[o.points];
        pts.forEach(function(p,i){if(p)lines.push('Sub-Argument'+(pts.length>1?(i+1):'')+': '+p);});
        if(o.value)lines.push('Value Point: '+o.value);
        var oths=Array.isArray(o.other)?o.other:[o.other];
        oths.forEach(function(ot,i){if(ot)lines.push('Additional'+(oths.length>1?(i+1):'')+': '+ot);});
      }else{
        if(r.proContent||r.proPlayer)lines.push(label+' '+(r.proPlayer||'')+'\n'+(r.proContent||''));
        else lines.push(label);
        if(r.mergedNote)lines.push('Merged/Notes: '+r.mergedNote);
      }
    }else{
      if(r.type==='opening'){
        var o=r.con;
        lines.push(label);
        if(o.definition)lines.push('Inherent Definition (Domain): '+o.definition);
        if(o.scope)lines.push('Scope of Discussion: '+o.scope);
        if(o.standard)lines.push('Criterion: '+o.standard);
        var pts=Array.isArray(o.points)?o.points:[o.points];
        pts.forEach(function(p,i){if(p)lines.push('Sub-Argument'+(pts.length>1?(i+1):'')+': '+p);});
        if(o.value)lines.push('Value Point: '+o.value);
        var oths=Array.isArray(o.other)?o.other:[o.other];
        oths.forEach(function(ot,i){if(ot)lines.push('Additional'+(oths.length>1?(i+1):'')+': '+ot);});
      }else{
        if(r.conContent||r.conPlayer)lines.push(label+' '+(r.conPlayer||'')+'\n'+(r.conContent||''));
        else lines.push(label);
        if(r.mergedNote)lines.push('Merged/Notes: '+r.mergedNote);
      }
    }
    lines.push('');
  });
  return lines.join('\n');
}

function goPrevFromSummary(){
  save();
  var targetIdx=(M._lastRoundBeforeSummary!==undefined)?M._lastRoundBeforeSummary:(M.rounds.length-1);
  if(targetIdx>=M.rounds.length)targetIdx=M.rounds.length-1;
  if(targetIdx<=0){goOpening();return;}
  VIEW=2;roundIdx=targetIdx;render();
}

function assessField(label,key){
  var val=M.assessment[key]||'';
  return'<div class="row-inp"><label>'+label+'</label><textarea oninput="setAssess(\''+key+'\',this.value)" placeholder="Enter notes">'+esc(val)+'</textarea></div>';
}
function setAssess(key,val){M.assessment[key]=val;save();}

// Export
async function exportMatch(fmt){
  if(!M)return;
  var dateStr=new Date().toLocaleString();
  var title=M.title||'Debate Flow Record';
  var content='';
  if(fmt==='txt'||fmt==='md'){
    content+='# '+title+'\n\n'+dateStr+'\n\n';
    M.rounds.forEach(function(r){
      content+='## '+r.name+'\n\n';
      if(r.type==='opening'){
        content+=sideText(r,'pro','Pro')+'\n';
        content+=sideText(r,'con','Con')+'\n';
      }else{
        content+='### Pro'+(r.proPlayer?' · '+r.proPlayer:'')+'\n'+(r.proContent||'')+'\n\n';
        content+='### Con'+(r.conPlayer?' · '+r.conPlayer:'')+'\n'+(r.conContent||'')+'\n\n';
        if(r.mergedNote)content+='### Merged Notes\n'+r.mergedNote+'\n\n';
      }
    });
    content+='\n\n=== Argument Assessment ===\n'+assessSections();
  }else if(fmt==='html'){
    content='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+title+'</title></head><body>';
    content+='<h1>'+title+'</h1><p>'+dateStr+'</p>';
    M.rounds.forEach(function(r){
      content+='<h2>'+r.name+'</h2>';
      if(r.type==='opening'){content+=sideHTML(r,'pro','Pro');content+=sideHTML(r,'con','Con');}
      else{
        content+='<h3>Pro'+(r.proPlayer?' · '+r.proPlayer:'')+'</h3><p>'+nl2br(r.proContent||'')+'</p>';
        content+='<h3>Con'+(r.conPlayer?' · '+r.conPlayer:'')+'</h3><p>'+nl2br(r.conContent||'')+'</p>';
        if(r.mergedNote)content+='<h3>Merged Notes</h3><p>'+nl2br(r.mergedNote)+'</p>';
      }
    });
    content+=assessHTML()+'</body></html>';
  }else if(fmt==='csv'){
    content='Round,Pro Speaker,Pro Content,Con Speaker,Con Content,Merged Notes\n';
    M.rounds.forEach(function(r){
      if(r.type==='opening'){
        content+=csvCell(r.name)+','+csvCell(r.proPlayer)+','+csvCell(openingToOneLine(r.pro))+','+csvCell(r.conPlayer)+','+csvCell(openingToOneLine(r.con))+',\n';
      }else{
        content+=csvCell(r.name)+','+csvCell(r.proPlayer)+','+csvCell(r.proContent||'')+','+csvCell(r.conPlayer)+','+csvCell(r.conContent||'')+','+csvCell(r.mergedNote||'')+'\n';
      }
    });
    content+='\n\nAssessment Item,Content\n';
    var a=M.assessment;
    content+=csvCell('Pro Structure')+','+csvCell(a.proStruct||'')+'\n';
    content+=csvCell('Con Structure')+','+csvCell(a.conStruct||'')+'\n';
    content+=csvCell('Pro Argument Quality')+','+csvCell(a.proArg||'')+'\n';
    content+=csvCell('Con Argument Quality')+','+csvCell(a.conArg||'')+'\n';
    content+=csvCell('General Impression')+','+csvCell(a.impression||'')+'\n';
    content+=csvCell('Discussion Value')+','+csvCell(a.value||'')+'\n';
    content+=csvCell('Overall Assessment')+','+csvCell(a.overall||'')+'\n';
    content+=csvCell('Other Notes')+','+csvCell(a.otherAssess||'')+'\n';
  }else if(fmt==='json'){
    saveToList();
    var out=JSON.parse(JSON.stringify(M));
    delete out._updated;delete out._proSummary;delete out._conSummary;
    content=JSON.stringify(out,null,2);
  }
  var mime='text/plain;charset=utf-8',ext='txt';
  if(fmt==='md')ext='md';
  else if(fmt==='html'){ext='html';mime='text/html;charset=utf-8';}
  else if(fmt==='csv'){ext='csv';mime='text/csv;charset=utf-8';}
  else if(fmt==='json'){ext='json';mime='application/json';}
  var fname='Flowing-Tool-'+title+'-'+new Date().toISOString().slice(0,10)+'.'+ext;
  await doExport(content,mime,fname);
}

async function doExport(content,mime,fname){
  save();
  var ext=fname.split('.').pop();
  var blob=new Blob(['﻿'+content],{type:mime+';charset=utf-8'});
  if(typeof Capacitor!=='undefined'&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem){
    try{var C=Capacitor,FS=C.Plugins.Filesystem;
      var result=await FS.writeFile({path:'Debate-Coach/'+fname,data:ext==='csv'?'﻿'+content:content,directory:'CACHE',recursive:true,encoding:'utf8'});
      try{var Share=C.Plugins.Share;if(Share&&Share.share)Share.share({title:'Export Flowing Tool',url:result.uri});}catch(e2){}
      alert('Exported: '+fname);return;
    }catch(e){alert('Export failed: '+e.message);return;}
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=fname;a.click();URL.revokeObjectURL(a.href);
}

async function exportTemplate(){
  if(!M)return;
  var tplName=prompt('Template name:',(M.title||'Custom Format')+' Template');
  if(!tplName)return;
  var tpl={type:'flowing_template',name:tplName,rounds:[]};
  M.rounds.forEach(function(r){tpl.rounds.push({name:r.name,type:r.type||null});});
  var content=JSON.stringify(tpl,null,2);
  await doExport(content,'application/json',tplName+'.json');
}

function importTemplate(input){
  if(!input.files||!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var tpl=JSON.parse(e.target.result);
      if(tpl.type!=='flowing_template'||!tpl.rounds){alert('Invalid template file.');return;}
      if(!M)M=newMatch();
      var opening=M.rounds[0];
      var newRounds=[opening];
      tpl.rounds.forEach(function(tr,i){
        if(tr.type==='opening'&&i===0)return;
        var existing=null;
        if(i<M.rounds.length&&M.rounds[i]&&M.rounds[i].name===tr.name)existing=M.rounds[i];
        newRounds.push(existing||{name:tr.name||'Select',type:tr.type||null,proPlayer:'',conPlayer:'',proContent:'',conContent:'',mergedNote:''});
      });
      M.rounds=newRounds;save();
      alert('Template "'+tpl.name+'" imported ('+newRounds.length+' rounds total).');
      goOpening();
    }catch(ex){alert('JSON parse error: '+ex.message);}
  };
  reader.readAsText(input.files[0]);input.value='';
}

// Helpers
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nl2br(s){if(!s)return'';return s.replace(/\n/g,'<br>');}
function csvCell(s){if(!s)return'';return'"'+String(s).replace(/"/g,'""')+'"';}
function openingToOneLine(o){
  var parts=[];
  if(o.definition)parts.push('Definition: '+o.definition);
  if(o.scope)parts.push('Scope: '+o.scope);
  if(o.standard)parts.push('Criterion: '+o.standard);
  var pts=Array.isArray(o.points)?o.points:[o.points];
  pts.forEach(function(p,i){if(p)parts.push('Sub-Argument'+(pts.length>1?(i+1):'')+': '+p);});
  if(o.value)parts.push('Value: '+o.value);
  var oths=Array.isArray(o.other)?o.other:[o.other];
  oths.forEach(function(ot,i){if(ot)parts.push('Additional'+(oths.length>1?(i+1):'')+': '+ot);});
  return parts.join('; ');
}
function sideText(r,side,label){
  var o=r[side];
  if(r.type==='opening'){
    var parts=[];
    if(o.definition)parts.push('Inherent Definition (Domain): '+o.definition);
    if(o.scope)parts.push('Scope of Discussion: '+o.scope);
    if(o.standard)parts.push('Criterion: '+o.standard);
    var pts=Array.isArray(o.points)?o.points:[o.points];
    pts.forEach(function(p,i){if(p)parts.push('Sub-Argument'+(pts.length>1?(i+1):'')+': '+p);});
    if(o.value)parts.push('Value Point: '+o.value);
    var oths=Array.isArray(o.other)?o.other:[o.other];
    oths.forEach(function(ot,i){if(ot)parts.push('Additional'+(oths.length>1?(i+1):'')+': '+ot);});
    return '### '+label+(r[side+'Player']?' · '+r[side+'Player']:'')+'\n'+parts.join('\n\n');
  }
  return '';
}
function sideHTML(r,side,label){
  var o=r[side];
  if(r.type==='opening'){
    var parts=[];
    if(o.definition)parts.push('<p><b>Inherent Definition (Domain)</b>: '+nl2br(o.definition)+'</p>');
    if(o.scope)parts.push('<p><b>Scope of Discussion</b>: '+nl2br(o.scope)+'</p>');
    if(o.standard)parts.push('<p><b>Criterion</b>: '+nl2br(o.standard)+'</p>');
    var pts=Array.isArray(o.points)?o.points:[o.points];
    pts.forEach(function(p,i){if(p)parts.push('<p><b>Sub-Argument'+(pts.length>1?(i+1):'')+'</b>: '+nl2br(p)+'</p>');});
    if(o.value)parts.push('<p><b>Value Point</b>: '+nl2br(o.value)+'</p>');
    var oths=Array.isArray(o.other)?o.other:[o.other];
    oths.forEach(function(ot,i){if(ot)parts.push('<p><b>Additional'+(oths.length>1?(i+1):'')+'</b>: '+nl2br(ot)+'</p>');});
    return '<h3>'+label+(r[side+'Player']?' · '+r[side+'Player']:'')+'</h3>'+parts.join('');
  }
  return '';
}

  var a=M.assessment;
